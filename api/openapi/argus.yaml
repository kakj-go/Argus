    $ref: ./paths/m3.yaml#/kubernetes_pod_logs
  /enterprise/pending-actions:
    $ref: ./paths/m3.yaml#/pending_action_collection
  /enterprise/pending-actions/{action_ref}:
    $ref: ./paths/m3.yaml#/pending_action_item
  /enterprise/pending-actions/{action_ref}/confirm:
    $ref: ./paths/m3.yaml#/pending_action_confirm
  /enterprise/pending-actions/{action_ref}/cancel:
    $ref: ./paths/m3.yaml#/pending_action_cancel
  /enterprise/bastion-scopes:
    $ref: ./paths/m3.yaml#/bastion_collection
  /enterprise/bastion-scopes/{id}:
    $ref: ./paths/m3.yaml#/bastion_item
  /enterprise/bastion-scopes/actions/preview-create:
    $ref: ./paths/m3.yaml#/bastion_preview_create
  /enterprise/bastion-scopes/{id}/actions/preview-update:
    $ref: ./paths/m3.yaml#/bastion_preview_update
  /enterprise/bastion-scopes/{id}/actions/preview-delete:
    $ref: ./paths/m3.yaml#/bastion_preview_delete
  /enterprise/bastion-scopes/{id}/actions/preview-replacement:
    $ref: ./paths/m3.yaml#/bastion_replacement
  /enterprise/connectors:
    $ref: ./paths/m3.yaml#/connector_collection
  /enterprise/connectors/{id}:
    $ref: ./paths/m3.yaml#/connector_item
  /enterprise/connectors/{id}/rotate-certificate:
    $ref: ./paths/m3.yaml#/connector_rotate
  /enterprise/connectors/{id}/actions/preview-uninstall:
    $ref: ./paths/m3.yaml#/connector_preview_uninstall
  /connectors/enroll:
    $ref: ./paths/m3.yaml#/connector_enroll
  /conversations/{conversation_id}/events:
    get:
      operationId: streamConversationEvents
      summary: Resume a conversation event stream.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        "200":
          description: SSE frames whose data field validates as StreamEventEnvelope.
          content:
            text/event-stream:
              schema:
                type: string
        "409":
          description: Resume cursor is expired or bound to a stale authorization version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
