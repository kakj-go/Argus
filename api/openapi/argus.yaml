openapi: 3.1.0
info:
  title: Argus Control Plane Contract
  version: 1.0.0
  description: Shared v1 DTO and stream contracts frozen by milestone M0.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /conversations/{conversation_id}/events:
    get:
      operationId: streamConversationEvents
      summary: Resume a conversation event stream.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        "200":
          description: SSE frames whose data field validates as StreamEventEnvelope.
          content:
            text/event-stream:
              schema:
                type: string
        "409":
          description: Resume cursor is expired or bound to a stale authorization version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
