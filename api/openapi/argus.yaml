openapi: 3.1.0
info:
  title: Argus Control Plane Contract
  version: 1.0.0
  description: Shared v1 DTO and stream contracts frozen by milestone M0.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
