components:
  schemas:
    TrustBundleSnapshot:
      type: object
      additionalProperties: false
      required: [epoch, state, bundle_pem, bundle_sha256, current_ca_fingerprints, next_ca_fingerprints, started_at]
      properties:
        epoch: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [stable, preparing, overlapping, retiring, failed]}
        bundle_pem: {type: string, minLength: 128, maxLength: 131072}
        bundle_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        current_ca_fingerprints:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[a-f0-9]{64}$"}
        next_ca_fingerprints:
          type: array
          uniqueItems: true
          items: {type: string, pattern: "^[a-f0-9]{64}$"}
        started_at: {type: string, format: date-time}
        retire_at: {type: string, format: date-time}
    Locale:
      type: string
      enum: [zh-CN, en-US]
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message_key, request_id]
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message: {type: string}
        request_id: {$ref: "#/components/schemas/RequestId"}
        trace_id: {type: string, minLength: 1}
        retryable: {type: boolean, default: false}
    PartialMetadata:
      type: object
      additionalProperties: false
      required: [partial, reasons]
      properties:
        partial: {type: boolean}
        reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [authorization_filtered, budget_truncated, source_timeout, source_unavailable]
    CursorPage:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, partial]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more: {type: boolean}
        partial: {$ref: "#/components/schemas/PartialMetadata"}
    BatchItemResult:
      type: object
      additionalProperties: false
      required: [item_key, status]
      properties:
        item_key: {type: string, minLength: 1}
        status: {type: string, enum: [succeeded, failed, skipped]}
        resource_ref: {$ref: "#/components/schemas/ResourceRef"}
        error: {$ref: "#/components/schemas/ApiError"}
    BatchResult:
      type: object
      additionalProperties: false
      required: [atomic, partial, items]
      properties:
        atomic:
          type: boolean
          description: True unless an operation explicitly documents best-effort semantics.
        partial: {$ref: "#/components/schemas/PartialMetadata"}
        items:
          type: array
          items: {$ref: "#/components/schemas/BatchItemResult"}
    ResourceRef:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id, version]
      properties:
        resource_type:
          type: string
          enum: [secret, credential, managed_account, host, kubernetes_cluster, bastion_scope, connector, telemetry_query, artifact]
        resource_id: {type: string, minLength: 1}
        version: {type: integer, format: int64, minimum: 1}
    InstallInstructionSet:
      type: object
      additionalProperties: false
      required: [scope, command, expires_at, trust_bundle_epoch, trust_bundle_sha256, installer_sha256, capability_warnings]
      properties:
        scope: {type: string, enum: [linux-system, linux-user, kubernetes]}
        command: {type: string, minLength: 1, maxLength: 131072, writeOnly: true, description: '唯一面向用户展示的一键安装命令。Host 与手工 Connector 下载动态引导脚本；Kubernetes 使用等价的单命令临时脚本执行。'}
        download_tls_mode: {type: string, enum: [strict, insecure-first-fetch]}
        expires_at: {type: string, format: date-time}
        trust_bundle_epoch: {type: integer, format: int64, minimum: 1}
        trust_bundle_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        installer_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        capability_warnings:
          type: array
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 1024}
