components:
  schemas:
    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, selected_model_id, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 256}
        selected_model_id: {type: string, format: uuid}
        status: {type: string, enum: [active, archived]}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ConversationCreate:
      type: object
      additionalProperties: false
      required: [selected_model_id]
      properties:
        title: {type: string, minLength: 1, maxLength: 256}
        selected_model_id: {type: string, format: uuid}
    ConversationUpdate:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        title: {type: string, minLength: 1, maxLength: 256}
        selected_model_id: {type: string, format: uuid}
        status: {type: string, enum: [active, archived]}
        expected_version: {type: integer, format: int64, minimum: 1}
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    MessageCreate:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 1048576}
        command:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [interactive_card.create, interactive_card.revise]}
            card_id: {type: string, format: uuid}
            expected_revision: {type: integer, minimum: 1}
    MessageAccepted:
      type: object
      additionalProperties: false
      required: [event, run]
      properties:
        event: {$ref: ../../schemas/agent/agent.schema.json#/$defs/ConversationEvent}
        run: {$ref: ../../schemas/agent/agent.schema.json#/$defs/Run}
    ConversationEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: ../../schemas/agent/agent.schema.json#/$defs/ConversationEvent}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    RunCommandResult:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run: {$ref: ../../schemas/agent/agent.schema.json#/$defs/Run}
        snapshot: {$ref: ../../schemas/agent/agent.schema.json#/$defs/ContextSnapshot}
    ToolResult:
      type: object
      additionalProperties: false
      required: [result_ref, tool_call_id, tool_id, content_hash, byte_size, partial, projection]
      properties:
        result_ref: {type: string, minLength: 1, maxLength: 128}
        tool_call_id: {type: string, minLength: 1, maxLength: 128}
        tool_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        byte_size: {type: integer, minimum: 0, maximum: 4194304}
        partial: {type: boolean}
        projection: {$ref: ../../schemas/agent/agent.schema.json#/$defs/ToolResultProjection}
    AIModelProtocol:
      type: string
      enum: [chat_completions, responses]
    AIModel:
      type: object
      additionalProperties: false
      required: [id, name, base_url, model_id, api_protocol, context_window_tokens, max_output_tokens, input_price_per_million, output_price_per_million, status, health_status, revision, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        base_url: {type: string, format: uri, maxLength: 2048}
        model_id: {type: string, minLength: 1, maxLength: 256}
        api_protocol: {$ref: '#/components/schemas/AIModelProtocol'}
        context_window_tokens: {type: integer, minimum: 8192}
        max_output_tokens: {type: integer, minimum: 1}
        input_price_per_million: {type: number, minimum: 0}
        output_price_per_million: {type: number, minimum: 0}
        capabilities: {$ref: ../../schemas/agent/agent.schema.json#/$defs/ModelCapabilities}
        status: {type: string, enum: [enabled, disabled]}
        health_status: {type: string, enum: [unknown, healthy, unhealthy]}
        revision: {type: integer, minimum: 1}
        version: {type: integer, format: int64, minimum: 1}
        last_tested_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AIModelTestCreate:
      type: object
      additionalProperties: false
      required: [name, base_url, model_id, api_protocol, api_key, context_window_tokens, max_output_tokens, input_price_per_million, output_price_per_million]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        base_url: {type: string, format: uri, maxLength: 2048}
        model_id: {type: string, minLength: 1, maxLength: 256}
        api_protocol: {$ref: '#/components/schemas/AIModelProtocol'}
        api_key: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
        context_window_tokens: {type: integer, minimum: 8192}
        max_output_tokens: {type: integer, minimum: 1}
        input_price_per_million: {type: number, minimum: 0}
        output_price_per_million: {type: number, minimum: 0}
    AIModelUpdate:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        base_url: {type: string, format: uri, maxLength: 2048}
        model_id: {type: string, minLength: 1, maxLength: 256}
        api_protocol: {$ref: '#/components/schemas/AIModelProtocol'}
        api_key: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
        context_window_tokens: {type: integer, minimum: 8192}
        max_output_tokens: {type: integer, minimum: 1}
        input_price_per_million: {type: number, minimum: 0}
        output_price_per_million: {type: number, minimum: 0}
        status: {type: string, enum: [enabled, disabled]}
        expected_version: {type: integer, format: int64, minimum: 1}
    AIModelTestResult:
      type: object
      additionalProperties: false
      required: [compatible, checks]
      properties:
        compatible: {type: boolean}
        model: {$ref: '#/components/schemas/AIModel'}
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name: {type: string, enum: [basic, streaming, tool_calling, structured_output]}
              status: {type: string, enum: [passed, failed]}
              error_code: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
    AIModelPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AIModel'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    ModelQuota:
      type: object
      additionalProperties: false
      required: [id, model_id, subject_type, subject_id, monthly_amount, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        model_id: {type: string, format: uuid}
        subject_type: {type: string, enum: [department, user]}
        subject_id: {type: string, format: uuid}
        monthly_amount: {type: number, minimum: 0}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ModelQuotaUpsert:
      type: object
      additionalProperties: false
      required: [model_id, subject_type, subject_id, monthly_amount]
      properties:
        model_id: {type: string, format: uuid}
        subject_type: {type: string, enum: [department, user]}
        subject_id: {type: string, format: uuid}
        monthly_amount: {type: number, minimum: 0}
        expected_version: {type: integer, format: int64, minimum: 1}
    ModelUsage:
      type: object
      additionalProperties: false
      required: [model_id, month, input_tokens, output_tokens, amount, request_count, compaction_count]
      properties:
        model_id: {type: string, format: uuid}
        month: {type: string, minLength: 7, maxLength: 7}
        input_tokens: {type: integer, format: int64, minimum: 0}
        output_tokens: {type: integer, format: int64, minimum: 0}
        amount: {type: number, minimum: 0}
        request_count: {type: integer, format: int64, minimum: 0}
        compaction_count: {type: integer, format: int64, minimum: 0}
    ApprovalPolicy:
      type: object
      additionalProperties: false
      required: [id, name, enabled, tool_ids, risks, resource_types, minimum_approvers, separation_of_duty, approver_role_ids, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        enabled: {type: boolean}
        tool_ids: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}}
        risks: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [write, dangerous, critical]}}
        resource_types: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        label_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        minimum_approvers: {type: integer, minimum: 1, maximum: 10}
        separation_of_duty: {type: boolean}
        approver_role_ids: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string, format: uuid}}
        expires_after_seconds: {type: integer, minimum: 60, maximum: 604800, default: 86400}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ApprovalPolicyWrite:
      type: object
      additionalProperties: false
      required: [name, enabled, tool_ids, risks, resource_types, minimum_approvers, separation_of_duty, approver_role_ids, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        enabled: {type: boolean}
        tool_ids: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}}
        risks: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [write, dangerous, critical]}}
        resource_types: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        label_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        minimum_approvers: {type: integer, minimum: 1, maximum: 10}
        separation_of_duty: {type: boolean}
        approver_role_ids: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string, format: uuid}}
        expires_after_seconds: {type: integer, minimum: 60, maximum: 604800, default: 86400}
        expected_version: {type: integer, format: int64, minimum: 0}
    ApprovalRequirement:
      type: object
      additionalProperties: false
      required: [policy_id, policy_version, minimum_approvers, separation_of_duty, approved_count, status]
      properties:
        policy_id: {type: string, format: uuid}
        policy_version: {type: integer, format: int64, minimum: 1}
        minimum_approvers: {type: integer, minimum: 1}
        separation_of_duty: {type: boolean}
        approved_count: {type: integer, minimum: 0}
        status: {type: string, enum: [pending, approved, rejected, invalidated]}
    ApprovalRequestView:
      type: object
      additionalProperties: false
      required: [approval_request_id, action_ref, requirements, decisions, status, expires_at, created_at, updated_at]
      properties:
        approval_request_id: {type: string, format: uuid}
        action_ref: {type: string, minLength: 1, maxLength: 128}
        requirements: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ApprovalRequirement'}}
        decisions: {type: array, items: {$ref: ../../schemas/action/workflow.schema.json#/$defs/ApprovalDecision}}
        status: {type: string, enum: [pending, approved, rejected, expired, invalidated]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ApprovalDecisionCreate:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approved, rejected]}
        reason: {type: string, maxLength: 4096}
    PendingActionCommandResult:
      type: object
      additionalProperties: false
      required: [pending_action]
      properties:
        pending_action: {$ref: ../../schemas/action/pending-action-public.schema.json}
        approval_request: {$ref: '#/components/schemas/ApprovalRequestView'}
        execution: {$ref: ../../schemas/action/workflow.schema.json#/$defs/Execution}
    ExecutionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: ../../schemas/action/workflow.schema.json#/$defs/Execution}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    ActionOneTimeResult:
      type: object
      additionalProperties: false
      required: [schema_version, execution_id, result_kind, enrollment, expires_at]
      properties:
        schema_version: {type: string, const: argus.action_one_time_result/v1}
        execution_id: {type: string, format: uuid}
        result_kind: {type: string, enum: [connector_enrollment]}
        enrollment: {$ref: './m3.yaml#/components/schemas/EnrollmentResult'}
        expires_at: {type: string, format: date-time}
    Automation:
      type: object
      additionalProperties: false
      required: [id, name, service_account_id, tool_id, tool_input, cron, timezone, status, next_run_at, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        service_account_id: {type: string, format: uuid}
        tool_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
        tool_input: {$ref: '../../schemas/common/public-json.schema.json#/$defs/PublicJsonObject'}
        cron: {type: string, minLength: 9, maxLength: 128}
        timezone: {type: string, minLength: 1, maxLength: 128}
        status: {type: string, enum: [enabled, disabled]}
        next_run_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AutomationWrite:
      type: object
      additionalProperties: false
      required: [name, service_account_id, tool_id, tool_input, cron, timezone]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        service_account_id: {type: string, format: uuid}
        tool_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
        tool_input: {$ref: '../../schemas/common/public-json.schema.json#/$defs/PublicJsonObject'}
        cron: {type: string, minLength: 9, maxLength: 128}
        timezone: {type: string, minLength: 1, maxLength: 128}
        expected_version: {type: integer, format: int64, minimum: 1}
    AutomationRun:
      type: object
      additionalProperties: false
      required: [id, automation_id, automation_revision, scheduled_for, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        automation_id: {type: string, format: uuid}
        automation_revision: {type: integer, minimum: 1}
        scheduled_for: {type: string, format: date-time}
        status: {type: string, enum: [pending, running, waiting_approval, succeeded, failed, skipped, cancelled]}
        pending_action_ref: {type: string}
        result_ref: {type: string}
        error_code: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SandboxBackend:
      type: object
      additionalProperties: false
      required: [id, name, endpoint, status, health_status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        endpoint: {type: string, format: uri, maxLength: 2048}
        status: {type: string, enum: [enabled, disabled]}
        health_status: {type: string, enum: [unknown, healthy, unhealthy]}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SandboxBackendWrite:
      type: object
      additionalProperties: false
      required: [name, endpoint, status, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        endpoint: {type: string, format: uri, maxLength: 2048}
        api_key: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
        status: {type: string, enum: [enabled, disabled]}
        expected_version: {type: integer, format: int64, minimum: 0}
    SandboxImage:
      type: object
      additionalProperties: false
      required: [id, backend_id, name, image_ref, digest, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        backend_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        image_ref: {type: string, minLength: 1, maxLength: 1024}
        digest: {type: string, minLength: 71, maxLength: 71}
        status: {type: string, enum: [enabled, disabled]}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SandboxImageWrite:
      type: object
      additionalProperties: false
      required: [backend_id, name, image_ref, digest, status, expected_version]
      properties:
        backend_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        image_ref: {type: string, minLength: 1, maxLength: 1024}
        digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        status: {type: string, enum: [enabled, disabled]}
        expected_version: {type: integer, format: int64, minimum: 0}
    SandboxProfile:
      type: object
      additionalProperties: false
      required: [id, name, backend_id, image_id, task_kinds, cpu_millis, memory_mib, timeout_seconds, network_mode, status, revision, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        backend_id: {type: string, format: uuid}
        image_id: {type: string, format: uuid}
        task_kinds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [smoke, attachment_processing]}}
        cpu_millis: {type: integer, minimum: 100, maximum: 16000}
        memory_mib: {type: integer, minimum: 128, maximum: 65536}
        timeout_seconds: {type: integer, minimum: 10, maximum: 3600}
        network_mode: {type: string, enum: [none, restricted]}
        status: {type: string, enum: [enabled, disabled]}
        revision: {type: integer, minimum: 1}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SandboxProfileWrite:
      type: object
      additionalProperties: false
      required: [name, backend_id, image_id, task_kinds, cpu_millis, memory_mib, timeout_seconds, network_mode, status, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        backend_id: {type: string, format: uuid}
        image_id: {type: string, format: uuid}
        task_kinds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [smoke, attachment_processing]}}
        cpu_millis: {type: integer, minimum: 100, maximum: 16000}
        memory_mib: {type: integer, minimum: 128, maximum: 65536}
        timeout_seconds: {type: integer, minimum: 10, maximum: 3600}
        network_mode: {type: string, enum: [none, restricted]}
        status: {type: string, enum: [enabled, disabled]}
        expected_version: {type: integer, format: int64, minimum: 0}
    SandboxQuota:
      type: object
      additionalProperties: false
      required: [enterprise_id, max_concurrent_sessions, monthly_session_seconds, version, created_at, updated_at]
      properties:
        enterprise_id: {type: string, format: uuid}
        max_concurrent_sessions: {type: integer, minimum: 0, maximum: 10000}
        monthly_session_seconds: {type: integer, format: int64, minimum: 0}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SandboxQuotaWrite:
      type: object
      additionalProperties: false
      required: [max_concurrent_sessions, monthly_session_seconds, expected_version]
      properties:
        max_concurrent_sessions: {type: integer, minimum: 0, maximum: 10000}
        monthly_session_seconds: {type: integer, format: int64, minimum: 0}
        expected_version: {type: integer, format: int64, minimum: 0}
    SandboxSession:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, task_id, profile_id, profile_revision, upstream_session_id, status, expires_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        profile_id: {type: string, format: uuid}
        profile_revision: {type: integer, minimum: 1}
        upstream_session_id: {type: string, minLength: 1, maxLength: 256}
        status: {type: string, enum: [creating, running, terminating, terminated, failed, unknown]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SandboxUsage:
      type: object
      additionalProperties: false
      required: [enterprise_id, month, session_count, session_seconds]
      properties:
        enterprise_id: {type: string, format: uuid}
        month: {type: string, minLength: 7, maxLength: 7}
        session_count: {type: integer, format: int64, minimum: 0}
        session_seconds: {type: integer, format: int64, minimum: 0}
