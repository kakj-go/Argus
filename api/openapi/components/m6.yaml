components:
  schemas:
    RemoteAccessProtocol: {type: string, enum: [ssh, winrs]}
    RemoteAccessAction: {type: string, enum: [terminal]}
    RemoteAccessSubjectType: {type: string, enum: [user, department]}
    RemoteAccessSessionStatus:
      type: string
      enum: [requested, awaiting_approval, authorized, connecting, active, terminating, terminated, failed, expired, connection_lost, invalidated]
    RemoteAccessRequestStatus:
      type: string
      enum: [requested, awaiting_mfa, awaiting_approval, authorized, rejected, expired, invalidated]
    RemoteAccessGrant:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, subject_type, subject_id, host_ids, managed_account_ids, protocols, actions, valid_from, valid_until, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        subject_type: {$ref: '#/components/schemas/RemoteAccessSubjectType'}
        subject_id: {type: string, format: uuid}
        host_ids: {type: array, uniqueItems: true, maxItems: 256, items: {type: string, format: uuid}}
        managed_account_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/RemoteAccessGovernanceStatus'}
        version: {type: integer, format: int64, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RemoteAccessGrantWrite:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, host_ids, managed_account_ids, protocols, actions, valid_from, valid_until, status]
      properties:
        subject_type: {$ref: '#/components/schemas/RemoteAccessSubjectType'}
        subject_id: {type: string, format: uuid}
        host_ids: {type: array, uniqueItems: true, maxItems: 256, items: {type: string, format: uuid}}
        managed_account_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        status: {type: string, enum: [draft], default: draft}
    RemoteAccessGrantUpdate:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, host_ids, managed_account_ids, protocols, actions, valid_from, valid_until, expected_version]
      properties:
        subject_type: {$ref: '#/components/schemas/RemoteAccessSubjectType'}
        subject_id: {type: string, format: uuid}
        host_ids: {type: array, uniqueItems: true, maxItems: 256, items: {type: string, format: uuid}}
        managed_account_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        expected_version: {type: integer, format: int64, minimum: 1}
    RemoteAccessGrantPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RemoteAccessGrant'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    RemoteAccessGovernanceStatus:
      type: string
      enum: [draft, enabled, disabled, archived]
    RemoteAccessRuleEffect:
      type: string
      enum: [deny, require_mfa, require_approval, notify]
    RemoteAccessTimeWindow:
      type: object
      additionalProperties: false
      required: [day_of_week, start, end, timezone]
      properties:
        day_of_week: {type: integer, minimum: 0, maximum: 6}
        start: {type: string, minLength: 5, maxLength: 5}
        end: {type: string, minLength: 5, maxLength: 5}
        timezone: {type: string, minLength: 1, maxLength: 64}
    RemoteAccessRule:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, name, description, priority, protocols, actions, source_cidrs, time_windows, effects, status, version, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        priority: {type: integer, minimum: 0, maximum: 10000}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        source_cidrs: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        time_windows: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/RemoteAccessTimeWindow'}}
        effects: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessRuleEffect'}}
        approval_workflow_id: {type: string, format: uuid}
        session_profile_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/RemoteAccessGovernanceStatus'}
        version: {type: integer, format: int64, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RemoteAccessRuleWrite:
      type: object
      additionalProperties: false
      required: [name, description, priority, protocols, actions, source_cidrs, time_windows, effects, status]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        priority: {type: integer, minimum: 0, maximum: 10000}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        source_cidrs: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        time_windows: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/RemoteAccessTimeWindow'}}
        effects: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessRuleEffect'}}
        approval_workflow_id: {type: string, format: uuid}
        session_profile_id: {type: string, format: uuid}
        status: {type: string, enum: [draft], default: draft}
    RemoteAccessRuleUpdate:
      type: object
      additionalProperties: false
      required: [name, description, priority, protocols, actions, source_cidrs, time_windows, effects, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        priority: {type: integer, minimum: 0, maximum: 10000}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        source_cidrs: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
        time_windows: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/RemoteAccessTimeWindow'}}
        effects: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessRuleEffect'}}
        approval_workflow_id: {type: string, format: uuid}
        session_profile_id: {type: string, format: uuid}
        expected_version: {type: integer, format: int64, minimum: 1}
    RemoteAccessRulePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RemoteAccessRule'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    ApprovalWorkflow:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, name, description, approver_role_ids, minimum_approvals, separation_of_duties, approval_timeout_seconds, escalation_after_seconds, timeout_effect, escalation_role_ids, status, version, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        approver_role_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1, maximum: 16}
        separation_of_duties: {type: boolean}
        approval_timeout_seconds: {type: integer, minimum: 60, maximum: 604800}
        escalation_after_seconds: {type: integer, minimum: 30, maximum: 604799}
        timeout_effect: {type: string, enum: [reject, expire]}
        escalation_role_ids: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        status: {$ref: '#/components/schemas/RemoteAccessGovernanceStatus'}
        version: {type: integer, format: int64, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ApprovalWorkflowWrite:
      type: object
      additionalProperties: false
      required: [name, description, approver_role_ids, minimum_approvals, separation_of_duties, approval_timeout_seconds, escalation_after_seconds, timeout_effect, escalation_role_ids, status]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        approver_role_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1, maximum: 16}
        separation_of_duties: {type: boolean}
        approval_timeout_seconds: {type: integer, minimum: 60, maximum: 604800}
        escalation_after_seconds: {type: integer, minimum: 30, maximum: 604799}
        timeout_effect: {type: string, enum: [reject, expire]}
        escalation_role_ids: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        status: {type: string, enum: [draft], default: draft}
    ApprovalWorkflowUpdate:
      type: object
      additionalProperties: false
      required: [name, description, approver_role_ids, minimum_approvals, separation_of_duties, approval_timeout_seconds, escalation_after_seconds, timeout_effect, escalation_role_ids, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        approver_role_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1, maximum: 16}
        separation_of_duties: {type: boolean}
        approval_timeout_seconds: {type: integer, minimum: 60, maximum: 604800}
        escalation_after_seconds: {type: integer, minimum: 30, maximum: 604799}
        timeout_effect: {type: string, enum: [reject, expire]}
        escalation_role_ids: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        expected_version: {type: integer, format: int64, minimum: 1}
    ApprovalWorkflowPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalWorkflow'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    SessionProfile:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, name, description, max_session_seconds, idle_timeout_seconds, recording_mode, command_audit_mode, clipboard_mode, file_upload_mode, file_download_mode, port_forward_mode, session_share_mode, retention_days, status, version, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        max_session_seconds: {type: integer, minimum: 60, maximum: 86400}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 86400}
        recording_mode: {type: string, enum: [required, optional, disabled]}
        command_audit_mode: {type: string, enum: [required, optional, disabled]}
        clipboard_mode: {type: string, enum: [enabled, disabled]}
        file_upload_mode: {type: string, enum: [enabled, disabled]}
        file_download_mode: {type: string, enum: [enabled, disabled]}
        port_forward_mode: {type: string, enum: [enabled, disabled]}
        session_share_mode: {type: string, enum: [enabled, disabled]}
        retention_days: {type: integer, minimum: 1, maximum: 3650}
        status: {$ref: '#/components/schemas/RemoteAccessGovernanceStatus'}
        version: {type: integer, format: int64, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SessionProfileWrite:
      type: object
      additionalProperties: false
      required: [name, description, max_session_seconds, idle_timeout_seconds, recording_mode, command_audit_mode, clipboard_mode, file_upload_mode, file_download_mode, port_forward_mode, session_share_mode, retention_days, status]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        max_session_seconds: {type: integer, minimum: 60, maximum: 86400}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 86400}
        recording_mode: {type: string, enum: [required, optional, disabled]}
        command_audit_mode: {type: string, enum: [required, optional, disabled]}
        clipboard_mode: {type: string, enum: [enabled, disabled]}
        file_upload_mode: {type: string, enum: [enabled, disabled]}
        file_download_mode: {type: string, enum: [enabled, disabled]}
        port_forward_mode: {type: string, enum: [enabled, disabled]}
        session_share_mode: {type: string, enum: [enabled, disabled]}
        retention_days: {type: integer, minimum: 1, maximum: 3650}
        status: {type: string, enum: [draft], default: draft}
    SessionProfileUpdate:
      type: object
      additionalProperties: false
      required: [name, description, max_session_seconds, idle_timeout_seconds, recording_mode, command_audit_mode, clipboard_mode, file_upload_mode, file_download_mode, port_forward_mode, session_share_mode, retention_days, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        max_session_seconds: {type: integer, minimum: 60, maximum: 86400}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 86400}
        recording_mode: {type: string, enum: [required, optional, disabled]}
        command_audit_mode: {type: string, enum: [required, optional, disabled]}
        clipboard_mode: {type: string, enum: [enabled, disabled]}
        file_upload_mode: {type: string, enum: [enabled, disabled]}
        file_download_mode: {type: string, enum: [enabled, disabled]}
        port_forward_mode: {type: string, enum: [enabled, disabled]}
        session_share_mode: {type: string, enum: [enabled, disabled]}
        retention_days: {type: integer, minimum: 1, maximum: 3650}
        expected_version: {type: integer, format: int64, minimum: 1}
    SessionProfilePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SessionProfile'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    RemoteAccessReferences:
      type: object
      additionalProperties: false
      required: [rules, requests, leases, sessions]
      properties:
        rules: {type: integer, minimum: 0}
        requests: {type: integer, minimum: 0}
        leases: {type: integer, minimum: 0}
        sessions: {type: integer, minimum: 0}
    RemoteAccessObjectVersion:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
    RemoteAccessRuleSimulationRequest:
      type: object
      additionalProperties: false
      required: [host_id, managed_account_id, protocol, action, step_up_authenticated]
      properties:
        host_id: {type: string, format: uuid}
        managed_account_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/RemoteAccessProtocol'}
        action: {$ref: '#/components/schemas/RemoteAccessAction'}
        source_ip: {type: string, format: ip}
        evaluation_time: {type: string, format: date-time}
        step_up_authenticated: {type: boolean}
    RemoteAccessApprovalRequirementSimulation:
      type: object
      additionalProperties: false
      required: [workflow_id, workflow_version, approver_role_ids, minimum_approvals, separation_of_duties, approval_timeout_seconds, escalation_after_seconds, timeout_effect, escalation_role_ids, source_rule_ids]
      properties:
        workflow_id: {type: string, format: uuid}
        workflow_version: {type: integer, format: int64, minimum: 1}
        approver_role_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1, maximum: 16}
        separation_of_duties: {type: boolean}
        approval_timeout_seconds: {type: integer, minimum: 60, maximum: 604800}
        escalation_after_seconds: {type: integer, minimum: 30, maximum: 604799}
        timeout_effect: {type: string, enum: [reject, expire]}
        escalation_role_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        source_rule_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
    RemoteAccessSessionProfileSnapshot:
      type: object
      additionalProperties: false
      required: [source_profiles, max_session_seconds, idle_timeout_seconds, recording_mode, command_audit_mode, clipboard_mode, file_upload_mode, file_download_mode, port_forward_mode, session_share_mode, retention_days]
      properties:
        source_profiles: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessObjectVersion'}}
        max_session_seconds: {type: integer, minimum: 60, maximum: 86400}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 86400}
        recording_mode: {type: string, enum: [required, optional, disabled]}
        command_audit_mode: {type: string, enum: [required, optional, disabled]}
        clipboard_mode: {type: string, enum: [enabled, disabled]}
        file_upload_mode: {type: string, enum: [enabled, disabled]}
        file_download_mode: {type: string, enum: [enabled, disabled]}
        port_forward_mode: {type: string, enum: [enabled, disabled]}
        session_share_mode: {type: string, enum: [enabled, disabled]}
        retention_days: {type: integer, minimum: 1, maximum: 3650}
    RemoteAccessRuleSimulationResult:
      type: object
      additionalProperties: false
      required: [outcome, reason_codes, explanation, matched_grants, matched_rules, approval_requirements, session_profile, snapshot_hash]
      properties:
        outcome: {type: string, enum: [allowed, denied, awaiting_mfa, awaiting_approval]}
        reason_codes: {type: array, items: {type: string}}
        explanation: {type: array, items: {type: string}}
        matched_grants: {type: array, items: {$ref: '#/components/schemas/RemoteAccessObjectVersion'}}
        matched_rules: {type: array, items: {$ref: '#/components/schemas/RemoteAccessObjectVersion'}}
        approval_requirements: {type: array, items: {$ref: '#/components/schemas/RemoteAccessApprovalRequirementSimulation'}}
        session_profile: {$ref: '#/components/schemas/RemoteAccessSessionProfileSnapshot'}
        snapshot_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
    RemoteAccessRequirement:
      type: object
      additionalProperties: false
      required: [id, minimum_approvals, separation_of_duties, require_mfa, status, approved_count]
      properties:
        id: {type: string, format: uuid}
        rule_id: {type: string, format: uuid}
        rule_version: {type: integer, format: int64, minimum: 1}
        workflow_id: {type: string, format: uuid}
        workflow_version: {type: integer, format: int64, minimum: 1}
        session_profile_id: {type: string, format: uuid}
        session_profile_version: {type: integer, format: int64, minimum: 1}
        approval_snapshot: {type: object, additionalProperties: true}
        deadline_at: {type: string, format: date-time}
        escalation_at: {type: string, format: date-time}
        escalated_at: {type: string, format: date-time}
        timeout_effect: {type: string, enum: [reject, expire]}
        escalation_role_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1}
        separation_of_duties: {type: boolean}
        require_mfa: {type: boolean}
        status: {type: string, enum: [pending, satisfied, rejected, invalidated]}
        approved_count: {type: integer, minimum: 0}
    RemoteAccessDecision:
      type: object
      additionalProperties: false
      required: [id, request_id, requirement_id, decision, decided_by, decided_at]
      properties:
        id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        requirement_id: {type: string, format: uuid}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, maxLength: 2048}
        decided_by: {type: string, format: uuid}
        decided_at: {type: string, format: date-time}
    RemoteAccessDecisionCreate:
      type: object
      additionalProperties: false
      required: [requirement_id, decision]
      properties:
        requirement_id: {type: string, format: uuid}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, maxLength: 2048}
    AccessRequestCreate:
      type: object
      additionalProperties: false
      required: [host_id, managed_account_id, protocol, action, reason]
      properties:
        host_id: {type: string, format: uuid}
        managed_account_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/RemoteAccessProtocol'}
        action: {$ref: '#/components/schemas/RemoteAccessAction'}
        reason: {type: string, minLength: 1, maxLength: 2048}
    AccessRequest:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, requester_id, grant_id, host_id, managed_account_id, protocol, action, reason, status, requirements, decisions, authorization_version, expires_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        requester_id: {type: string, format: uuid, readOnly: true}
        grant_id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        managed_account_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/RemoteAccessProtocol'}
        action: {$ref: '#/components/schemas/RemoteAccessAction'}
        reason: {type: string, maxLength: 2048}
        status: {$ref: '#/components/schemas/RemoteAccessRequestStatus'}
        requirements: {type: array, items: {$ref: '#/components/schemas/RemoteAccessRequirement'}}
        decisions: {type: array, items: {$ref: '#/components/schemas/RemoteAccessDecision'}}
        authorization_version: {type: integer, format: int64, minimum: 1}
        decision_outcome: {type: string, enum: [allowed, denied, awaiting_mfa, awaiting_approval]}
        decision_reason_codes: {type: array, items: {type: string}}
        decision_snapshot: {type: object, additionalProperties: true}
        decision_snapshot_hash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        matched_grant_snapshots: {type: array, items: {type: object, additionalProperties: true}}
        matched_rule_snapshots: {type: array, items: {type: object, additionalProperties: true}}
        decision_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AccessRequestPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccessRequest'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    AccessLease:
      type: object
      additionalProperties: false
      required: [id, request_id, enterprise_id, user_id, grant_id, host_id, managed_account_id, protocol, action, authorization_version, issued_at, expires_at, revoked]
      properties:
