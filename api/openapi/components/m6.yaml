components:
  schemas:
    RemoteAccessProtocol: {type: string, enum: [ssh, winrs]}
    RemoteAccessAction: {type: string, enum: [terminal]}
    RemoteAccessSubjectType: {type: string, enum: [user, department]}
    RemoteAccessSessionStatus:
      type: string
      enum: [requested, awaiting_approval, authorized, connecting, active, terminating, terminated, failed, expired, connection_lost, invalidated]
    RemoteAccessRequestStatus:
      type: string
      enum: [requested, awaiting_approval, authorized, rejected, expired, invalidated]
    RemoteAccessGrant:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, subject_type, subject_id, host_ids, managed_account_ids, protocols, actions, valid_from, valid_until, enabled, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        subject_type: {$ref: '#/components/schemas/RemoteAccessSubjectType'}
        subject_id: {type: string, format: uuid}
        host_ids: {type: array, uniqueItems: true, maxItems: 256, items: {type: string, format: uuid}}
        host_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        managed_account_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RemoteAccessGrantWrite:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, host_ids, managed_account_ids, protocols, actions, valid_from, valid_until, enabled]
      properties:
        subject_type: {$ref: '#/components/schemas/RemoteAccessSubjectType'}
        subject_id: {type: string, format: uuid}
        host_ids: {type: array, uniqueItems: true, maxItems: 256, items: {type: string, format: uuid}}
        host_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        managed_account_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        enabled: {type: boolean}
    RemoteAccessGrantUpdate:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, host_ids, managed_account_ids, protocols, actions, valid_from, valid_until, enabled, expected_version]
      properties:
        subject_type: {$ref: '#/components/schemas/RemoteAccessSubjectType'}
        subject_id: {type: string, format: uuid}
        host_ids: {type: array, uniqueItems: true, maxItems: 256, items: {type: string, format: uuid}}
        host_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        managed_account_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        actions: {type: array, minItems: 1, maxItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessAction'}}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        enabled: {type: boolean}
        expected_version: {type: integer, format: int64, minimum: 1}
    RemoteAccessGrantPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RemoteAccessGrant'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    RemoteAccessPolicy:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, name, enabled, priority, protocols, minimum_approvals, separation_of_duties, require_mfa, max_session_seconds, idle_timeout_seconds, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 128}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 10000}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        host_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        approver_role_ids: {type: array, uniqueItems: true, maxItems: 64, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1, maximum: 16}
        separation_of_duties: {type: boolean}
        require_mfa: {type: boolean}
        max_session_seconds: {type: integer, minimum: 60, maximum: 3600}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 900}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RemoteAccessPolicyWrite:
      type: object
      additionalProperties: false
      required: [name, enabled, priority, protocols, minimum_approvals, separation_of_duties, require_mfa, max_session_seconds, idle_timeout_seconds]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 10000}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        host_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        approver_role_ids: {type: array, uniqueItems: true, maxItems: 64, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1, maximum: 16}
        separation_of_duties: {type: boolean}
        require_mfa: {type: boolean}
        max_session_seconds: {type: integer, minimum: 60, maximum: 3600}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 900}
    RemoteAccessPolicyUpdate:
      type: object
      additionalProperties: false
      required: [name, enabled, priority, protocols, minimum_approvals, separation_of_duties, require_mfa, max_session_seconds, idle_timeout_seconds, expected_version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 10000}
        protocols: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/RemoteAccessProtocol'}}
        host_selector: {$ref: ../../schemas/labels/labels.schema.json#/$defs/LabelSelector}
        approver_role_ids: {type: array, uniqueItems: true, maxItems: 64, items: {type: string, format: uuid}}
        minimum_approvals: {type: integer, minimum: 1, maximum: 16}
        separation_of_duties: {type: boolean}
        require_mfa: {type: boolean}
        max_session_seconds: {type: integer, minimum: 60, maximum: 3600}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 900}
        expected_version: {type: integer, format: int64, minimum: 1}
    RemoteAccessPolicyPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RemoteAccessPolicy'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    RemoteAccessRequirement:
      type: object
      additionalProperties: false
      required: [id, policy_id, policy_version, minimum_approvals, separation_of_duties, require_mfa, status, approved_count]
      properties:
        id: {type: string, format: uuid}
        policy_id: {type: string, format: uuid}
        policy_version: {type: integer, format: int64, minimum: 1}
        minimum_approvals: {type: integer, minimum: 1}
        separation_of_duties: {type: boolean}
        require_mfa: {type: boolean}
        status: {type: string, enum: [pending, satisfied, rejected, invalidated]}
        approved_count: {type: integer, minimum: 0}
    RemoteAccessDecision:
      type: object
      additionalProperties: false
      required: [id, request_id, requirement_id, decision, decided_by, decided_at]
      properties:
        id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        requirement_id: {type: string, format: uuid}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, maxLength: 2048}
        decided_by: {type: string, format: uuid}
        decided_at: {type: string, format: date-time}
    RemoteAccessDecisionCreate:
      type: object
      additionalProperties: false
      required: [requirement_id, decision]
      properties:
        requirement_id: {type: string, format: uuid}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, maxLength: 2048}
    AccessRequestCreate:
      type: object
      additionalProperties: false
      required: [host_id, managed_account_id, protocol, action, reason]
      properties:
        host_id: {type: string, format: uuid}
        managed_account_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/RemoteAccessProtocol'}
        action: {$ref: '#/components/schemas/RemoteAccessAction'}
        reason: {type: string, minLength: 1, maxLength: 2048}
    AccessRequest:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, requester_id, grant_id, host_id, managed_account_id, protocol, action, reason, status, requirements, decisions, authorization_version, expires_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        requester_id: {type: string, format: uuid, readOnly: true}
        grant_id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        managed_account_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/RemoteAccessProtocol'}
        action: {$ref: '#/components/schemas/RemoteAccessAction'}
        reason: {type: string, maxLength: 2048}
        status: {$ref: '#/components/schemas/RemoteAccessRequestStatus'}
        requirements: {type: array, items: {$ref: '#/components/schemas/RemoteAccessRequirement'}}
        decisions: {type: array, items: {$ref: '#/components/schemas/RemoteAccessDecision'}}
        authorization_version: {type: integer, format: int64, minimum: 1}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AccessRequestPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccessRequest'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    AccessLease:
      type: object
      additionalProperties: false
      required: [id, request_id, enterprise_id, user_id, grant_id, host_id, managed_account_id, protocol, action, authorization_version, issued_at, expires_at, revoked]
      properties:
        id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        user_id: {type: string, format: uuid, readOnly: true}
        grant_id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        managed_account_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/RemoteAccessProtocol'}
        action: {$ref: '#/components/schemas/RemoteAccessAction'}
        authorization_version: {type: integer, format: int64, minimum: 1}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked: {type: boolean}
        revoked_at: {type: string, format: date-time}
    AccessLeasePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccessLease'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    RemoteAccessSessionCreate:
      type: object
      additionalProperties: false
      required: [lease_id, terminal_cols, terminal_rows]
      properties:
        lease_id: {type: string, format: uuid}
        terminal_cols: {type: integer, minimum: 20, maximum: 1000}
        terminal_rows: {type: integer, minimum: 5, maximum: 500}
    RemoteAccessSession:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, user_id, lease_id, host_id, managed_account_id, protocol, connection_mode, status, session_fence, recording_id, idle_timeout_seconds, max_duration_seconds, connect_before, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        user_id: {type: string, format: uuid, readOnly: true}
        lease_id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        managed_account_id: {type: string, format: uuid}
        protocol: {$ref: '#/components/schemas/RemoteAccessProtocol'}
        connection_mode: {type: string, enum: [via_bastion, connector_local, direct_ssh, direct_winrm]}
        status: {$ref: '#/components/schemas/RemoteAccessSessionStatus'}
        session_fence: {type: integer, format: int64, minimum: 1, readOnly: true}
        recording_id: {type: string, format: uuid}
        idle_timeout_seconds: {type: integer, minimum: 60, maximum: 900}
        max_duration_seconds: {type: integer, minimum: 60, maximum: 3600}
        connect_before: {type: string, format: date-time}
        connected_at: {type: string, format: date-time}
        terminated_at: {type: string, format: date-time}
        termination_reason: {type: string, maxLength: 256}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RemoteAccessSessionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RemoteAccessSession'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    SessionTicketResult:
      type: object
      additionalProperties: false
      required: [session_id, ticket, websocket_url, protocol_version, expires_at]
      properties:
        session_id: {type: string, format: uuid}
        ticket: {type: string, minLength: 43, maxLength: 256, writeOnly: true}
        websocket_url: {type: string, pattern: '^wss://[^[:space:]]+$'}
        protocol_version: {type: string, const: argus.remote_access/v1}
        expires_at: {type: string, format: date-time}
    SessionTerminate:
      type: object
      additionalProperties: false
      required: [reason]
      properties: {reason: {type: string, minLength: 1, maxLength: 256}}
    RemoteAccessRecording:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, session_id, status, format, encrypted, chunk_count, event_count, size_bytes, retention_until, created_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        session_id: {type: string, format: uuid}
        status: {type: string, enum: [recording, available, incomplete, failed, expired]}
        format: {type: string, const: asciicast_v2}
        encrypted: {type: boolean, const: true}
        chunk_count: {type: integer, minimum: 0}
        event_count: {type: integer, minimum: 0}
        size_bytes: {type: integer, format: int64, minimum: 0}
        duration_ms: {type: integer, format: int64, minimum: 0}
        final_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        retention_until: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    RecordingEventPage:
      type: object
      additionalProperties: false
      required: [recording, events, next_cursor, complete]
      properties:
        recording: {$ref: '#/components/schemas/RemoteAccessRecording'}
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [time, type, data]
            properties:
              time: {type: number, minimum: 0}
              type: {type: string, enum: [i, o, r, m]}
              data: {}
        next_cursor: {type: string, maxLength: 4096}
        complete: {type: boolean}
