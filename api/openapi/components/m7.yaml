components:
  schemas:
    TelemetrySignal: {type: string, enum: [metrics, logs, traces]}
    CollectorPlatform: {type: string, enum: [linux_arm64, linux_amd64, windows_amd64]}
    CollectorSupportStatus: {type: string, enum: [supported, validation_pending, retired]}
    CollectorRole: {type: string, enum: [direct, leaf, edge_gateway, daemonset, kubernetes_gateway]}
    CollectorStatus: {type: string, enum: [pending_install, installing, converged, degraded, backlog, result_unknown, uninstalling, uninstalled]}
    ConfigRevisionStatus: {type: string, enum: [prepared, applying, effective, failed, rolled_back, superseded]}
    TelemetryRouteKind: {type: string, enum: [direct_argus, bastion_gateway]}
    HostInstallBootstrap:
      type: object
      additionalProperties: false
      required: [collector_id, host_id, desired_revision, mode, expires_at]
      description: '一次性自助安装令牌交换的冻结计划;install 模式额外返回配置包、产物与 enrollment 物料,uninstall 模式仅返回删除指令'
      properties:
        collector_id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        desired_revision: {type: integer, format: int64, minimum: 1}
        config_bundle: {type: string, minLength: 1, maxLength: 1398104, description: '运行时 Collector 配置(JSON)的 base64;install 模式必返'}
        trust_bundle: {type: string, minLength: 1, maxLength: 174764, description: '版本化 Argus Trust Bundle(PEM)的 base64;install 模式必返'}
        trust_bundle_epoch: {type: integer, format: int64, minimum: 1}
        trust_bundle_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        trust_bundle_ca_fingerprints: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string, pattern: '^[a-f0-9]{64}$'}}
        mode: {type: string, enum: [install, uninstall]}
        artifact:
          type: object
          additionalProperties: false
          required: [distribution_version_id, platform, uri, sha256, signature, signing_key_id, byte_size]
          properties:
            distribution_version_id: {type: string, format: uuid}
            platform: {type: string}
            uri: {type: string, format: uri}
            sha256: {type: string, minLength: 64, maxLength: 64}
            signature: {type: string}
            signing_key_id: {type: string}
            byte_size: {type: integer, format: int64, minimum: 1}
        signing_public_key: {type: string, minLength: 43, maxLength: 64, writeOnly: true, description: 'RawStd base64 Ed25519 public key; install fails closed when absent'}
        signing_key_id: {type: string, minLength: 1, maxLength: 128}
        enrollment_token: {type: string, minLength: 16, maxLength: 256, description: '短期 Collector enrollment 令牌,仅本次安装有效'}
        enrollment_endpoint: {type: string, format: uri}
        ingest_grpc_endpoint: {type: string}
        ingest_http_endpoint: {type: string}
        expires_at: {type: string, format: date-time}
    HostUninstallBootstrap:
      type: object
      additionalProperties: false
      required: [host_id, collector_id, completion_url, completion_token, expires_at]
      properties:
        host_id: {type: string, format: uuid}
        collector_id: {type: string, format: uuid}
        completion_url: {type: string, format: uri}
        completion_token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
        expires_at: {type: string, format: date-time}
    TelemetryRouteTransport: {type: string, enum: [direct, executor_tunnel, bastion_tunnel], description: '遥测字节的物理路径,与路由 kind 正交;隧道形态见 PlanV4'}
    CollectorArtifact:
      type: object
      additionalProperties: false
      required: [platform, uri, sha256, signature, signing_key_id, byte_size]
      properties:
        platform: {$ref: '#/components/schemas/CollectorPlatform'}
        uri: {type: string, format: uri, readOnly: true}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        signature: {type: string, minLength: 32, maxLength: 2048, readOnly: true}
        signing_key_id: {type: string, minLength: 1, maxLength: 128, readOnly: true}
        byte_size: {type: integer, format: int64, minimum: 1}
    CollectorDistributionVersion:
      type: object
      additionalProperties: false
      required: [id, name, version, collector_version, config_schema_version, support_status, components, artifacts, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        version: {type: string, minLength: 1, maxLength: 64}
        collector_version: {type: string, minLength: 1, maxLength: 64}
        config_schema_version: {type: string, minLength: 1, maxLength: 64}
        support_status: {$ref: '#/components/schemas/CollectorSupportStatus'}
        components: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        artifacts: {type: array, items: {$ref: '#/components/schemas/CollectorArtifact'}}
        kubernetes_image: {type: string, maxLength: 512, readOnly: true, description: '服务端解析的 Kubernetes 默认镜像引用(未配置时缺省)'}
        created_at: {type: string, format: date-time}
    CollectionProfile:
      type: object
      additionalProperties: false
      required: [id, key, version, name, description, signals, required_components, supported_platforms, claim_types, config_schema_version, support_status]
      properties:
        id: {type: string, format: uuid}
        key: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
        version: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 1024}
        signals: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/TelemetrySignal'}}
        required_components: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        supported_platforms: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/CollectorPlatform'}}
        claim_types: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        config_schema_version: {type: string, minLength: 1, maxLength: 64}
        support_status: {$ref: '#/components/schemas/CollectorSupportStatus'}
    CollectorConfigRevision:
      type: object
      additionalProperties: false
      required: [id, collector_id, revision, profile_ids, config_hash, status, created_at]
      properties:
        id: {type: string, format: uuid}
        collector_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        profile_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        config_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {$ref: '#/components/schemas/ConfigRevisionStatus'}
        failure_code: {type: string, maxLength: 128}
        created_at: {type: string, format: date-time}
        applied_at: {type: string, format: date-time}
    TelemetryRoute:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, collector_id, kind, transport, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        collector_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/TelemetryRouteKind'}
        transport: {$ref: '#/components/schemas/TelemetryRouteTransport'}
        loopback_port: {type: integer, minimum: 1, maximum: 65534, description: '隧道形态下 Collector OTLP 出口的本机回环端口;相邻端口保留给身份注册与轮换;direct 形态为空'}
        tunnel_status: {type: string, enum: [desired, establishing, established, degraded, down, removed], readOnly: true, description: '隧道运行状态;direct 形态为空。隧道断开不等于 Collector 故障'}
        tunnel_last_established_at: {type: string, format: date-time, readOnly: true}
        tunnel_last_drop_reason: {type: string, readOnly: true, maxLength: 256}
        gateway_collector_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, testing, active, degraded, invalidated]}
        last_tested_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CollectorInstance:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, resource_type, resource_id, distribution_version_id, platform, role, status, desired_revision, effective_revision, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        resource_type: {type: string, enum: [host, kubernetes_cluster]}
        resource_id: {type: string, format: uuid}
        distribution_version_id: {type: string, format: uuid}
        platform: {$ref: '#/components/schemas/CollectorPlatform'}
        role: {$ref: '#/components/schemas/CollectorRole'}
        status: {$ref: '#/components/schemas/CollectorStatus'}
        desired_revision: {type: integer, format: int64, minimum: 0}
        effective_revision: {type: integer, format: int64, minimum: 0}
        route: {$ref: '#/components/schemas/TelemetryRoute'}
        last_operation_error_code: {type: string, maxLength: 128, readOnly: true, description: '最近一次管理操作失败的错误码(成功或无记录时缺省)'}
        last_seen_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CollectorEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [collector_id, client_csr_pem, server_csr_pem]
      properties:
        collector_id: {type: string, format: uuid}
        client_csr_pem: {type: string, minLength: 128, maxLength: 16384, writeOnly: true}
        server_csr_pem: {type: string, minLength: 128, maxLength: 16384, writeOnly: true}
    CollectorCertificateResult:
      type: object
      additionalProperties: false
      required: [collector_id, client_certificate_pem, server_certificate_pem, trust_bundle, ingest_grpc_endpoint, ingest_http_endpoint, certificate_expires_at]
      properties:
        collector_id: {type: string, format: uuid}
        client_certificate_pem: {type: string, minLength: 128, maxLength: 32768, writeOnly: true}
        server_certificate_pem: {type: string, minLength: 128, maxLength: 32768, writeOnly: true}
        trust_bundle: {$ref: ./common.yaml#/components/schemas/TrustBundleSnapshot}
        ingest_grpc_endpoint: {type: string, format: uri, readOnly: true}
        ingest_http_endpoint: {type: string, format: uri, readOnly: true}
        certificate_expires_at: {type: string, format: date-time}
    CollectionClaim:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, physical_resource_ref, collector_id, claim_type, signal, selector_hash, ownership, status, created_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        physical_resource_ref: {type: string, minLength: 1, maxLength: 256}
        collector_id: {type: string, format: uuid}
        profile_id: {type: string, format: uuid}
        claim_type: {type: string, minLength: 1, maxLength: 128}
        signal: {$ref: '#/components/schemas/TelemetrySignal'}
        selector_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        ownership: {type: string, enum: [primary, supplemental, migration]}
        status: {type: string, enum: [active, released, conflict, expired]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    KubernetesNodeHostBinding:
      type: object
      additionalProperties: false
      required: [id, enterprise_id, kubernetes_cluster_id, node_uid, node_name, matched_by, evidence_hash, confidence, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        enterprise_id: {type: string, format: uuid, readOnly: true}
        kubernetes_cluster_id: {type: string, format: uuid}
        node_uid: {type: string, minLength: 1, maxLength: 256}
        node_name: {type: string, minLength: 1, maxLength: 253}
        host_id: {type: string, format: uuid}
        matched_by: {type: string, enum: [system_uuid, provider_id, machine_id, collector_host_id, ip, manual]}
        evidence_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        confidence: {type: integer, minimum: 0, maximum: 100}
        status: {type: string, enum: [proposed, verified, rejected, stale]}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NodeHostBindingPreview:
      type: object
      additionalProperties: false
      required: [host_id, expected_version]
      properties:
        host_id: {type: string, format: uuid}
        expected_version: {type: integer, format: int64, minimum: 1}
    CollectorPreview:
      type: object
      additionalProperties: false
      required: [distribution_version_id, profile_ids, route_kind, transport]
      properties:
        distribution_version_id: {type: string, format: uuid}
        profile_ids: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string, format: uuid}}
        route_kind: {$ref: '#/components/schemas/TelemetryRouteKind'}
        transport: {$ref: '#/components/schemas/TelemetryRouteTransport'}
        loopback_port: {type: integer, minimum: 1, maximum: 65534, description: '隧道形态的 OTLP 回环端口;缺省 4317,相邻端口保留给身份注册与轮换'}
        gateway_collector_id: {type: string, format: uuid}
        expected_version: {type: integer, format: int64, minimum: 0}
        kubernetes_image: {type: string, maxLength: 512, pattern: '^\S+:\S+$', description: '集群内网镜像全量地址(含 tag/digest);仅 kubernetes_cluster 资源可填,留空使用服务端默认镜像'}
        image_pull_secrets: {type: array, maxItems: 16, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 253, pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'}, description: '目标集群中已存在的 imagePullSecret 名称;Argus 不创建或读取仓库凭据'}
    TelemetryRetentionPolicy:
      type: object
      additionalProperties: false
      required: [metrics_days, logs_days, traces_days, version]
      properties:
        metrics_days: {type: integer, minimum: 1, maximum: 3650}
        logs_days: {type: integer, minimum: 1, maximum: 3650}
        traces_days: {type: integer, minimum: 1, maximum: 3650}
        version: {type: integer, format: int64, minimum: 1}
    TelemetryUsage:
      type: object
      additionalProperties: false
      required: [period_start, period_end, ingested_bytes, metric_points, log_records, spans, estimated_storage_bytes]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        ingested_bytes: {type: integer, format: int64, minimum: 0}
        metric_points: {type: integer, format: int64, minimum: 0}
        log_records: {type: integer, format: int64, minimum: 0}
        spans: {type: integer, format: int64, minimum: 0}
        estimated_storage_bytes: {type: integer, format: int64, minimum: 0}
    TelemetryOverviewQuery:
      type: object
      additionalProperties: false
      required: [resource_ids, lookback_seconds]
      properties:
        resource_ids: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        lookback_seconds: {type: integer, minimum: 300, maximum: 604800, default: 3600}
    TelemetryOverview:
      type: object
      additionalProperties: false
      required: [resource_count, healthy_collectors, degraded_collectors, metric_points, log_records, spans, window_seconds, partial]
      properties:
        resource_count: {type: integer, minimum: 0}
        healthy_collectors: {type: integer, minimum: 0}
        degraded_collectors: {type: integer, minimum: 0}
        metric_points: {type: integer, format: int64, minimum: 0}
        log_records: {type: integer, format: int64, minimum: 0}
        spans: {type: integer, format: int64, minimum: 0}
        window_seconds: {type: integer, minimum: 300}
        partial: {type: boolean}
    TelemetryQueryTimeRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    TelemetryQueryBudget:
      type: object
      additionalProperties: false
      properties:
        max_scan_bytes: {type: integer, format: int64, minimum: 1, maximum: 1073741824, default: 268435456}
        max_rows: {type: integer, minimum: 1, maximum: 100000, default: 50000}
        max_samples: {type: integer, minimum: 1, maximum: 10000000, default: 5000000}
        max_series: {type: integer, minimum: 1, maximum: 1000000, default: 100000}
        timeout_ms: {type: integer, minimum: 100, maximum: 30000, default: 10000}
        max_result_bytes: {type: integer, format: int64, minimum: 1, maximum: 33554432, default: 8388608}
    PromQLInstantQuery:
      type: object
      additionalProperties: false
      required: [query, resource_ids, time_range]
      properties:
        query: {type: string, minLength: 1, maxLength: 65536}
        resource_ids: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        time_range: {$ref: '#/components/schemas/TelemetryQueryTimeRange'}
        budget: {$ref: '#/components/schemas/TelemetryQueryBudget'}
    PromQLRangeQuery:
      type: object
      additionalProperties: false
      required: [query, resource_ids, time_range, step_seconds]
      properties:
        query: {type: string, minLength: 1, maxLength: 65536}
        resource_ids: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        time_range: {$ref: '#/components/schemas/TelemetryQueryTimeRange'}
        step_seconds: {type: integer, minimum: 1, maximum: 86400}
        budget: {$ref: '#/components/schemas/TelemetryQueryBudget'}
    KQLQuery:
      type: object
      additionalProperties: false
      required: [query, resource_ids, time_range]
      properties:
        query: {type: string, minLength: 1, maxLength: 65536}
        pipeline: {type: string, maxLength: 65536}
        resource_ids: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        time_range: {$ref: '#/components/schemas/TelemetryQueryTimeRange'}
        budget: {$ref: '#/components/schemas/TelemetryQueryBudget'}
    SkyWalkingTraceGraphQLQuery:
      type: object
      additionalProperties: false
      required: [query, resource_ids, time_range]
      properties:
        query: {type: string, minLength: 1, maxLength: 65536}
        operation_name: {type: string, maxLength: 256}
        variables: {type: object, additionalProperties: true}
        resource_ids: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        time_range: {$ref: '#/components/schemas/TelemetryQueryTimeRange'}
        budget: {$ref: '#/components/schemas/TelemetryQueryBudget'}
    TelemetryQueryMeta:
      type: object
      additionalProperties: false
      required: [scanned_bytes, scanned_rows, returned_rows, loaded_samples, elapsed_ms, plan_hash, engine, engine_version, partial]
      properties:
        scanned_bytes: {type: integer, format: int64, minimum: 0}
        scanned_rows: {type: integer, format: int64, minimum: 0}
        returned_rows: {type: integer, format: int64, minimum: 0}
        loaded_samples: {type: integer, format: int64, minimum: 0}
        elapsed_ms: {type: integer, format: int64, minimum: 0}
        plan_hash: {type: string, minLength: 64, maxLength: 64}
        engine: {type: string, minLength: 1, maxLength: 128}
        engine_version: {type: string, minLength: 1, maxLength: 128}
        partial: {type: boolean}
    PrometheusQueryData:
      type: object
      additionalProperties: false
      required: [resultType, result]
      properties:
        resultType: {type: string, enum: [scalar, string, vector, matrix]}
        result: {}
    PrometheusQueryResponse:
      type: object
      additionalProperties: false
      required: [status, data, warnings, argus_meta]
      properties:
        status: {type: string, const: success}
        data: {$ref: '#/components/schemas/PrometheusQueryData'}
        warnings: {type: array, items: {type: string, maxLength: 512}}
        argus_meta: {$ref: '#/components/schemas/TelemetryQueryMeta'}
    KQLQueryResponse:
      type: object
      additionalProperties: false
      required: [schema_version, result_type, data, warnings, partial, meta]
      properties:
        schema_version: {type: string, const: argus.kql_result/v1}
        result_type: {type: string, enum: [log_entries, log_streams]}
        data: {}
        warnings: {type: array, items: {type: string, maxLength: 512}}
        partial: {type: boolean}
        meta: {$ref: '#/components/schemas/TelemetryQueryMeta'}
    SkyWalkingGraphQLError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 1024}
    SkyWalkingGraphQLResponse:
      type: object
      additionalProperties: false
      required: [data, extensions]
      properties:
        data: {type: object, additionalProperties: true}
        errors: {type: array, items: {$ref: '#/components/schemas/SkyWalkingGraphQLError'}}
        extensions:
          type: object
          additionalProperties: false
          required: [argus]
          properties:
            argus: {$ref: '#/components/schemas/TelemetryQueryMeta'}
    CollectorPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CollectorInstance'}}
        page: {$ref: ./common.yaml#/components/schemas/CursorPage}
    RouteTestCreate:
      type: object
      additionalProperties: false
      required: [collector_id, route_kind, transport]
      properties:
        collector_id: {type: string, format: uuid}
        route_kind: {$ref: '#/components/schemas/TelemetryRouteKind'}
        transport: {$ref: '#/components/schemas/TelemetryRouteTransport'}
        gateway_collector_id: {type: string, format: uuid}
    RouteTestResult:
      type: object
      additionalProperties: false
      required: [id, status, started_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, running, succeeded, failed, expired]}
        error_code: {type: string, maxLength: 128}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
