openapi: 3.1.0
info:
  title: Argus Agent Contracts
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
paths: {}
components:
  schemas:
    ConversationEvent:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_id
        - sequence
        - enterprise_id
        - conversation_id
        - event_type
        - occurred_at
        - content_hash
        - payload
      properties:
        schema_version:
          const: argus.conversation_event/v1
        event_id:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 1
        enterprise_id:
          type: string
          minLength: 1
        conversation_id:
          type: string
          minLength: 1
        run_id:
          type: string
          minLength: 1
        step_id:
          type: string
          minLength: 1
        event_type:
          enum:
            - user_message
            - assistant_message
            - model_usage
            - tool_call_requested
            - tool_call_started
            - tool_call_result
            - pending_action_created
            - user_confirmation
            - approval_update
            - execution_update
            - card_action_result
            - run_state_changed
            - context_compacted
        actor_type:
          enum:
            - user
            - model
            - service
            - worker
            - system
        actor_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        content_hash:
          type: string
          minLength: 32
        artifact_ref:
          type: string
          minLength: 1
        data_classification:
          enum:
            - public
            - internal
            - sensitive
        payload:
          $ref: '#/components/schemas/PublicJsonObject'
    AgentEvent:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_id
        - sequence
        - run_id
        - event_type
        - occurred_at
        - payload
      properties:
        schema_version:
          const: argus.agent_event/v1
        event_id:
          type: string
        sequence:
          type: integer
          minimum: 1
        run_id:
          type: string
        message_id:
          type: string
        event_type:
          enum:
            - run_started
            - message_started
            - message_delta
            - message_completed
            - tool_call_started
            - tool_call_completed
            - pending_action_created
            - waiting_input
            - waiting_approval
            - context_compaction_started
            - context_compaction_completed
            - context_compaction_failed
            - run_completed
            - run_failed
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: '#/components/schemas/PublicJsonObject'
    RunCheckpoint:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - run_id
        - conversation_id
        - enterprise_id
        - model_id
        - model_revision
        - locale
        - status
        - goal
        - completed_step_ids
        - open_questions
        - target_resource_refs
        - active_public_pending_action_refs
        - tool_call_refs
        - execution_refs
        - last_error_codes
        - authorization_version
        - version
      properties:
        schema_version:
          const: argus.run_checkpoint/v1
        run_id:
          type: string
        conversation_id:
          type: string
        enterprise_id:
          type: string
        model_id:
          type: string
        model_revision:
          type: integer
          minimum: 1
        locale:
          enum:
            - zh-CN
            - en-US
        status:
          enum:
            - pending
            - running
            - waiting_input
            - waiting_approval
            - waiting_system
            - succeeded
            - failed
            - cancelled
            - timed_out
        current_step_id:
          type: string
        goal:
          type: string
          maxLength: 8192
        user_constraints:
          type: array
          items:
            type: string
            maxLength: 2048
        plan:
          type: array
          items:
            type: string
            maxLength: 2048
        completed_step_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        next_step:
          type: string
          maxLength: 2048
        open_questions:
          type: array
          items:
            type: string
            maxLength: 2048
        waiting_reason:
          type: string
        target_resource_refs:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        active_public_pending_action_refs:
          type: array
          uniqueItems: true
          items:
            type: string
        tool_call_refs:
          type: array
          uniqueItems: true
          items:
            type: string
        execution_refs:
          type: array
          uniqueItems: true
          items:
            type: string
        last_error_codes:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Z][A-Z0-9_]*$
        authorization_version:
          type: integer
          minimum: 1
        resource_scope_snapshot_ref:
          type: string
        version:
          type: integer
          minimum: 1
    Run:
      type: object
      additionalProperties: false
      required:
        - run_id
        - conversation_id
        - enterprise_id
        - model_id
        - model_revision
        - locale
        - status
        - authorization_version
        - version
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
        conversation_id:
          type: string
        enterprise_id:
          type: string
        model_id:
          type: string
        model_revision:
          type: integer
          minimum: 1
        locale:
          enum:
            - zh-CN
            - en-US
        status:
          enum:
            - pending
            - running
            - waiting_input
            - waiting_approval
            - waiting_system
            - succeeded
            - failed
            - cancelled
            - timed_out
        current_step_id:
          type: string
        stop_reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 128
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 128
        authorization_version:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Step:
      type: object
      additionalProperties: false
      required:
        - step_id
        - run_id
        - sequence
        - step_type
        - status
        - attempt
        - version
        - created_at
        - updated_at
      properties:
        step_id:
          type: string
        run_id:
          type: string
        sequence:
          type: integer
          minimum: 1
        step_type:
          enum:
            - model_call
            - tool_call
            - pending_action
            - execution
            - context_compaction
            - verification
        status:
          enum:
            - pending
            - leased
            - running
            - waiting_input
            - waiting_approval
            - succeeded
            - failed
            - cancelled
            - timed_out
        attempt:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Task:
      type: object
      additionalProperties: false
      required:
        - task_id
        - run_id
        - step_id
        - status
        - attempt
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
        run_id:
          type: string
        step_id:
          type: string
        status:
          enum:
            - pending
            - leased
            - running
            - succeeded
            - failed
            - cancelled
            - timed_out
        attempt:
          type: integer
          minimum: 0
        last_error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContextSnapshot:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - enterprise_id
        - conversation_id
        - run_id
        - source_from_event_id
        - source_through_event_id
        - first_kept_event_id
        - source_from_sequence
        - source_through_sequence
        - first_kept_sequence
        - typed_checkpoint
        - narrative_summary
        - compaction_model_id
        - compaction_model_revision
        - compaction_prompt_version
        - estimated_tokens_before
        - actual_tokens_after
        - source_hash
        - snapshot_hash
        - status
        - created_at
      properties:
        schema_version:
          const: argus.context_snapshot/v1
        id:
          type: string
        enterprise_id:
          type: string
        conversation_id:
          type: string
        run_id:
          type: string
        source_from_event_id:
          type: string
        source_through_event_id:
          type: string
        first_kept_event_id:
          type: string
        source_from_sequence:
          type: integer
          minimum: 1
        source_through_sequence:
          type: integer
          minimum: 1
        first_kept_sequence:
          type: integer
          minimum: 1
        typed_checkpoint:
          $ref: '#/components/schemas/RunCheckpoint'
        narrative_summary:
          type: string
          maxLength: 65536
        compaction_model_id:
          type: string
        compaction_model_revision:
          type: integer
          minimum: 1
        compaction_prompt_version:
          type: string
        estimated_tokens_before:
          type: integer
          minimum: 0
        actual_tokens_after:
          type: integer
          minimum: 0
        source_hash:
          type: string
          minLength: 32
        snapshot_hash:
          type: string
          minLength: 32
        status:
          enum:
            - pending
            - active
            - failed
            - superseded
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        created_at:
          type: string
          format: date-time
    ToolResultProjection:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - tool_call_id
        - projection_schema_version
        - result_ref
        - result_hash
        - summary
        - resource_refs
        - partial
        - original_bytes
        - projected_bytes
      properties:
        schema_version:
          const: argus.tool_result_projection/v1
        tool_call_id:
          type: string
        projection_schema_version:
          type: string
        result_ref:
          type: string
        result_hash:
          type: string
          minLength: 32
        summary:
          $ref: '#/components/schemas/PublicJsonObject'
        samples:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PublicJsonValue'
        resource_refs:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        partial:
          type: boolean
        partial_reasons:
          type: array
          uniqueItems: true
          items:
            enum:
              - authorization_filtered
              - budget_truncated
              - source_timeout
              - source_unavailable
        original_bytes:
          type: integer
          minimum: 0
        projected_bytes:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              partial:
                const: true
            required:
              - partial
          then:
            required:
              - partial_reasons
            properties:
              partial_reasons:
                minItems: 1
        - if:
            properties:
              partial:
                const: false
            required:
              - partial
          then:
            not:
              required:
                - partial_reasons
    ToolMetadata:
      type: object
      additionalProperties: false
      required:
        - tool_name
        - input_schema_version
        - output_schema_version
        - risk
        - agent_visibility
        - execution_mode
        - result_projection_schema
        - required_permissions
      properties:
        tool_name:
          type: string
          pattern: ^[a-z][a-z0-9_.]+$
        input_schema_version:
          type: string
        output_schema_version:
          type: string
        risk:
          enum:
            - read
            - write
            - dangerous
            - critical
        agent_visibility:
          enum:
            - visible
            - hidden
        execution_mode:
          enum:
            - sequential
            - parallel_safe
        result_projection_schema:
          type: string
        required_permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
      allOf:
        - if:
            properties:
              tool_name:
                pattern: \.commit$
            required:
              - tool_name
          then:
            properties:
              agent_visibility:
                const: hidden
              execution_mode:
                const: sequential
        - if:
            properties:
              execution_mode:
                const: parallel_safe
            required:
              - execution_mode
          then:
            properties:
              risk:
                const: read
    ModelCapabilities:
      type: object
      additionalProperties: false
      required:
        - context_window_tokens
        - max_output_tokens
        - supports_tool_calling
        - supports_structured_output
        - provider_compaction_capability
      properties:
        context_window_tokens:
          type: integer
          minimum: 1024
        max_output_tokens:
          type: integer
          minimum: 1
        supports_tool_calling:
          type: boolean
        supports_structured_output:
          type: boolean
        provider_compaction_capability:
          enum:
            - none
            - optional
    ContextBudget:
      type: object
      additionalProperties: false
      required:
        - context_window_tokens
        - reserved_output_tokens
        - safety_margin_tokens
        - system_tokens
        - tool_schema_tokens
        - checkpoint_tokens
        - summary_tokens
        - recent_tail_tokens
        - current_input_tokens
        - estimated_input_tokens
        - hard_input_limit_tokens
      properties:
        context_window_tokens:
          type: integer
          minimum: 1024
        reserved_output_tokens:
          type: integer
          minimum: 1
        safety_margin_tokens:
          type: integer
          minimum: 1
        system_tokens:
          type: integer
          minimum: 0
        tool_schema_tokens:
          type: integer
          minimum: 0
        checkpoint_tokens:
          type: integer
          minimum: 0
        summary_tokens:
          type: integer
          minimum: 0
        recent_tail_tokens:
          type: integer
          minimum: 0
        current_input_tokens:
          type: integer
          minimum: 0
        estimated_input_tokens:
          type: integer
          minimum: 0
        hard_input_limit_tokens:
          type: integer
          minimum: 1
        soft_compaction_threshold_tokens:
          type: integer
          minimum: 1
    ModelCall:
      type: object
      additionalProperties: false
      required:
        - model_call_id
        - run_id
        - model_id
        - model_revision
        - projection_hash
        - estimated_input_tokens
        - reserved_output_tokens
        - input_price_per_million_snapshot
        - output_price_per_million_snapshot
        - currency
        - compaction
        - created_at
      properties:
        model_call_id:
          type: string
        run_id:
          type: string
        model_id:
          type: string
        model_revision:
          type: integer
          minimum: 1
        projection_hash:
          type: string
          minLength: 32
        context_snapshot_id:
          type: string
        estimated_input_tokens:
          type: integer
          minimum: 0
        actual_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        reserved_output_tokens:
          type: integer
          minimum: 1
        input_price_per_million_snapshot:
          type: number
          minimum: 0
        output_price_per_million_snapshot:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        compaction:
          type: boolean
        stop_reason:
          enum:
            - completed
            - tool_call
            - output_limit
            - cancelled
            - provider_error
            - content_filtered
        created_at:
          type: string
          format: date-time
    PublicJsonValue:
      x-argus-typescript-type: unknown
      oneOf:
        - type: 'null'
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/PublicJsonValue'
        - $ref: '#/components/schemas/PublicJsonObject'
    PublicJsonObject:
      x-argus-typescript-type: unknown
      type: object
      propertyNames:
        allOf:
          - pattern: ^[a-z][a-z0-9_]*$
          - not:
              pattern: (^|_)(argus__token|token|secret|credential|private_params?|commit_tool|remote_access_ticket)($|_)
      additionalProperties:
        $ref: '#/components/schemas/PublicJsonValue'
    ResourceRef:
      type: object
      additionalProperties: false
      required:
        - resource_type
        - resource_id
        - version
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
        version:
          type: integer
          minimum: 1
