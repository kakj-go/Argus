openapi: 3.1.0
info:
  title: Argus Card Contracts
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
paths: {}
components:
  schemas:
    CardManifest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - card_id
        - revision
        - source
        - entrypoint_hash
        - bridge_version
        - slots
        - allowed_resources
        - supported_locales
        - default_locale
        - supported_color_schemes
        - max_message_bytes
      properties:
        schema_version:
          const: argus.card_manifest/v1
        card_id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
        source:
          enum:
            - system
            - enterprise
        entrypoint_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        bridge_version:
          const: argus.card_bridge/v1
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        allowed_resources:
          type: array
          uniqueItems: true
          items:
            enum:
              - inline_style
              - inline_script
              - image_data
              - font_data
        supported_locales:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
              - zh-CN
              - en-US
        default_locale:
          enum:
            - zh-CN
            - en-US
        supported_color_schemes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
              - light
              - dark
        max_message_bytes:
          type: integer
          minimum: 1024
          maximum: 1048576
        presentation_kind:
          enum:
            - table
            - detail
            - pending_action
            - metric
            - generic
    DataBinding:
      type: object
      additionalProperties: false
      required:
        - slot_name
        - tool_call_id
        - path
        - schema_version
      properties:
        slot_name:
          type: string
        tool_call_id:
          type: string
        path:
          type: string
          pattern: ^\$
        schema_version:
          type: string
    QueryBinding:
      type: object
      additionalProperties: false
      required:
        - binding_id
        - status
        - expires_at
      properties:
        binding_id:
          type: string
          minLength: 1
        status:
          enum:
            - active
            - consumed
            - expired
            - invalidated
        expires_at:
          type: string
          format: date-time
    RenderPlan:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - card_id
        - card_revision
        - card_instance_id
        - data_bindings
        - query_binding_ids
        - action_binding_ids
        - locale
        - color_scheme
      properties:
        schema_version:
          const: argus.render_plan/v1
        card_id:
          type: string
        card_revision:
          type: integer
          minimum: 1
        card_instance_id:
          type: string
        data_bindings:
          type: array
          items:
            $ref: '#/components/schemas/DataBinding'
        query_binding_ids:
          type: object
          additionalProperties:
            type: string
        action_binding_ids:
          type: object
          additionalProperties:
            type: string
        locale:
          enum:
            - zh-CN
            - en-US
        color_scheme:
          enum:
            - light
            - dark
    BridgeMessage:
      type: object
      additionalProperties: false
      required:
        - bridge_version
        - message_id
        - sequence
        - nonce
        - type
        - payload
      properties:
        bridge_version:
          const: argus.card_bridge/v1
        message_id:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 0
        nonce:
          type: string
          minLength: 16
        type:
          enum:
            - host.hello
            - card.ready
            - host.context
            - data.update
            - query.invoke
            - action.invoke
            - card.resize
            - card.slot_selected
            - card.validation_report
            - binding.result
            - bridge.error
            - bridge.destroyed
        payload:
          $ref: '#/components/schemas/PublicJsonObject'
      allOf:
        - if:
            properties:
              type:
                const: query.invoke
            required:
              - type
          then:
            properties:
              payload:
                type: object
                additionalProperties: false
                required:
                  - query_binding_id
                  - request_id
                properties:
                  query_binding_id:
                    type: string
                    minLength: 1
                  request_id:
                    type: string
                    minLength: 16
                    maxLength: 128
        - if:
            properties:
              type:
                const: action.invoke
            required:
              - type
          then:
            properties:
              payload:
                type: object
                additionalProperties: false
                required:
                  - action_binding_id
                  - request_id
                properties:
                  action_binding_id:
                    type: string
                    minLength: 1
                  request_id:
                    type: string
                    minLength: 16
                    maxLength: 128
        - if:
            properties:
              type:
                const: card.validation_report
            required:
              - type
          then:
            properties:
              payload:
                $ref: '#/components/schemas/CardRuntimeValidationReport'
    SlotType:
      enum:
        - string
        - number
        - boolean
        - array
        - object
    Slot:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
        - value_type
        - required
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        kind:
          enum:
            - data
            - query
            - action
        value_type:
          $ref: '#/components/schemas/SlotType'
        required:
          type: boolean
        ai_generated:
          type: boolean
          default: false
        description:
          type: string
          maxLength: 1024
    CardRuntimeValidationReport:
      type: object
      additionalProperties: false
      required:
        - content_hash
        - runtime_version
        - nonce
        - scenario
        - ready
        - protocol_violations
        - runtime_errors
        - serious_a11y_violations
        - missing_required_slots
        - size_violation
      properties:
        content_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        runtime_version:
          type: string
          minLength: 1
          maxLength: 128
        nonce:
          type: string
          minLength: 16
          maxLength: 128
        scenario:
          enum:
            - default
            - empty
            - error
            - large
            - light
            - dark
            - zh-CN
            - en-US
        ready:
          type: boolean
        protocol_violations:
          type: integer
          minimum: 0
        runtime_errors:
          type: integer
          minimum: 0
        serious_a11y_violations:
          type: integer
          minimum: 0
        missing_required_slots:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*$
        size_violation:
          type: boolean
    PublicJsonValue:
      x-argus-typescript-type: unknown
      oneOf:
        - type: 'null'
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/PublicJsonValue'
        - $ref: '#/components/schemas/PublicJsonObject'
    PublicJsonObject:
      x-argus-typescript-type: unknown
      type: object
      propertyNames:
        allOf:
          - pattern: ^[a-z][a-z0-9_]*$
          - not:
              pattern: (^|_)(argus__token|token|secret|credential|private_params?|commit_tool|remote_access_ticket)($|_)
      additionalProperties:
        $ref: '#/components/schemas/PublicJsonValue'
