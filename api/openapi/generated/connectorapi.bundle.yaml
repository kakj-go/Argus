openapi: 3.1.0
info:
  title: Argus Connector API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /enterprise/bastion-scopes:
    get:
      operationId: listBastionScopes
      summary: List Bastion Scopes.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Bastion Scope page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BastionScopePage'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/bastion-scopes/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getBastionScope
      summary: Get a Bastion Scope.
      responses:
        '200':
          description: Bastion Scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BastionScope'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/bastion-scopes/actions/preview-create:
    post:
      operationId: previewCreateBastionScope
      summary: Freeze Bastion Scope creation and enrollment policy.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BastionPreviewCreate'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/bastion-scopes/{id}/actions/preview-update:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewUpdateBastionScope
      summary: Freeze a Bastion Scope update or migration.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePreviewUpdate'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/bastion-scopes/{id}/actions/preview-delete:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewDeleteBastionScope
      summary: Freeze a Bastion Scope deletion.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePreviewDelete'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/bastion-scopes/{id}/actions/preview-enrollment-rotate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewBastionEnrollmentRotate
      summary: Freeze a new mode A Connector installation command.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePreviewDelete'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/bastion-scopes/{id}/actions/preview-connector-replacement:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewBastionConnectorReplacement
      summary: Fence the active Connector through a confirmed replacement action.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BastionConnectorReplacementPreview'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/connector-install-operations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getConnectorInstallOperation
      summary: Get the durable Connector installation progress and public event timeline.
      responses:
        '200':
          description: Connector installation operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInstallOperation'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/connector-install-operations/{id}/actions/preview-retry:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewRetryConnectorInstallOperation
      summary: Freeze a retry of a terminal failed Connector installation operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/connectors:
    get:
      operationId: listConnectors
      summary: List Connector diagnostics.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Connector page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorPage'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/connectors/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getConnector
      summary: Get Connector diagnostics.
      responses:
        '200':
          description: Connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/connectors/{id}/rotate-certificate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: requestConnectorCertificateRotation
      summary: Request short-lived Connector certificate rotation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '202':
          description: Connector rotation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/connectors/{id}/actions/preview-uninstall:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewUninstallConnector
      summary: Freeze a Connector uninstall command and its fencing context.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePreviewDelete'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /connectors/enroll:
    post:
      operationId: enrollConnector
      summary: Consume a one-time enrollment token and sign a Connector CSR.
      security:
        - connectorEnrollmentToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorEnrollRequest'
      responses:
        '201':
          description: Connector identity and certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEnrollResult'
        default:
          $ref: '#/components/responses/Error'
  /connectors/bootstrap-script:
    get:
      operationId: getConnectorBootstrapScript
      summary: Download a strict Connector bootstrap script using a pending enrollment token.
      description: 公开目标机端点；短命令可仅对本次脚本下载放宽 TLS，返回脚本内嵌版本化 Trust Bundle，后续请求保持严格校验。读取脚本不消费 enrollment token。
      security:
        - connectorEnrollmentToken: []
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - linux-system
              - linux-user
      responses:
        '200':
          description: Generated strict bootstrap script.
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            text/x-shellscript:
              schema:
                type: string
                minLength: 1
                maxLength: 131072
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
    connectorEnrollmentToken:
      type: apiKey
      in: header
      name: X-Argus-Enrollment-Token
  schemas:
    BastionScope:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - name
        - environment
        - labels
        - status
        - onboarding_mode
        - onboarding
        - fencing_generation
        - member_count
        - resource_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        environment:
          $ref: '#/components/schemas/Environment'
        labels:
          $ref: '#/components/schemas/Labels'
        status:
          type: string
          enum:
            - pending
            - active
            - suspected_offline
            - offline
            - uninstalling
            - uninstalled
            - deleted
        onboarding_mode:
          type: string
          enum:
            - command
            - direct_install
            - direct_install_tunnel
          readOnly: true
        onboarding:
          $ref: '#/components/schemas/OnboardingProjection'
        connector_host_id:
          type: string
          format: uuid
        active_connector_id:
          type: string
          format: uuid
        control_tunnel_status:
          type: string
          enum:
            - desired
            - establishing
            - established
            - degraded
            - down
            - removed
          readOnly: true
          description: 模式 C 长期控制隧道的权威状态；与 Connector 在线状态独立
        fencing_generation:
          type: integer
          format: int64
          minimum: 1
        member_count:
          type: integer
          minimum: 0
        resource_version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BastionScopePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BastionScope'
        page:
          $ref: '#/components/schemas/CursorPage'
    BastionPreviewCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - labels
        - install_mode
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        environment:
          $ref: '#/components/schemas/Environment'
        labels:
          $ref: '#/components/schemas/UserLabels'
        install_mode:
          type: string
          enum:
            - command
            - direct_install
            - direct_install_tunnel
        address:
          type: string
          minLength: 1
          maxLength: 512
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 256
        credential_id:
          type: string
          format: uuid
        connection_test_id:
          type: string
          format: uuid
          description: 代装模式必填:与本表单字段匹配且成功的 direct_ssh 主机连接测试
    ConnectorInstallOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - connector_id
        - bastion_scope_id
        - host_id
        - install_mode
        - stage
        - status
        - attempt
        - max_attempts
        - events
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        connector_id:
          type: string
          format: uuid
        bastion_scope_id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
        retry_of:
          type: string
          format: uuid
        connection_test_id:
          type: string
          format: uuid
        release_version_id:
          type: string
          format: uuid
        install_mode:
          type: string
          enum:
            - direct_install
            - direct_install_tunnel
        stage:
          type: string
          enum:
            - queued
            - ssh_connecting
            - artifact_verifying
            - artifact_transferring
            - service_installing
            - control_tunnel_establishing
            - enrolling
            - waiting_connector_online
            - completed
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - result_unknown
            - expired
            - cancelled
        attempt:
          type: integer
          minimum: 0
          maximum: 3
        max_attempts:
          type: integer
          minimum: 1
          maximum: 3
        connector_online_at:
          type: string
          format: date-time
        control_tunnel_status:
          type: string
          enum:
            - desired
            - establishing
            - established
            - degraded
            - down
            - removed
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        events:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/ConnectorInstallOperationEvent'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Connector:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - role
        - name
        - status
        - capabilities
        - connection_epoch
        - certificate_expires_at
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
          readOnly: true
        role:
          $ref: '#/components/schemas/ConnectorRole'
        name:
          type: string
          minLength: 1
          maxLength: 128
        host_id:
          type: string
          format: uuid
        bastion_scope_id:
          type: string
          format: uuid
        kubernetes_cluster_id:
          type: string
          format: uuid
        software_version:
          type: string
          maxLength: 128
        status:
          type: string
          enum:
            - pending
            - online
            - suspected_offline
            - offline
            - draining
            - uninstalled
            - revoked
        capabilities:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 2
            pattern: ^[a-z][a-z0-9_.-]+$
        connection_epoch:
          type: integer
          format: int64
          minimum: 0
        certificate_expires_at:
          type: string
          format: date-time
        connected_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConnectorPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connector'
        page:
          $ref: '#/components/schemas/CursorPage'
    ConnectorEnrollRequest:
      type: object
      additionalProperties: false
      required:
        - csr_pem
        - device_fingerprint
        - instance_id
        - architecture
        - name
        - software_version
        - capabilities
      properties:
        csr_pem:
          type: string
          minLength: 1
          maxLength: 32768
          writeOnly: true
        device_fingerprint:
          type: string
          minLength: 32
          maxLength: 256
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        architecture:
          type: string
          enum:
            - amd64
            - arm64
        name:
          type: string
          minLength: 1
          maxLength: 128
        software_version:
          type: string
          minLength: 1
          maxLength: 128
        capabilities:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 2
            pattern: ^[a-z][a-z0-9_.-]+$
    ConnectorEnrollResult:
      type: object
      additionalProperties: false
      required:
        - connector_id
        - role
        - certificate_pem
        - trust_bundle
        - gateway_endpoint
        - certificate_expires_at
        - result
      properties:
        connector_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ConnectorRole'
        host_id:
          type: string
          format: uuid
        bastion_scope_id:
          type: string
          format: uuid
        kubernetes_cluster_id:
          type: string
          format: uuid
        certificate_pem:
          type: string
          writeOnly: true
        trust_bundle:
          $ref: '#/components/schemas/TrustBundleSnapshot'
        gateway_endpoint:
          type: string
          minLength: 1
          maxLength: 2048
        certificate_expires_at:
          type: string
          format: date-time
        result:
          type: string
          enum:
            - registered
            - idempotent_retry
    InstallInstructionSet:
      type: object
      additionalProperties: false
      required:
        - scope
        - command
        - expires_at
        - trust_bundle_epoch
        - trust_bundle_sha256
        - installer_sha256
        - capability_warnings
      properties:
        scope:
          type: string
          enum:
            - linux-system
            - linux-user
            - kubernetes
        command:
          type: string
          minLength: 1
          maxLength: 131072
          writeOnly: true
          description: 唯一面向用户展示的一键安装命令。Host 与手工 Connector 下载动态引导脚本；Kubernetes 使用等价的单命令临时脚本执行。
        download_tls_mode:
          type: string
          enum:
            - strict
            - insecure-first-fetch
        expires_at:
          type: string
          format: date-time
        trust_bundle_epoch:
          type: integer
          format: int64
          minimum: 1
        trust_bundle_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        installer_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        capability_warnings:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1024
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    Environment:
      type: string
      enum:
        - development
        - staging
        - production
    UserLabelKey:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
    SystemLabelKey:
      type: string
      maxLength: 72
      pattern: ^argus\.io/[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
      readOnly: true
    LabelValue:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9._-]{0,61}[a-z0-9])?$
    Labels:
      type: object
      maxProperties: 64
      propertyNames:
        anyOf:
          - $ref: '#/components/schemas/UserLabelKey'
          - $ref: '#/components/schemas/SystemLabelKey'
      additionalProperties:
        $ref: '#/components/schemas/LabelValue'
    OnboardingProjection:
      type: object
      additionalProperties: false
      required:
        - state
        - updated_at
      properties:
        state:
          type: string
          enum:
            - command_available
            - command_consumed
            - command_expired
            - awaiting_approval
            - installing
            - install_failed
            - registered
        pending_action_ref:
          type: string
          minLength: 1
          maxLength: 128
        execution_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        updated_at:
          type: string
          format: date-time
    PartialMetadata:
      type: object
      additionalProperties: false
      required:
        - partial
        - reasons
      properties:
        partial:
          type: boolean
        reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - authorization_filtered
              - budget_truncated
              - source_timeout
              - source_unavailable
    CursorPage:
      type: object
      additionalProperties: false
      required:
        - next_cursor
        - has_more
        - partial
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
        partial:
          $ref: '#/components/schemas/PartialMetadata'
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
    UserLabels:
      type: object
      maxProperties: 64
      propertyNames:
        $ref: '#/components/schemas/UserLabelKey'
      additionalProperties:
        $ref: '#/components/schemas/LabelValue'
    PublicJsonValue:
      x-argus-typescript-type: unknown
      oneOf:
        - type: 'null'
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/PublicJsonValue'
        - $ref: '#/components/schemas/PublicJsonObject'
    PublicJsonObject:
      x-argus-typescript-type: unknown
      type: object
      propertyNames:
        allOf:
          - pattern: ^[a-z][a-z0-9_]*$
          - not:
              pattern: (^|_)(argus__token|token|secret|credential|private_params?|commit_tool|remote_access_ticket)($|_)
      additionalProperties:
        $ref: '#/components/schemas/PublicJsonValue'
    pending-action-public.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://argus.io/schemas/v1/action/pending-action-public.schema.json
      title: PendingActionPublic
      type: object
      additionalProperties: false
      required:
        - schema_version
        - action_ref
        - action_type
        - title
        - summary
        - risk
        - preview
        - diff
        - status
        - available_actions
        - expires_at
        - created_at
        - updated_at
      properties:
        schema_version:
          const: argus.pending_action/v1
        action_ref:
          type: string
          minLength: 1
        action_type:
          type: string
          minLength: 3
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 256
        summary:
          type: string
          minLength: 1
          maxLength: 4096
        risk:
          enum:
            - read
            - write
            - dangerous
            - critical
        preview:
          $ref: '#/components/schemas/PublicJsonObject'
        diff:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required:
              - kind
              - text
            properties:
              kind:
                enum:
                  - add
                  - remove
                  - change
                  - note
              text:
                type: string
                maxLength: 2048
        status:
          enum:
            - prepared
            - awaiting_confirmation
            - awaiting_approval
            - ready
            - executing
            - succeeded
            - failed
            - result_unknown
            - cancelled
            - expired
            - rejected
            - invalidated
        available_actions:
          type: array
          uniqueItems: true
          items:
            enum:
              - confirm
              - cancel
              - approve
              - reject
        approval:
          type: object
          additionalProperties: false
          required:
            - required
            - minimum_approvers
            - approved_count
            - separation_of_duty
          properties:
            required:
              type: boolean
            policy_ref:
              type: string
            minimum_approvers:
              type: integer
              minimum: 0
            approved_count:
              type: integer
              minimum: 0
            separation_of_duty:
              type: boolean
        execution_ref:
          type: string
          minLength: 1
        result_summary:
          type: string
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ResourcePreviewUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        environment:
          $ref: '#/components/schemas/Environment'
        labels:
          $ref: '#/components/schemas/UserLabels'
        connection_test_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 1
    ResourcePreviewDelete:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
    BastionConnectorReplacementPreview:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        address:
          type: string
          minLength: 1
          maxLength: 512
          description: 模式 B/C 必填；必须与本次连接测试一致
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 256
        credential_id:
          type: string
          format: uuid
        connection_test_id:
          type: string
          format: uuid
          description: 模式 B/C 必填；必须是当前有效的 direct_ssh 测试
    ConnectorInstallOperationEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - stage
        - status
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - queued
            - ssh_connecting
            - artifact_verifying
            - artifact_transferring
            - service_installing
            - control_tunnel_establishing
            - enrolling
            - waiting_connector_online
            - completed
        status:
          type: string
          enum:
            - started
            - succeeded
            - failed
            - retrying
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          maxLength: 1024
        occurred_at:
          type: string
          format: date-time
    ConnectorRole:
      type: string
      enum:
        - bastion
        - kubernetes
    TrustBundleSnapshot:
      type: object
      additionalProperties: false
      required:
        - epoch
        - state
        - bundle_pem
        - bundle_sha256
        - current_ca_fingerprints
        - next_ca_fingerprints
        - started_at
      properties:
        epoch:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum:
            - stable
            - preparing
            - overlapping
            - retiring
            - failed
        bundle_pem:
          type: string
          minLength: 128
          maxLength: 131072
        bundle_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        current_ca_fingerprints:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
        next_ca_fingerprints:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
        started_at:
          type: string
          format: date-time
        retire_at:
          type: string
          format: date-time
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Error:
      description: Stable Argus API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
