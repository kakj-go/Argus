openapi: 3.1.0
info:
  title: Argus Enterprise Authorization API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /enterprise/permissions:
    get:
      operationId: listPermissions
      summary: listPermissions.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Registered permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPage'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/roles:
    get:
      operationId: listRoles
      summary: listRoles.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createRole
      summary: createRole.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/roles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateRole
      summary: updateRole.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disableRole
      summary: disableRole.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204':
          description: Role disabled.
        default:
          $ref: '#/components/responses/Error'
  /enterprise/role-bindings:
    get:
      operationId: listRoleBindings
      summary: listRoleBindings.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Role bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBindingPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createRoleBinding
      summary: createRoleBinding.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBindingCreate'
      responses:
        '201':
          description: Role binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/role-bindings/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateRoleBinding
      summary: updateRoleBinding.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBindingUpdate'
      responses:
        '200':
          description: Updated binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disableRoleBinding
      summary: disableRoleBinding.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204':
          description: Binding disabled.
        default:
          $ref: '#/components/responses/Error'
  /enterprise/users/{id}/role-assignments:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getUserRoleAssignments
      summary: Get direct, inherited, and effective role assignments for an enterprise user.
      responses:
        '200':
          description: User role assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleAssignments'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceUserRoleAssignments
      summary: Atomically replace an enterprise user's direct role assignments.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleAssignmentsUpdate'
      responses:
        '200':
          description: Updated user role assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleAssignments'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/data-authorizations/{subject_type}/{subject_id}:
    get:
      operationId: listDataAuthorizationResources
      summary: List explicit data authorization resources for a subject.
      parameters:
        - name: subject_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DataAuthorizationSubjectType'
        - name: subject_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resource_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DataAuthorizationResourceType'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/parameters-Limit'
      responses:
        '200':
          description: Resource authorization page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAuthorizationPage'
        default:
          $ref: '#/components/responses/responses-Error'
    post:
      operationId: updateDataAuthorization
      summary: Add or remove explicit data authorization resources.
      parameters:
        - name: subject_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DataAuthorizationSubjectType'
        - name: subject_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/parameters-CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataAuthorizationBatch'
      responses:
        '204':
          description: Authorization updated.
        default:
          $ref: '#/components/responses/responses-Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
    PermissionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        page:
          $ref: '#/components/schemas/CursorPage'
    RoleCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
    RoleUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        status:
          type: string
          enum:
            - active
            - disabled
        expected_version:
          type: integer
          format: int64
          minimum: 1
    RolePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        page:
          $ref: '#/components/schemas/CursorPage'
    RoleBindingCreate:
      type: object
      additionalProperties: false
      required:
        - subject_type
        - subject_id
        - role_id
      properties:
        subject_type:
          type: string
          enum:
            - user
            - department
            - service_account
        subject_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
    RoleBindingUpdate:
      type: object
      additionalProperties: false
      required:
        - valid_from
        - valid_until
        - expected_version
      properties:
        valid_from:
          type:
            - string
            - 'null'
          format: date-time
        valid_until:
          type:
            - string
            - 'null'
          format: date-time
        status:
          type: string
          enum:
            - active
            - disabled
        expected_version:
          type: integer
          format: int64
          minimum: 1
    RoleBindingPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleBinding'
        page:
          $ref: '#/components/schemas/CursorPage'
    UserRoleAssignments:
      type: object
      additionalProperties: false
      required:
        - direct_role_ids
        - inherited_roles
        - effective_role_ids
        - authorization_version
      properties:
        direct_role_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        inherited_roles:
          type: array
          items:
            $ref: '#/components/schemas/InheritedRoleAssignment'
        effective_role_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        authorization_version:
          type: integer
          format: int64
          minimum: 1
    UserRoleAssignmentsUpdate:
      type: object
      additionalProperties: false
      required:
        - department_id
        - role_ids
        - expected_user_version
        - expected_authorization_version
      properties:
        department_id:
          type: string
          format: uuid
        role_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            format: uuid
        expected_user_version:
          type: integer
          format: int64
          minimum: 1
        expected_authorization_version:
          type: integer
          format: int64
          minimum: 1
    DataAuthorizationSubjectType:
      type: string
      enum:
        - user
        - department
        - role
        - service_account
    DataAuthorizationResourceType:
      type: string
      enum:
        - host
        - kubernetes_cluster
    DataAuthorizationResource:
      type: object
      additionalProperties: false
      required:
        - resource_type
        - resource_id
        - name
        - direct
        - inherited
        - sources
      properties:
        resource_type:
          $ref: '#/components/schemas/DataAuthorizationResourceType'
        resource_id:
          type: string
          format: uuid
        name:
          type: string
        direct:
          type: boolean
        inherited:
          type: boolean
        sources:
          type: array
          uniqueItems: true
          items:
            type: string
    DataAuthorizationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - authorization_version
        - affected_member_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataAuthorizationResource'
        page:
          $ref: '#/components/schemas/CursorPage'
        authorization_version:
          type: integer
          format: int64
          minimum: 1
        affected_member_count:
          type: integer
          format: int64
          minimum: 0
    DataAuthorizationBatch:
      type: object
      additionalProperties: false
      required:
        - resource_type
        - resource_ids
        - remove
        - expected_version
      properties:
        resource_type:
          $ref: '#/components/schemas/DataAuthorizationResourceType'
        resource_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            format: uuid
        remove:
          type: boolean
        expected_version:
          type: integer
          format: int64
          minimum: 1
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    Permission:
      type: string
      pattern: ^[a-z][a-z0-9_.]+$
    PartialMetadata:
      type: object
      additionalProperties: false
      required:
        - partial
        - reasons
      properties:
        partial:
          type: boolean
        reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - authorization_filtered
              - budget_truncated
              - source_timeout
              - source_unavailable
    CursorPage:
      type: object
      additionalProperties: false
      required:
        - next_cursor
        - has_more
        - partial
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
        partial:
          $ref: '#/components/schemas/PartialMetadata'
    Role:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - name
        - builtin
        - permissions
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
        enterprise_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        builtin:
          type: boolean
        builtin_key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        status:
          type: string
          enum:
            - active
            - disabled
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
    RoleBinding:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - subject_type
        - subject_id
        - role_id
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
        enterprise_id:
          type: string
          minLength: 1
        subject_type:
          type: string
          enum:
            - user
            - department
            - service_account
        subject_id:
          type: string
          minLength: 1
        role_id:
          type: string
          minLength: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - active
            - disabled
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InheritedRoleAssignment:
      type: object
      additionalProperties: false
      required:
        - role_id
        - source_type
        - source_id
        - source_name
      properties:
        role_id:
          type: string
          format: uuid
        source_type:
          type: string
          const: department
        source_id:
          type: string
          format: uuid
        source_name:
          type: string
          minLength: 1
          maxLength: 128
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    parameters-Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    parameters-CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
  responses:
    Error:
      description: Stable Argus API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    responses-Error:
      description: Stable API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
