openapi: 3.1.0
info:
  title: Argus Model API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /enterprise/ai-models:
    get:
      operationId: listAIModels
      summary: listAIModels.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: AI Model page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelPage'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/ai-models/test-and-create:
    post:
      operationId: testAndCreateAIModel
      summary: testAndCreateAIModel.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIModelTestCreate'
      responses:
        '201':
          description: Compatibility result and model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelTestResult'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/ai-models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAIModel
      summary: getAIModel.
      responses:
        '200':
          description: AI Model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModel'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAIModel
      summary: updateAIModel.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIModelUpdate'
      responses:
        '200':
          description: Updated AI Model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModel'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/ai-models/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: testAIModel
      summary: testAIModel.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Compatibility result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelTestResult'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/model-quotas:
    get:
      operationId: listModelQuotas
      summary: listModelQuotas.
      responses:
        '200':
          description: Model quotas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelQuota'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertModelQuota
      summary: upsertModelQuota.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelQuotaUpsert'
      responses:
        '200':
          description: Model quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelQuota'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/model-usage:
    get:
      operationId: listModelUsage
      summary: listModelUsage.
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            minLength: 7
            maxLength: 7
        - name: model_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model usage.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelUsage'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
    AIModelProtocol:
      type: string
      enum:
        - chat_completions
        - responses
    AIModel:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - base_url
        - model_id
        - api_protocol
        - context_window_tokens
        - max_output_tokens
        - input_price_per_million
        - output_price_per_million
        - status
        - health_status
        - revision
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        base_url:
          type: string
          format: uri
          maxLength: 2048
        model_id:
          type: string
          minLength: 1
          maxLength: 256
        api_protocol:
          $ref: '#/components/schemas/AIModelProtocol'
        context_window_tokens:
          type: integer
          minimum: 8192
        max_output_tokens:
          type: integer
          minimum: 1
        input_price_per_million:
          type: number
          minimum: 0
        output_price_per_million:
          type: number
          minimum: 0
        capabilities:
          $ref: '#/components/schemas/ModelCapabilities'
        status:
          type: string
          enum:
            - enabled
            - disabled
        health_status:
          type: string
          enum:
            - unknown
            - healthy
            - unhealthy
        revision:
          type: integer
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 1
        last_tested_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AIModelTestCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - base_url
        - model_id
        - api_protocol
        - api_key
        - context_window_tokens
        - max_output_tokens
        - input_price_per_million
        - output_price_per_million
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        base_url:
          type: string
          format: uri
          maxLength: 2048
        model_id:
          type: string
          minLength: 1
          maxLength: 256
        api_protocol:
          $ref: '#/components/schemas/AIModelProtocol'
        api_key:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
        context_window_tokens:
          type: integer
          minimum: 8192
        max_output_tokens:
          type: integer
          minimum: 1
        input_price_per_million:
          type: number
          minimum: 0
        output_price_per_million:
          type: number
          minimum: 0
    AIModelUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        base_url:
          type: string
          format: uri
          maxLength: 2048
        model_id:
          type: string
          minLength: 1
          maxLength: 256
        api_protocol:
          $ref: '#/components/schemas/AIModelProtocol'
        api_key:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
        context_window_tokens:
          type: integer
          minimum: 8192
        max_output_tokens:
          type: integer
          minimum: 1
        input_price_per_million:
          type: number
          minimum: 0
        output_price_per_million:
          type: number
          minimum: 0
        status:
          type: string
          enum:
            - enabled
            - disabled
        expected_version:
          type: integer
          format: int64
          minimum: 1
    AIModelTestResult:
      type: object
      additionalProperties: false
      required:
        - compatible
        - checks
      properties:
        compatible:
          type: boolean
        model:
          $ref: '#/components/schemas/AIModel'
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - status
            properties:
              name:
                type: string
                enum:
                  - basic
                  - streaming
                  - tool_calling
                  - structured_output
              status:
                type: string
                enum:
                  - passed
                  - failed
              error_code:
                type: string
                pattern: ^[A-Z][A-Z0-9_]*$
    AIModelPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AIModel'
        page:
          $ref: '#/components/schemas/CursorPage'
    ModelQuota:
      type: object
      additionalProperties: false
      required:
        - id
        - model_id
        - subject_type
        - subject_id
        - monthly_amount
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        subject_type:
          type: string
          enum:
            - department
            - user
        subject_id:
          type: string
          format: uuid
        monthly_amount:
          type: number
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModelQuotaUpsert:
      type: object
      additionalProperties: false
      required:
        - model_id
        - subject_type
        - subject_id
        - monthly_amount
      properties:
        model_id:
          type: string
          format: uuid
        subject_type:
          type: string
          enum:
            - department
            - user
        subject_id:
          type: string
          format: uuid
        monthly_amount:
          type: number
          minimum: 0
        expected_version:
          type: integer
          format: int64
          minimum: 1
    ModelUsage:
      type: object
      additionalProperties: false
      required:
        - model_id
        - month
        - input_tokens
        - output_tokens
        - amount
        - request_count
        - compaction_count
      properties:
        model_id:
          type: string
          format: uuid
        month:
          type: string
          minLength: 7
          maxLength: 7
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        amount:
          type: number
          minimum: 0
        request_count:
          type: integer
          format: int64
          minimum: 0
        compaction_count:
          type: integer
          format: int64
          minimum: 0
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    ModelCapabilities:
      type: object
      additionalProperties: false
      required:
        - context_window_tokens
        - max_output_tokens
        - supports_tool_calling
        - supports_structured_output
        - provider_compaction_capability
      properties:
        context_window_tokens:
          type: integer
          minimum: 1024
        max_output_tokens:
          type: integer
          minimum: 1
        supports_tool_calling:
          type: boolean
        supports_structured_output:
          type: boolean
        provider_compaction_capability:
          enum:
            - none
            - optional
    PartialMetadata:
      type: object
      additionalProperties: false
      required:
        - partial
        - reasons
      properties:
        partial:
          type: boolean
        reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - authorization_filtered
              - budget_truncated
              - source_timeout
              - source_unavailable
    CursorPage:
      type: object
      additionalProperties: false
      required:
        - next_cursor
        - has_more
        - partial
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
        partial:
          $ref: '#/components/schemas/PartialMetadata'
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
  responses:
    Error:
      description: Stable Argus API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
