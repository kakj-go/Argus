  /enterprise/remote-access-requests:
    get:
      operationId: listRemoteAccessRequests
      summary: List remote access requests visible to the current user.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - mine
              - approver
              - processed
            default: mine
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RemoteAccessRequestStatus'
        - name: created_by
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: host_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: protocol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RemoteAccessProtocol'
        - name: created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
