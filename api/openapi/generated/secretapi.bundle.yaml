openapi: 3.1.0
info:
  title: Argus Secret API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /enterprise/secrets:
    get:
      operationId: listSecrets
      summary: List Secret metadata without values.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Secret page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSecret
      summary: Create an encrypted write-only Secret.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '201':
          description: Secret metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/secrets/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getSecret
      summary: Get Secret metadata.
      responses:
        '200':
          description: Secret metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSecret
      summary: Update Secret metadata.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Updated Secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSecret
      summary: Disable an unreferenced Secret.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204':
          description: Secret disabled.
        default:
          $ref: '#/components/responses/Error'
  /enterprise/secrets/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: rotateSecret
      summary: Rotate the write-only value of a Secret.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretRotate'
      responses:
        '200':
          description: Rotated Secret metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/credentials:
    get:
      operationId: listCredentials
      summary: List Credential metadata.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Credential page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCredential
      summary: Create a typed Credential referencing a Secret.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
      responses:
        '201':
          description: Credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateCredential
      summary: Update a Credential.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUpdate'
      responses:
        '200':
          description: Credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/managed-accounts:
    get:
      operationId: listManagedAccounts
      summary: List managed accounts.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Managed account page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccountPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createManagedAccount
      summary: Create a managed account.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAccountCreate'
      responses:
        '201':
          description: Managed account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/managed-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateManagedAccount
      summary: Update a managed account.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAccountUpdate'
      responses:
        '200':
          description: Managed account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
    Secret:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - name
        - type
        - status
        - current_version
        - reference_count
        - version
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/SecretType'
        description:
          type: string
          maxLength: 2048
        status:
          type: string
          enum:
            - active
            - disabled
        current_version:
          type: integer
          minimum: 1
        reference_count:
          type: integer
          minimum: 0
        last_accessed_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SecretCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - value
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/SecretType'
        description:
          type: string
          maxLength: 2048
        value:
          type: string
          minLength: 1
          maxLength: 1048576
          writeOnly: true
    SecretUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        status:
          type: string
          enum:
            - active
            - disabled
        expected_version:
          type: integer
          format: int64
          minimum: 1
    SecretRotate:
      type: object
      additionalProperties: false
      required:
        - value
        - expected_version
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 1048576
          writeOnly: true
        expected_version:
          type: integer
          format: int64
          minimum: 1
    SecretPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        page:
          $ref: '#/components/schemas/CursorPage'
    Credential:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - name
        - protocol
        - secret_id
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        protocol:
          type: string
          enum:
            - ssh
            - winrm
            - kubernetes
            - http
        username:
          type: string
          maxLength: 256
        secret_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - disabled
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CredentialCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - protocol
        - secret_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        protocol:
          type: string
          enum:
            - ssh
            - winrm
            - kubernetes
            - http
        username:
          type: string
          maxLength: 256
        secret_id:
          type: string
          format: uuid
    CredentialUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        username:
          type: string
          maxLength: 256
        secret_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - disabled
        expected_version:
          type: integer
          format: int64
          minimum: 1
    CredentialPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        page:
          $ref: '#/components/schemas/CursorPage'
    ManagedAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - host_id
        - username
        - privilege_level
        - credential_id
        - allowed_protocols
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
          readOnly: true
        host_id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 256
        privilege_level:
          type: string
          enum:
            - standard
            - sudo
            - administrator
        credential_id:
          type: string
          format: uuid
        allowed_protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - ssh
              - winrm
        status:
          type: string
          enum:
            - active
            - disabled
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ManagedAccountCreate:
      type: object
      additionalProperties: false
      required:
        - host_id
        - username
        - privilege_level
        - credential_id
        - allowed_protocols
      properties:
        host_id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 256
        privilege_level:
          type: string
          enum:
            - standard
            - sudo
            - administrator
        credential_id:
          type: string
          format: uuid
        allowed_protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - ssh
              - winrm
    ManagedAccountUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        privilege_level:
          type: string
          enum:
            - standard
            - sudo
            - administrator
        credential_id:
          type: string
          format: uuid
        allowed_protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - ssh
              - winrm
        status:
          type: string
          enum:
            - active
            - disabled
        expected_version:
          type: integer
          format: int64
          minimum: 1
    ManagedAccountPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedAccount'
        page:
          $ref: '#/components/schemas/CursorPage'
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    SecretType:
      type: string
      enum:
        - ssh_password
        - ssh_private_key
        - winrm_password
        - kubeconfig
        - api_token
        - basic_auth
    PartialMetadata:
      type: object
      additionalProperties: false
      required:
        - partial
        - reasons
      properties:
        partial:
          type: boolean
        reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - authorization_filtered
              - budget_truncated
              - source_timeout
              - source_unavailable
    CursorPage:
      type: object
      additionalProperties: false
      required:
        - next_cursor
        - has_more
        - partial
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
        partial:
          $ref: '#/components/schemas/PartialMetadata'
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Error:
      description: Stable Argus API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
