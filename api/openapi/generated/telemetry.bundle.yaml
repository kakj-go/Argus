openapi: 3.1.0
info:
  title: Argus Telemetry Contracts
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
paths: {}
components:
  schemas:
    TelemetryQuery:
      $ref: '#/components/schemas/query.schema'
    TrustedTelemetryIdentity:
      type: object
      additionalProperties: false
      readOnly: true
      required:
        - enterprise_id
        - resource_id
        - collector_id
      properties:
        enterprise_id:
          type: string
        resource_id:
          type: string
        collector_id:
          type: string
    UserLabelKey:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
    SystemLabelKey:
      type: string
      maxLength: 72
      pattern: ^argus\.io/[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
      readOnly: true
    LabelValue:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9._-]{0,61}[a-z0-9])?$
    LabelRequirement:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - key
            - operator
            - values
          properties:
            key:
              anyOf:
                - $ref: '#/components/schemas/UserLabelKey'
                - $ref: '#/components/schemas/SystemLabelKey'
            operator:
              const: eq
            values:
              type: array
              minItems: 1
              maxItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/LabelValue'
        - type: object
          additionalProperties: false
          required:
            - key
            - operator
            - values
          properties:
            key:
              anyOf:
                - $ref: '#/components/schemas/UserLabelKey'
                - $ref: '#/components/schemas/SystemLabelKey'
            operator:
              const: in
            values:
              type: array
              minItems: 1
              maxItems: 32
              uniqueItems: true
              items:
                $ref: '#/components/schemas/LabelValue'
        - type: object
          additionalProperties: false
          required:
            - key
            - operator
          properties:
            key:
              anyOf:
                - $ref: '#/components/schemas/UserLabelKey'
                - $ref: '#/components/schemas/SystemLabelKey'
            operator:
              enum:
                - exists
                - not_exists
    LabelSelector:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - requirements
      properties:
        schema_version:
          const: argus.label_selector/v1
        requirements:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/LabelRequirement'
    query.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://argus.io/schemas/v1/telemetry/query.schema.json
      title: TelemetryQuery
      type: object
      additionalProperties: false
      required:
        - schema_version
        - signal
        - resource_ids
        - time_range
        - budget
        - field_projection
      properties:
        schema_version:
          const: argus.telemetry_query/v1
        signal:
          enum:
            - metrics
            - logs
            - traces
        resource_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
        label_selector:
          $ref: '#/components/schemas/LabelSelector'
        time_range:
          type: object
          additionalProperties: false
          required:
            - from
            - to
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        filters:
          type: object
          maxProperties: 32
        field_projection:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-zA-Z][a-zA-Z0-9_.]*$
        budget:
          type: object
          additionalProperties: false
          required:
            - max_rows
            - max_scan_bytes
            - timeout_ms
          properties:
            max_rows:
              type: integer
              minimum: 1
              maximum: 100000
            max_scan_bytes:
              type: integer
              minimum: 1
            timeout_ms:
              type: integer
              minimum: 100
              maximum: 60000
      $defs:
        TrustedTelemetryIdentity:
          type: object
          additionalProperties: false
          readOnly: true
          required:
            - enterprise_id
            - resource_id
            - collector_id
          properties:
            enterprise_id:
              type: string
            resource_id:
              type: string
            collector_id:
              type: string
