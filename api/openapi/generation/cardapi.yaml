    CardStateCommand: {$ref: ../components/m5.yaml#/components/schemas/CardStateCommand}
    ToolSchemaCatalog: {$ref: ../components/m5.yaml#/components/schemas/ToolSchemaCatalog}
    CardInstance: {$ref: ../components/m5.yaml#/components/schemas/CardInstance}
