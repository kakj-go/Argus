openapi: 3.1.0
info: {title: Argus Enterprise Authorization API, version: 1.0.0, license: {name: Proprietary, identifier: LicenseRef-Proprietary}}
servers: [{url: /api/v1}]
security: [{sessionCookie: []}]
paths:
  /enterprise/permissions: {$ref: ../argus.yaml#/paths/~1enterprise~1permissions}
  /enterprise/roles: {$ref: ../argus.yaml#/paths/~1enterprise~1roles}
  "/enterprise/roles/{id}":
    $ref: "../argus.yaml#/paths/~1enterprise~1roles~1{id}"
  /enterprise/role-bindings: {$ref: ../argus.yaml#/paths/~1enterprise~1role-bindings}
  "/enterprise/role-bindings/{id}":
    $ref: "../argus.yaml#/paths/~1enterprise~1role-bindings~1{id}"
  "/enterprise/users/{id}/role-assignments":
    $ref: "../argus.yaml#/paths/~1enterprise~1users~1{id}~1role-assignments"
  "/enterprise/data-authorizations/{subject_type}/{subject_id}":
    get:
      operationId: listDataAuthorizationResources
      summary: List explicit data authorization resources for a subject.
      parameters:
        - {name: subject_type, in: path, required: true, schema: {$ref: "#/components/schemas/DataAuthorizationSubjectType"}}
        - {name: subject_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: resource_type, in: query, required: true, schema: {$ref: "#/components/schemas/DataAuthorizationResourceType"}}
        - {$ref: "../argus.yaml#/components/parameters/Cursor"}
        - {$ref: "../argus.yaml#/components/parameters/Limit"}
      responses:
        "200": {description: Resource authorization page., content: {application/json: {schema: {$ref: "#/components/schemas/DataAuthorizationPage"}}}}
        default: {$ref: "../argus.yaml#/components/responses/Error"}
    post:
      operationId: updateDataAuthorization
      summary: Add or remove explicit data authorization resources.
      parameters:
        - {name: subject_type, in: path, required: true, schema: {$ref: "#/components/schemas/DataAuthorizationSubjectType"}}
        - {name: subject_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "../argus.yaml#/components/parameters/CsrfToken"}
        - {$ref: "../argus.yaml#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DataAuthorizationBatch"}}}}
      responses:
        "204": {description: Authorization updated.}
        default: {$ref: "../argus.yaml#/components/responses/Error"}
components:
  securitySchemes:
    sessionCookie: {$ref: ../argus.yaml#/components/securitySchemes/sessionCookie}
  schemas:
    PermissionPage: {$ref: ../components/m2.yaml#/components/schemas/PermissionPage}
    RoleCreate: {$ref: ../components/m2.yaml#/components/schemas/RoleCreate}
    RoleUpdate: {$ref: ../components/m2.yaml#/components/schemas/RoleUpdate}
    RolePage: {$ref: ../components/m2.yaml#/components/schemas/RolePage}
    RoleBindingCreate: {$ref: ../components/m2.yaml#/components/schemas/RoleBindingCreate}
    RoleBindingUpdate: {$ref: ../components/m2.yaml#/components/schemas/RoleBindingUpdate}
    RoleBindingPage: {$ref: ../components/m2.yaml#/components/schemas/RoleBindingPage}
    UserRoleAssignments: {$ref: ../components/m2.yaml#/components/schemas/UserRoleAssignments}
    UserRoleAssignmentsUpdate: {$ref: ../components/m2.yaml#/components/schemas/UserRoleAssignmentsUpdate}
    DataAuthorizationSubjectType:
      type: string
      enum: [user, department, role, service_account]
    DataAuthorizationResourceType:
      type: string
      enum: [host, kubernetes_cluster]
    DataAuthorizationResource:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id, name, direct, inherited, sources]
      properties:
        resource_type: {$ref: "#/components/schemas/DataAuthorizationResourceType"}
        resource_id: {type: string, format: uuid}
        name: {type: string}
        direct: {type: boolean}
        inherited: {type: boolean}
        sources: {type: array, uniqueItems: true, items: {type: string}}
    DataAuthorizationPage:
      type: object
      additionalProperties: false
      required: [items, page, authorization_version, affected_member_count]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/DataAuthorizationResource"}}
        page: {$ref: "../argus.yaml#/components/schemas/CursorPage"}
        authorization_version: {type: integer, format: int64, minimum: 1}
        affected_member_count: {type: integer, format: int64, minimum: 0}
    DataAuthorizationBatch:
      type: object
      additionalProperties: false
      required: [resource_type, resource_ids, remove, expected_version]
      properties:
        resource_type: {$ref: "#/components/schemas/DataAuthorizationResourceType"}
        resource_ids: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        remove: {type: boolean}
        expected_version: {type: integer, format: int64, minimum: 1}
