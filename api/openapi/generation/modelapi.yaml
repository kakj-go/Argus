    AIModelUpdate: {$ref: ../components/m4.yaml#/components/schemas/AIModelUpdate}
    AIModelTestResult: {$ref: ../components/m4.yaml#/components/schemas/AIModelTestResult}
    AIModelPage: {$ref: ../components/m4.yaml#/components/schemas/AIModelPage}
    ModelQuota: {$ref: ../components/m4.yaml#/components/schemas/ModelQuota}
