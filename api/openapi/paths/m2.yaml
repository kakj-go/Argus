    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    responses:
      "200": {description: New one-time temporary password., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/CreatedUserCredential"}}}}
      default: {$ref: "#/components/responses/Error"}
platform_enterprise_admin_disable:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
