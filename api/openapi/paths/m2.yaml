  get:
    operationId: listServiceAccounts
    summary: listServiceAccounts.
    parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
    responses:
      "200": {description: Service accounts., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/ServiceAccountPage"}}}}
      default: {$ref: "#/components/responses/Error"}
  post:
    operationId: createServiceAccount
    summary: createServiceAccount.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/ServiceAccountCreate"}}}}
    responses:
      "201": {description: Service account., content: {application/json: {schema: {$ref: "../components/identity.yaml#/components/schemas/ServiceAccount"}}}}
      default: {$ref: "#/components/responses/Error"}
enterprise_service_account:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  put:
    operationId: updateServiceAccount
    summary: updateServiceAccount.
    parameters: [{$ref: "#/components/parameters/CsrfToken"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/ServiceAccountUpdate"}}}}
    responses:
      "200": {description: Updated service account., content: {application/json: {schema: {$ref: "../components/identity.yaml#/components/schemas/ServiceAccount"}}}}
      default: {$ref: "#/components/responses/Error"}
enterprise_api_keys:
  parameters:
    - name: service_account_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  get:
    operationId: listApiKeys
    summary: listApiKeys.
    parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
    responses:
      "200": {description: API keys., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/ApiKeyPage"}}}}
      default: {$ref: "#/components/responses/Error"}
  post:
    operationId: createApiKey
    summary: createApiKey.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/ApiKeyCreate"}}}}
    responses:
      "201": {description: API key and one-time secret., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/CreatedApiKeySecret"}}}}
      default: {$ref: "#/components/responses/Error"}
enterprise_api_key_rotate:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  post:
    operationId: rotateApiKey
    summary: rotateApiKey.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/ExpectedVersion"}]
    responses:
      "200": {description: Rotated API key and one-time secret., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/CreatedApiKeySecret"}}}}
      default: {$ref: "#/components/responses/Error"}
enterprise_api_key_revoke:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  post:
    operationId: revokeApiKey
    summary: revokeApiKey.
    parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/ExpectedVersion"}]
    responses:
      "204": {description: API key revoked.}
      default: {$ref: "#/components/responses/Error"}
audit_events:
  parameters:
    - {$ref: "#/components/parameters/Audience"}
  get:
    operationId: listAuditEvents
    summary: listAuditEvents.
    parameters:
      - {$ref: "#/components/parameters/Cursor"}
      - {$ref: "#/components/parameters/Limit"}
      - name: action
        in: query
        required: false
        schema: {type: string, pattern: "^[a-z][a-z0-9_.]+$"}
    responses:
      "200": {description: Audit events for the authenticated domain., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/AuditEventPage"}}}}
      default: {$ref: "#/components/responses/Error"}
components:
  parameters:
    Audience:
      name: audience
      in: path
      required: true
      schema: {type: string, enum: [platform, enterprise]}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: "../components/common.yaml#/components/schemas/IdempotencyKey"}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 4096}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    ResourceId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  responses:
    Error:
      description: Stable Argus API error.
      content: {application/json: {schema: {$ref: "../components/common.yaml#/components/schemas/ApiError"}}}
