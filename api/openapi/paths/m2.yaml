      "200": {description: Registered permissions., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/PermissionPage"}}}}
      default: {$ref: "#/components/responses/Error"}
enterprise_roles:
  get:
    operationId: listRoles
    summary: listRoles.
    parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
    responses:
      "200": {description: Roles., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/RolePage"}}}}
