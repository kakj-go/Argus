    summary: createRole.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/RoleCreate"}}}}
    responses:
