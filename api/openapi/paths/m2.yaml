setup_status:
  get:
    operationId: getSetupStatus
    summary: getSetupStatus.
    security: []
    responses:
      "200":
        description: Current initialization state.
        content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/SetupStatus"}}}
      default: {$ref: "#/components/responses/Error"}
setup_initialize:
  post:
    operationId: initializePlatform
    summary: initializePlatform.
    security: [{setupToken: []}]
    parameters:
      - {$ref: "#/components/parameters/IdempotencyKey"}
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/SetupInitializeRequest"}}}
    responses:
      "201":
        description: Platform initialized.
        content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/SetupInitializeResult"}}}
      default: {$ref: "#/components/responses/Error"}
auth_login:
  parameters:
    - {$ref: "#/components/parameters/Audience"}
  post:
    operationId: login
    summary: login.
    security: []
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/LoginRequest"}}}
    responses:
      "200":
        description: Authenticated session or required password-change challenge.
        content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/LoginResult"}}}
      default: {$ref: "#/components/responses/Error"}
auth_session:
  parameters:
    - {$ref: "#/components/parameters/Audience"}
  get:
    operationId: getAuthenticatedSession
    summary: getAuthenticatedSession.
    responses:
      "200":
        description: Current authenticated session.
        content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/AuthenticatedSession"}}}
      default: {$ref: "#/components/responses/Error"}
  delete:
    operationId: logout
    summary: logout.
    parameters:
      - {$ref: "#/components/parameters/CsrfToken"}
    responses:
      "204": {description: Session revoked.}
      default: {$ref: "#/components/responses/Error"}
auth_complete_password_change:
  parameters:
    - {$ref: "#/components/parameters/Audience"}
  post:
    operationId: completePasswordChange
    summary: completePasswordChange.
    security: []
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/CompletePasswordChangeRequest"}}}
    responses:
      "200":
        description: Password changed and session issued.
        content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/AuthenticatedSession"}}}
      default: {$ref: "#/components/responses/Error"}
account_password:
  parameters:
    - {$ref: "#/components/parameters/Audience"}
  put:
    operationId: updateOwnPassword
    summary: updateOwnPassword.
    parameters:
      - {$ref: "#/components/parameters/CsrfToken"}
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/PasswordUpdateRequest"}}}
    responses:
      "204": {description: Password changed and other sessions revoked.}
      default: {$ref: "#/components/responses/Error"}
platform_enterprises:
  get:
    operationId: listEnterprises
    summary: listEnterprises.
    parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
    responses:
      "200":
        description: Enterprise page.
        content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/EnterprisePage"}}}
      default: {$ref: "#/components/responses/Error"}
  post:
    operationId: createEnterprise
    summary: createEnterprise.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/EnterpriseCreate"}}}
    responses:
      "201":
        description: Enterprise created with default department, roles and empty scope.
        content: {application/json: {schema: {$ref: "../components/identity.yaml#/components/schemas/Enterprise"}}}
      default: {$ref: "#/components/responses/Error"}
platform_enterprise:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  get:
    operationId: getEnterprise
    summary: getEnterprise.
    responses:
      "200": {description: Enterprise., content: {application/json: {schema: {$ref: "../components/identity.yaml#/components/schemas/Enterprise"}}}}
      default: {$ref: "#/components/responses/Error"}
  put:
    operationId: updateEnterprise
    summary: updateEnterprise.
    parameters: [{$ref: "#/components/parameters/CsrfToken"}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/EnterpriseUpdate"}}}
    responses:
      "200": {description: Updated enterprise., content: {application/json: {schema: {$ref: "../components/identity.yaml#/components/schemas/Enterprise"}}}}
      default: {$ref: "#/components/responses/Error"}
platform_enterprise_state:
  parameters:
    - {$ref: "#/components/parameters/ResourceId"}
    - name: state_action
      in: path
      required: true
      schema: {type: string, enum: [suspend, activate, disable]}
  post:
    operationId: changeEnterpriseState
    summary: changeEnterpriseState.
    parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/ExpectedVersion"}]
    responses:
      "200": {description: Enterprise state changed., content: {application/json: {schema: {$ref: "../components/identity.yaml#/components/schemas/Enterprise"}}}}
      default: {$ref: "#/components/responses/Error"}
platform_enterprise_admins:
  get:
    operationId: listEnterpriseAdmins
    summary: listEnterpriseAdmins.
    parameters:
      - name: enterprise_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - {$ref: "#/components/parameters/Cursor"}
      - {$ref: "#/components/parameters/Limit"}
    responses:
      "200": {description: Enterprise administrators., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/EnterpriseUserPage"}}}}
      default: {$ref: "#/components/responses/Error"}
  post:
    operationId: createEnterpriseAdmin
    summary: createEnterpriseAdmin.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody:
      required: true
      content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/EnterpriseAdminCreate"}}}
    responses:
      "201": {description: Administrator and one-time temporary password., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/CreatedUserCredential"}}}}
      default: {$ref: "#/components/responses/Error"}
platform_enterprise_admin_reset:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  post:
    operationId: resetEnterpriseAdminPassword
