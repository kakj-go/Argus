    responses:
      "200": {description: Updated user role assignments., content: {application/json: {schema: {$ref: "../components/m2.yaml#/components/schemas/UserRoleAssignments"}}}}
      default: {$ref: "#/components/responses/Error"}
enterprise_role_binding:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  put:
    operationId: updateRoleBinding
    summary: updateRoleBinding.
