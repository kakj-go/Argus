    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    responses:
      "200": {description: Cancelled Pending Action., content: {application/json: {schema: {$ref: "../../schemas/action/pending-action-public.schema.json"}}}}
