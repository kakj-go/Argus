connector_bootstrap_script:
  get:
    operationId: getConnectorBootstrapScript
    summary: Download a strict Connector bootstrap script using a pending enrollment token.
    description: 公开目标机端点；短命令可仅对本次脚本下载放宽 TLS，返回脚本内嵌版本化 Trust Bundle，后续请求保持严格校验。读取脚本不消费 enrollment token。
    security: [{connectorEnrollmentToken: []}]
    parameters:
      - name: scope
        in: query
        required: true
        schema: {type: string, enum: [linux-system, linux-user]}
    responses:
      "200":
        description: Generated strict bootstrap script.
        headers:
          Cache-Control: {schema: {type: string}}
          Content-Disposition: {schema: {type: string}}
          X-Content-Type-Options: {schema: {type: string}}
        content: {text/x-shellscript: {schema: {type: string, minLength: 1, maxLength: 131072}}}
      default: {$ref: "#/components/responses/Error"}
