    summary: Read at most one MiB of Pod logs.
    parameters:
      - {name: namespace, in: query, required: true, schema: {type: string, maxLength: 253}}
      - {name: pod, in: query, required: true, schema: {type: string, maxLength: 253}}
      - {name: container, in: query, required: false, schema: {type: string, maxLength: 253}}
      - {name: tail_lines, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 5000, default: 500}}
    responses:
      "200": {description: Bounded Pod logs., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/PodLogs"}}}}
      default: {$ref: "#/components/responses/Error"}
