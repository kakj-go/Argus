  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  get:
    operationId: listKubernetesResources
    summary: List bounded Kubernetes resources after cluster and Namespace DataScope checks.
    parameters:
      - {name: resource_type, in: query, required: true, schema: {type: string, enum: [namespace, node, pod, deployment, statefulset, daemonset, service]}}
      - {name: namespace, in: query, required: false, schema: {type: string, maxLength: 253}}
      - {name: query, in: query, required: false, schema: {type: string, maxLength: 256}}
      - {$ref: "#/components/parameters/Cursor"}
      - {$ref: "#/components/parameters/Limit"}
    responses:
      "200": {description: Kubernetes resource page., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/KubernetesResourcePage"}}}}
      default: {$ref: "#/components/responses/Error"}
