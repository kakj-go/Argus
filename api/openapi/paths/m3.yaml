pending_action_collection:
  get:
    operationId: listPendingActions
    summary: List resource-management Pending Actions.
    parameters:
      - {$ref: "#/components/parameters/Cursor"}
      - {$ref: "#/components/parameters/Limit"}
      - {name: scope, in: query, required: false, schema: {type: string, enum: [mine, created, all], default: all}}
      - {name: status, in: query, required: false, style: form, explode: true, schema: {type: array, items: {type: string, enum: [prepared, awaiting_confirmation, awaiting_approval, ready, executing, succeeded, failed, result_unknown, cancelled, expired, rejected, invalidated]}}}
      - {name: risk, in: query, required: false, style: form, explode: true, schema: {type: array, items: {type: string, enum: [read, write, dangerous, critical]}}}
      - {name: query, in: query, required: false, schema: {type: string, maxLength: 256}}
    responses:
      "200":
        description: Pending Action page.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, page]
              properties:
                items: {type: array, items: {$ref: "../../schemas/action/pending-action-public.schema.json"}}
                page: {$ref: "../components/common.yaml#/components/schemas/CursorPage"}
      default: {$ref: "#/components/responses/Error"}
pending_action_item:
  parameters:
    - {name: action_ref, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  get:
