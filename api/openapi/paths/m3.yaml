    security: [{connectorEnrollmentToken: []}]
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/ConnectorEnrollRequest"}}}}
    responses:
      "201": {description: Connector identity and certificate., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/ConnectorEnrollResult"}}}}
      default: {$ref: "#/components/responses/Error"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: "../components/common.yaml#/components/schemas/IdempotencyKey"}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 4096}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    ResourceId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  responses:
    Error:
      description: Stable Argus API error.
      content: {application/json: {schema: {$ref: "../components/common.yaml#/components/schemas/ApiError"}}}
