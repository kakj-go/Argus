    summary: Get a public Pending Action.
    responses:
      "200": {description: Pending Action., content: {application/json: {schema: {$ref: "../../schemas/action/pending-action-public.schema.json"}}}}
      default: {$ref: "#/components/responses/Error"}
pending_action_confirm:
