secret_collection:
  get:
    operationId: listSecrets
    summary: List Secret metadata without values.
    parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
    responses:
      "200": {description: Secret page., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/SecretPage"}}}}
      default: {$ref: "#/components/responses/Error"}
  post:
    operationId: createSecret
    summary: Create an encrypted write-only Secret.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/SecretCreate"}}}}
    responses:
      "201": {description: Secret metadata., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/Secret"}}}}
      default: {$ref: "#/components/responses/Error"}
secret_item:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  get:
    operationId: getSecret
    summary: Get Secret metadata.
    responses:
      "200": {description: Secret metadata., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/Secret"}}}}
      default: {$ref: "#/components/responses/Error"}
  put:
    operationId: updateSecret
    summary: Update Secret metadata.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/SecretUpdate"}}}}
    responses:
      "200": {description: Updated Secret., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/Secret"}}}}
      default: {$ref: "#/components/responses/Error"}
  delete:
    operationId: deleteSecret
    summary: Disable an unreferenced Secret.
    parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/ExpectedVersion"}]
    responses:
      "204": {description: Secret disabled.}
      default: {$ref: "#/components/responses/Error"}
secret_rotate:
  parameters: [{$ref: "#/components/parameters/ResourceId"}]
  post:
    operationId: rotateSecret
    summary: Rotate the write-only value of a Secret.
    parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/CsrfToken"}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/SecretRotate"}}}}
    responses:
      "200": {description: Rotated Secret metadata., content: {application/json: {schema: {$ref: "../components/m3.yaml#/components/schemas/Secret"}}}}
      default: {$ref: "#/components/responses/Error"}
