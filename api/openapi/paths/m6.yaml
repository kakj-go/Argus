grant_collection:
  get:
    operationId: listRemoteAccessGrants
    summary: List remote access grants.
    parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
    responses: {'200': {description: Grant page., content: {application/json: {schema: {$ref: '../components/m6.yaml#/components/schemas/RemoteAccessGrantPage'}}}}, default: {$ref: '#/components/responses/Error'}}
  post:
    operationId: createRemoteAccessGrant
    summary: Create a remote access grant.
    parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: '../components/m6.yaml#/components/schemas/RemoteAccessGrantWrite'}}}}
    responses: {'201': {description: Grant., content: {application/json: {schema: {$ref: '../components/m6.yaml#/components/schemas/RemoteAccessGrant'}}}}, default: {$ref: '#/components/responses/Error'}}
grant_item:
  parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
  get:
    operationId: getRemoteAccessGrant
    summary: Get a remote access grant.
    responses: {'200': {description: Grant., content: {application/json: {schema: {$ref: '../components/m6.yaml#/components/schemas/RemoteAccessGrant'}}}}, default: {$ref: '#/components/responses/Error'}}
  put:
    operationId: updateRemoteAccessGrant
    summary: Update a remote access grant with optimistic concurrency.
    parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: '../components/m6.yaml#/components/schemas/RemoteAccessGrantUpdate'}}}}
    responses: {'200': {description: Grant., content: {application/json: {schema: {$ref: '../components/m6.yaml#/components/schemas/RemoteAccessGrant'}}}}, default: {$ref: '#/components/responses/Error'}}
  delete:
    operationId: disableRemoteAccessGrant
    summary: Disable a remote access grant.
    parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
    responses: {'204': {description: Grant disabled.}, default: {$ref: '#/components/responses/Error'}}
policy_collection:
