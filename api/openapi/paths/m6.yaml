    responses: {'201': {description: Policy., content: {application/json: {schema: {$ref: '../components/m6.yaml#/components/schemas/RemoteAccessPolicy'}}}}, default: {$ref: '#/components/responses/Error'}}
policy_item:
  parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
  get:
    operationId: getRemoteAccessPolicy
