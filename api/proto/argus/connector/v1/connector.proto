syntax = "proto3";

package argus.connector.v1;

option go_package = "github.com/kakj-go/Argus/internal/gen/proto/argus/connector/v1;connectorv1";

import "argus/common/v1/common.proto";
import "argus/connector/v1/commands.proto";
import "argus/connector/v1/telemetry_tunnel.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service ConnectorControlService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message ConnectRequest {
  uint64 sequence = 1;
  oneof frame {
    ConnectorHello hello = 2;
    ConnectorHeartbeat heartbeat = 3;
    CommandResult command_result = 4;
    ClientAcknowledge acknowledge = 5;
    RemoteAccessData remote_access_data = 6;
    CredentialLeaseRequest credential_lease_request = 7;
    CommandReconcileResult command_reconcile_result = 8;
    CertificateRotationRequest certificate_rotation_request = 9;
    RemoteAccessOutput remote_access_output = 10;
    RemoteAccessState remote_access_state = 12;
    RemoteAccessClose remote_access_close = 13;
    TelemetryTunnelStatusSet telemetry_tunnel_status_set = 14;
    TrustBundleAcknowledge trust_bundle_acknowledge = 15;
  }
  reserved 11;
}

message ConnectResponse {
  uint64 sequence = 1;
  oneof frame {
    ConnectorWelcome welcome = 2;
    ConnectorCommand command = 3;
    ServerAcknowledge acknowledge = 4;
    RemoteAccessOpen remote_access_open = 5;
    RemoteAccessData remote_access_data = 6;
    RemoteAccessClose remote_access_close = 7;
    argus.common.v1.StreamClose close = 8;
    CredentialLeaseGrant credential_lease_grant = 9;
    CommandReconcileRequest command_reconcile_request = 10;
    CertificateRotationGrant certificate_rotation_grant = 11;
    RemoteAccessInput remote_access_input = 12;
    RemoteAccessResize remote_access_resize = 13;
    RemoteAccessState remote_access_state = 14;
    TelemetryTunnelDesiredSet telemetry_tunnel_desired_set = 15;
    TrustBundleUpdate trust_bundle_update = 16;
  }
}

message ConnectorHello {
  string protocol_version = 1;
  string instance_id = 2;
  string software_version = 3;
  repeated string capabilities = 4;
  uint64 last_acknowledged_server_sequence = 5;
  bytes client_nonce = 6;
  uint64 trust_bundle_epoch = 7;
  string trust_bundle_sha256 = 8;
  repeated string trust_bundle_ca_fingerprints = 9;
}

message ConnectorWelcome {
  string protocol_version = 1;
  uint64 connection_epoch = 2;
  google.protobuf.Timestamp server_time = 3;
  google.protobuf.Duration heartbeat_interval = 4;
  uint32 max_message_bytes = 5;
  uint32 max_inflight_commands = 6;
  bytes server_nonce = 7;
  bool certificate_rotation_requested = 8;
}

message ConnectorHeartbeat {
  uint64 connection_epoch = 1;
  google.protobuf.Timestamp sent_at = 2;
  uint32 active_commands = 3;
  uint32 active_remote_access_streams = 4;
  repeated TelemetryTunnelStatus telemetry_tunnels = 5;
  uint64 trust_bundle_epoch = 6;
  string trust_bundle_sha256 = 7;
  repeated string trust_bundle_ca_fingerprints = 8;
}

message ClientAcknowledge {
  uint64 server_sequence = 1;
}

message ServerAcknowledge {
  uint64 client_sequence = 1;
}

message RemoteAccessOpen {
  string stream_id = 1;
  string session_id = 2;
  string managed_account_id = 3;
  string protocol = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint32 max_frame_bytes = 6;
  uint64 connection_epoch = 7;
  uint64 session_fence = 8;
  string target_host = 9;
  uint32 target_port = 10;
  string host_key_fingerprint = 11;
  string credential_lease_id = 12;
  uint32 terminal_cols = 13;
  uint32 terminal_rows = 14;
  google.protobuf.Duration idle_timeout = 15;
  google.protobuf.Duration max_duration = 16;
  string username = 17;
}

// Deprecated: M6 peers use typed input/output/resize/state frames.
message RemoteAccessData {
  option deprecated = true;
  string stream_id = 1;
  uint64 stream_sequence = 2;
  bytes data = 3;
  bool end_of_stream = 4;
}

message RemoteAccessInput {
  string stream_id = 1;
  uint64 stream_sequence = 2;
  bytes data = 3;
}

message RemoteAccessOutput {
  string stream_id = 1;
  uint64 stream_sequence = 2;
  RemoteAccessOutputStream stream = 3;
  bytes data = 4;
}

enum RemoteAccessOutputStream {
  REMOTE_ACCESS_OUTPUT_STREAM_UNSPECIFIED = 0;
  REMOTE_ACCESS_OUTPUT_STREAM_STDOUT = 1;
  REMOTE_ACCESS_OUTPUT_STREAM_STDERR = 2;
}

message RemoteAccessResize {
  string stream_id = 1;
  uint64 stream_sequence = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message RemoteAccessState {
  string stream_id = 1;
  uint64 stream_sequence = 2;
  RemoteAccessStateValue state = 3;
  string reason = 4;
}

enum RemoteAccessStateValue {
  REMOTE_ACCESS_STATE_VALUE_UNSPECIFIED = 0;
  REMOTE_ACCESS_STATE_VALUE_CONNECTING = 1;
  REMOTE_ACCESS_STATE_VALUE_ACTIVE = 2;
  REMOTE_ACCESS_STATE_VALUE_TERMINATING = 3;
  REMOTE_ACCESS_STATE_VALUE_TERMINATED = 4;
  REMOTE_ACCESS_STATE_VALUE_FAILED = 5;
  REMOTE_ACCESS_STATE_VALUE_CONNECTION_LOST = 6;
  REMOTE_ACCESS_STATE_VALUE_INVALIDATED = 7;
}

message RemoteAccessClose {
  string stream_id = 1;
  argus.common.v1.StreamClose close = 2;
  uint64 stream_sequence = 3;
}
