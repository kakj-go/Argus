syntax = "proto3";

package argus.directexecutor.v1;

option go_package = "github.com/kakj-go/Argus/internal/gen/proto/argus/directexecutor/v1;directexecutorv1";

// DirectExecutorService is an internal mTLS boundary. PostgreSQL remains the
// source of truth; callers only send the durable connection-test identifier.
service DirectExecutorService {
  rpc DispatchConnectionTest(DispatchConnectionTestRequest) returns (DispatchConnectionTestResponse);
  rpc DispatchCollectorManagement(DispatchCollectorManagementRequest) returns (DispatchCollectorManagementResponse);
  rpc OpenRemoteAccess(stream OpenRemoteAccessRequest) returns (stream OpenRemoteAccessResponse);
}

message DispatchConnectionTestRequest {
  string connection_test_id = 1;
}

message DispatchConnectionTestResponse {
  DispatchStatus status = 1;
}

enum DispatchStatus {
  DISPATCH_STATUS_UNSPECIFIED = 0;
  DISPATCH_STATUS_ACCEPTED = 1;
  DISPATCH_STATUS_ALREADY_HANDLED = 2;
}

message DispatchCollectorManagementRequest {
  string operation_id = 1;
}

message DispatchCollectorManagementResponse {
  DispatchStatus status = 1;
}

message OpenRemoteAccessRequest {
  uint64 sequence = 1;
  oneof frame {
    RemoteAccessOpen open = 2;
    RemoteAccessInput input = 3;
    RemoteAccessResize resize = 4;
    RemoteAccessClose close = 5;
  }
}

message OpenRemoteAccessResponse {
  uint64 sequence = 1;
  oneof frame {
    RemoteAccessReady ready = 2;
    RemoteAccessOutput output = 3;
    RemoteAccessState state = 4;
  }
}

message RemoteAccessOpen {
  string session_id = 1;
  uint64 session_fence = 2;
  string host_id = 3;
  string managed_account_id = 4;
  string credential_lease_id = 5;
  string protocol = 6;
  string target_host = 7;
  uint32 target_port = 8;
  string host_key_fingerprint = 9;
  uint32 terminal_cols = 10;
  uint32 terminal_rows = 11;
  uint32 idle_timeout_seconds = 12;
  uint32 max_duration_seconds = 13;
}

message RemoteAccessInput { bytes data = 1; }
message RemoteAccessResize { uint32 cols = 1; uint32 rows = 2; }
message RemoteAccessClose { string reason = 1; }
message RemoteAccessReady { string mode = 1; }
message RemoteAccessOutput { string stream = 1; bytes data = 2; }
message RemoteAccessState { string status = 1; string reason = 2; }
