syntax = "proto3";

package argus.telemetry.v1;

option go_package = "github.com/kakj-go/Argus/internal/gen/proto/argus/telemetry/v1;telemetryv1";

import "argus/common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service TelemetryIdentityService {
  rpc ResolveCollector(ResolveCollectorRequest) returns (ResolveCollectorResponse);
}

// TelemetryQueryService is an internal mTLS boundary. The caller supplies a
// server-authorized enterprise/resource set; the service never accepts SQL.
service TelemetryQueryService {
  rpc ExecuteQueryV2(ExecuteQueryV2Request) returns (ExecuteQueryV2Response);
  rpc QueryOverview(QueryOverviewRequest) returns (QueryOverviewResponse);
  rpc EnsureTenantSchema(EnsureTenantSchemaRequest) returns (EnsureTenantSchemaResponse);
  rpc DropTenantSchema(DropTenantSchemaRequest) returns (DropTenantSchemaResponse);
}

message ResolveCollectorRequest {
  string credential_id = 1;
  string certificate_fingerprint = 2;
}

message ResolveCollectorResponse {
  TrustedTelemetryIdentity identity = 1;
  uint64 authorization_version = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message TrustedTelemetryIdentity {
  string enterprise_id = 1;
  string resource_id = 2;
  string collector_id = 3;
}

message TelemetryIngestContext {
  TrustedTelemetryIdentity identity = 1;
  string signal = 2;
  string schema_version = 3;
  string payload_hash = 4;
  google.protobuf.Timestamp received_at = 5;
}

message TelemetryQueryScope {
  string enterprise_id = 1;
  repeated argus.common.v1.ResourceRef authorized_resources = 2;
  repeated string allowed_signals = 3;
  uint64 authorization_version = 4;
  string scope_hash = 5;
  bool sensitive_fields = 6;
}

message QueryOverviewRequest {
  string schema_version = 1;
  TelemetryQueryScope scope = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  uint64 max_scan_bytes = 5;
  uint32 timeout_millis = 6;
}

message TelemetryQueryResponse {
  string schema_version = 1;
  bytes result_json = 2;
  bool partial = 3;
  repeated string partial_reasons = 4;
  uint64 scanned_bytes = 5;
  uint64 elapsed_millis = 6;
}

message QueryOverviewResponse { TelemetryQueryResponse result = 1; }

message EnsureTenantSchemaRequest {
  string enterprise_id = 1;
  uint32 schema_version = 2;
}

message DropTenantSchemaRequest {
  string enterprise_id = 1;
  uint32 schema_version = 2;
}

message EnsureTenantSchemaResponse {
  uint32 schema_version = 1;
  string status = 2;
}

message DropTenantSchemaResponse {
  uint32 schema_version = 1;
  string status = 2;
}

// ExecuteQueryV2Request is the single-process query contract. The oneof keeps
// language-specific syntax out of a shared DSL/IR while preserving one RPC
// boundary for auth, budget and audit enforcement.
message ExecuteQueryV2Request {
  string schema_version = 1;
  TelemetryQueryScope scope = 2;
  QueryBudget budget = 3;

  oneof query {
    PromQLQuery promql = 10;
    KQLQuery kql = 11;
    TraceGraphQLQuery trace_graphql = 12;
  }
}

message QueryBudget {
  uint64 max_scan_bytes = 1;
  uint32 max_rows = 2;
  uint32 max_samples = 3;
  uint32 timeout_millis = 4;
  uint64 max_result_bytes = 5;
  uint32 max_series = 6;
}

message PromQLQuery {
  string expression = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  uint64 step_seconds = 4;
  bool instant = 5;
}

message KQLQuery {
  string expression = 1;
  string pipeline = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
}

message TraceGraphQLQuery {
  string document = 1;
  string operation_name = 2;
  google.protobuf.Struct variables = 3;
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;
}

message ExecuteQueryV2Response {
  string schema_version = 1;
  string language = 2;
  string result_type = 3;
  bytes result_json = 4;
  repeated string warnings = 5;
  bool partial = 6;
  QueryMeta meta = 7;
}

message QueryMeta {
  string plan_hash = 1;
  string engine = 2;
  string engine_version = 3;
  uint64 scanned_bytes = 4;
  uint64 scanned_rows = 5;
  uint64 returned_rows = 6;
  uint64 loaded_samples = 7;
  uint64 elapsed_millis = 8;
  bool partial = 9;
}
