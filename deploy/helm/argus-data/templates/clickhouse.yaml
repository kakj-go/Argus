{{- if .Values.components.clickhouse }}
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: argus-clickhouse
  namespace: {{ .Values.namespaces.observability }}
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
      serviceTemplate: cluster-service
  configuration:
    zookeeper:
      nodes:
        - host: argus-keeper
          port: 9181
    users:
      argus/password:
        valueFrom:
          secretKeyRef:
            name: argus-clickhouse-credentials
            key: password
      argus/networks/ip: "::/0"
      argus/profile: default
      argus/quota: default
      argus/access_management: 1
      argus_telemetry_migration/password:
        valueFrom: {secretKeyRef: {name: argus-telemetry-clickhouse, key: migration-password}}
      argus_telemetry_migration/networks/ip: "::/0"
      argus_telemetry_migration/grants/query:
        - GRANT ALL ON *.* WITH GRANT OPTION
      argus_telemetry_writer/password:
        valueFrom: {secretKeyRef: {name: argus-telemetry-clickhouse, key: writer-password}}
      argus_telemetry_writer/networks/ip: "::/0"
      argus_telemetry_writer/grants/query:
        - GRANT INSERT ON argus_telemetry.*
      argus_telemetry_query/password:
        valueFrom: {secretKeyRef: {name: argus-telemetry-clickhouse, key: query-password}}
      argus_telemetry_query/networks/ip: "::/0"
      argus_telemetry_query/profile: readonly
      argus_telemetry_query/grants/query:
        - GRANT SELECT ON argus_telemetry.*
    profiles:
      # Level 2 keeps DDL/DML blocked while allowing the Query service to
      # tighten per-request execution and scan budgets.
      readonly/readonly: 2
    clusters:
      - name: main
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: {{ .Values.images.clickhouse }}
              resources:
                requests: {cpu: 500m, memory: 2Gi}
                limits: {cpu: "2", memory: 4Gi}
    volumeClaimTemplates:
      - name: data
        spec:
          storageClassName: {{ .Values.storageClass }}
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: {{ .Values.persistence.clickhouse }}
    serviceTemplates:
      - name: cluster-service
        generateName: argus-clickhouse
        spec:
          ports:
            - {name: http, port: 8123}
            - {name: tcp, port: 9000}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-clickhouse-client
  namespace: {{ .Values.namespaces.observability }}
spec:
  selector:
    clickhouse.altinity.com/chi: argus-clickhouse
    clickhouse.altinity.com/cluster: main
    clickhouse.altinity.com/ready: "yes"
  ports:
    - {name: http, port: 8123, targetPort: 8123}
    - {name: tcp, port: 9000, targetPort: 9000}
{{- end }}
