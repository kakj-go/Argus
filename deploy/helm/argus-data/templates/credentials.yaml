{{- if .Values.components.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: argus-data-credentials
  namespace: {{ .Values.namespaces.system }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
type: Opaque
stringData:
  postgresql-password: {{ required "secrets.postgresqlPassword is required" .Values.secrets.postgresqlPassword | quote }}
  redis-password: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | quote }}
  minio-root-user: {{ required "secrets.minioRootUser is required" .Values.secrets.minioRootUser | quote }}
  minio-root-password: {{ required "secrets.minioRootPassword is required" .Values.secrets.minioRootPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-clickhouse-credentials
  namespace: {{ .Values.namespaces.observability }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
type: Opaque
stringData:
  username: argus
  password: {{ required "secrets.clickhousePassword is required" .Values.secrets.clickhousePassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-telemetry-clickhouse
  namespace: {{ .Values.namespaces.observability }}
type: Opaque
stringData:
  migration-password: {{ required "secrets.telemetryClickhouseMigrationPassword is required" .Values.secrets.telemetryClickhouseMigrationPassword | quote }}
  writer-password: {{ required "secrets.telemetryClickhouseWriterPassword is required" .Values.secrets.telemetryClickhouseWriterPassword | quote }}
  query-password: {{ required "secrets.telemetryClickhouseQueryPassword is required" .Values.secrets.telemetryClickhouseQueryPassword | quote }}
{{- end }}
