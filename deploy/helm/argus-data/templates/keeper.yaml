{{- if .Values.components.keeper }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-keeper-config
  namespace: {{ .Values.namespaces.observability }}
data:
  keeper.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
      <logger><level>information</level><console>true</console></logger>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>information</raft_logs_level>
        </coordination_settings>
        <raft_configuration>
          <server><id>1</id><hostname>argus-keeper-0.argus-keeper</hostname><port>9234</port></server>
        </raft_configuration>
      </keeper_server>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: argus-keeper
  namespace: {{ .Values.namespaces.observability }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: argus-keeper
  ports:
    - {name: client, port: 9181, targetPort: 9181}
    - {name: raft, port: 9234, targetPort: 9234}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argus-keeper
  namespace: {{ .Values.namespaces.observability }}
spec:
  serviceName: argus-keeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-keeper
        app.kubernetes.io/part-of: argus
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: keeper
          image: {{ .Values.images.clickhouse }}
          imagePullPolicy: IfNotPresent
          command: ["clickhouse-keeper"]
          args: ["--config-file=/etc/clickhouse-keeper/keeper.xml"]
          ports:
            - {name: client, containerPort: 9181}
            - {name: raft, containerPort: 9234}
          readinessProbe:
            tcpSocket: {port: client}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/clickhouse-keeper}
            - {name: data, mountPath: /var/lib/clickhouse}
      volumes:
        - name: config
          configMap:
            name: argus-keeper-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.keeper }}
{{- end }}
