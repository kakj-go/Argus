{{- if .Values.components.minio }}
apiVersion: v1
kind: Service
metadata:
  name: argus-minio
  namespace: {{ .Values.namespaces.system }}
spec:
  selector:
    app.kubernetes.io/name: argus-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argus-minio
  namespace: {{ .Values.namespaces.system }}
spec:
  serviceName: argus-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-minio
        app.kubernetes.io/part-of: argus
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.images.minio }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: argus-data-credentials
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argus-data-credentials
                  key: minio-root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.minio }}
{{- end }}
