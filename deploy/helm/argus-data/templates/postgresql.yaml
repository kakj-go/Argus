{{- if .Values.components.postgresql }}
apiVersion: v1
kind: Service
metadata:
  name: argus-postgresql
  namespace: {{ .Values.namespaces.system }}
spec:
  selector:
    app.kubernetes.io/name: argus-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argus-postgresql
  namespace: {{ .Values.namespaces.system }}
spec:
  serviceName: argus-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-postgresql
        app.kubernetes.io/part-of: argus
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: {{ .Values.images.postgresql }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: argus
            - name: POSTGRES_USER
              value: argus
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argus-data-credentials
                  key: postgresql-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- if .Values.databaseRoles.enabled }}
            - {name: ARGUS_SERVER_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: server}}}
            - {name: ARGUS_WORKER_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: worker}}}
            - {name: ARGUS_GATEWAY_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: gateway}}}
            - {name: ARGUS_DIRECT_EXECUTOR_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: direct-executor}}}
            - {name: ARGUS_MIGRATION_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: migration}}}
            - {name: ARGUS_TELEMETRY_INGEST_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: telemetry-ingest}}}
            - {name: ARGUS_TELEMETRY_WRITER_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: telemetry-writer}}}
            - {name: ARGUS_TELEMETRY_QUERY_PASSWORD, valueFrom: {secretKeyRef: {name: argus-postgresql-role-passwords, key: telemetry-query}}}
            {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U argus -d argus"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.databaseRoles.enabled }}
            - name: role-init
              mountPath: /docker-entrypoint-initdb.d/10-argus-roles.sh
              subPath: 10-argus-roles.sh
              readOnly: true
            {{- end }}
      {{- if .Values.databaseRoles.enabled }}
      volumes:
        - name: role-init
          configMap:
            name: argus-postgresql-role-init
            defaultMode: 0555
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.postgresql }}
{{- end }}
