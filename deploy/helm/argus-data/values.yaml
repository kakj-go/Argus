releaseId: argus
namespaces:
  system: argus-system
  observability: argus-observability
storageClass: standard
images:
  registry: host.docker.internal:5001
  tag: dev
  pullPolicy: Never
  postgresql: postgres:18.6-alpine
  redis: redis:8.10.0-alpine
  minio: host.docker.internal:5001/argus/minio:dev
  clickhouse: clickhouse/clickhouse-server:26.3.17.110-alpine
persistence:
  postgresql: 2Gi
  redis: 1Gi
  minio: 5Gi
  kafka: 4Gi
  clickhouse: 6Gi
  keeper: 1Gi
secrets:
  postgresqlPassword: ""
  redisPassword: ""
  minioRootUser: ""
  minioRootPassword: ""
  clickhousePassword: ""
