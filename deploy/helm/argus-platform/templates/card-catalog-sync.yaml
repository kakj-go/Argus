apiVersion: batch/v1
kind: Job
metadata:
  name: argus-card-catalog-sync
  namespace: {{ .Values.namespaces.system }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-card-catalog-sync
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: {{ .Values.images.backend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/usr/local/bin/argus-card-catalog-sync"]
          envFrom:
            - secretRef:
                name: argus-runtime-secrets
            - configMapRef:
                name: argus-runtime-config
          env:
            - name: ARGUS_TELEMETRY_TOOL_CATALOG_ENABLED
              value: {{ .Values.runtime.telemetryToolCatalogEnabled | quote }}
