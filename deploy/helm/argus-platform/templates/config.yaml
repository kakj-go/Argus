apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-runtime-config
  namespace: {{ .Values.namespaces.system }}
data:
  ARGUS_ALLOWED_ORIGINS: {{ join "," .Values.runtime.allowedOrigins | quote }}
  ARGUS_SECURE_COOKIES: {{ .Values.runtime.secureCookies | quote }}
  ARGUS_SETUP_TOKEN_PATH: /var/run/secrets/argus/setup/token
  ARGUS_SETUP_TOKEN_EXPIRES_PATH: /var/run/secrets/argus/setup/expires-at
  ARGUS_MINIO_HOST: argus-minio
  ARGUS_OPENSANDBOX_HOST: opensandbox-server.{{ .Values.namespaces.sandbox }}.svc
  ARGUS_KAFKA_BROKERS: argus-kafka-kafka-bootstrap.{{ .Values.namespaces.observability }}.svc:9092
  ARGUS_CLICKHOUSE_HOST: argus-clickhouse-client.{{ .Values.namespaces.observability }}.svc
  ARGUS_CONNECTOR_ENROLLMENT_URL: {{ .Values.runtime.connectorEnrollmentURL | quote }}
  ARGUS_CONNECTOR_GATEWAY_ADDRESS: {{ .Values.runtime.connectorGatewayAddress | quote }}
  ARGUS_SYSTEM_NAMESPACE: {{ .Values.namespaces.system | quote }}
  ARGUS_CONNECTOR_ISSUER_NAME: {{ .Values.runtime.connectorIssuerName | quote }}
  ARGUS_CONNECTOR_ISSUER_GENERATION: {{ .Values.runtime.connectorIssuerGeneration | quote }}
  ARGUS_DEPLOYMENT_PROFILE: {{ .Values.profile | quote }}
  ARGUS_KEY_WRAPPING_MODE: {{ .Values.runtime.keyWrappingMode | quote }}
  ARGUS_OPENBAO_ADDRESS: {{ .Values.runtime.openBaoAddress | quote }}
  ARGUS_OPENBAO_TRANSIT_KEY: {{ .Values.runtime.openBaoTransitKey | quote }}
  ARGUS_BREAK_GLASS_ENABLED: {{ .Values.runtime.breakGlassEnabled | quote }}
  ARGUS_DIRECT_ADVERTISED_EGRESS: {{ join "," .Values.runtime.directAdvertisedEgress | quote }}
  ARGUS_DIRECT_VERIFICATION_URL: {{ .Values.runtime.directVerificationUrl | quote }}
  ARGUS_DIRECT_DENIED_CIDRS: {{ join "," .Values.runtime.directDeniedCidrs | quote }}
  ARGUS_DIRECT_EXECUTOR_ENDPOINT: {{ default (printf "argus-direct-executor.%s.svc:9444" .Values.namespaces.system) .Values.runtime.directExecutorEndpoint | quote }}
  ARGUS_DIRECT_EXECUTOR_SERVER_NAME: {{ default (printf "argus-direct-executor.%s.svc" .Values.namespaces.system) .Values.runtime.directExecutorServerName | quote }}
  ARGUS_DIRECT_EXECUTOR_CLIENT_NAMES: argus-server,argus-connector-gateway
  ARGUS_CARD_PRESENTATION_TTL: {{ .Values.runtime.cardPresentationTtl | quote }}
  ARGUS_CARD_VALIDATION_TTL: {{ .Values.runtime.cardValidationTtl | quote }}
  ARGUS_CARD_RUNTIME_VERSION: {{ .Values.runtime.cardRuntimeVersion | quote }}
  ARGUS_CARD_MAX_PRESENTATION_BYTES: {{ .Values.runtime.cardMaxPresentationBytes | int | quote }}
  ARGUS_REMOTE_ORIGIN: {{ if eq .Values.profile "production" }}{{ printf "https://%s" .Values.production.hosts.remote | quote }}{{ else }}{{ .Values.runtime.remoteOrigin | quote }}{{ end }}
  ARGUS_REMOTE_USER_LIMIT: {{ .Values.runtime.remoteUserLimit | int | quote }}
  ARGUS_REMOTE_HOST_LIMIT: {{ .Values.runtime.remoteHostLimit | int | quote }}
  ARGUS_REMOTE_ENTERPRISE_LIMIT: {{ .Values.runtime.remoteEnterpriseLimit | int | quote }}
  ARGUS_REMOTE_PEER_SERVER_NAME: argus-connector-gateway
  ARGUS_REMOTE_PEER_HEADLESS_SUFFIX: {{ printf "argus-connector-gateway-headless.%s.svc" .Values.namespaces.system | quote }}
  ARGUS_REMOTE_PEER_PORT: "9446"
  ARGUS_OBJECT_STORE_URL: {{ required "runtime.objectStoreUrl is required" .Values.runtime.objectStoreUrl | quote }}
  ARGUS_OBJECT_STORE_BUCKET: {{ required "runtime.objectStoreBucket is required" .Values.runtime.objectStoreBucket | quote }}
  ARGUS_DIRECT_EXECUTOR_RECIPIENT_ID: argus-direct-executor
  ARGUS_TELEMETRY_QUERY_ENDPOINT: {{ printf "argus-telemetry-query.%s.svc:9447" .Values.namespaces.observability | quote }}
  ARGUS_TELEMETRY_SERVER_NAME: {{ printf "argus-telemetry-query.%s.svc" .Values.namespaces.observability | quote }}
  ARGUS_TELEMETRY_ISSUER_NAME: {{ .Values.runtime.telemetryIssuerName | quote }}
  ARGUS_TELEMETRY_ISSUER_GENERATION: {{ .Values.runtime.telemetryIssuerGeneration | quote }}
  ARGUS_TELEMETRY_INGEST_GRPC_ENDPOINT: {{ .Values.runtime.telemetryIngestGrpcEndpoint | quote }}
  ARGUS_TELEMETRY_INGEST_HTTP_ENDPOINT: {{ .Values.runtime.telemetryIngestHttpEndpoint | quote }}
  ARGUS_TELEMETRY_ENROLLMENT_ENDPOINT: {{ .Values.runtime.telemetryEnrollmentEndpoint | quote }}
  ARGUS_TELEMETRY_TOOL_CATALOG_ENABLED: {{ .Values.runtime.telemetryToolCatalogEnabled | quote }}
  ARGUS_TELEMETRY_CERTIFICATE_REQUEST_NAMESPACE: {{ .Values.namespaces.observability | quote }}
  {{- if .Values.runtime.telemetryToolCatalogEnabled }}
  ARGUS_OTELCOL_SIGNING_PUBLIC_KEYS: {{ dict .Values.runtime.otelcolSigningKeyId .Values.runtime.otelcolSigningPublicKey | toJson | quote }}
  ARGUS_OTELCOL_KUBERNETES_IMAGE: {{ required "runtime.otelcolKubernetesImage is required" .Values.runtime.otelcolKubernetesImage | quote }}
  {{- else }}
  ARGUS_OTELCOL_SIGNING_PUBLIC_KEYS: "{}"
  ARGUS_OTELCOL_KUBERNETES_IMAGE: ""
  {{- end }}
  ARGUS_OTELCOL_ARTIFACT_CA_PATH: {{ if .Values.runtime.otelcolArtifactCABundleSecretName }}"/var/run/secrets/argus/otelcol-artifact-ca/ca.crt"{{ else }}""{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-runtime-secrets
  namespace: {{ .Values.namespaces.system }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
type: Opaque
stringData:
  ARGUS_DATABASE_URL: {{ printf "postgres://argus:%s@argus-postgresql:5432/argus?sslmode=disable" (required "runtime.postgresqlPassword is required" .Values.runtime.postgresqlPassword) | quote }}
  ARGUS_REDIS_URL: {{ printf "redis://:%s@argus-redis:6379/0" (required "runtime.redisPassword is required" .Values.runtime.redisPassword) | quote }}
  ARGUS_IDEMPOTENCY_ENCRYPTION_KEY: {{ required "runtime.idempotencyEncryptionKey is required" .Values.runtime.idempotencyEncryptionKey | quote }}
  ARGUS_CURSOR_SIGNING_KEY: {{ required "runtime.cursorSigningKey is required" .Values.runtime.cursorSigningKey | quote }}
  ARGUS_PENDING_ACTION_ENCRYPTION_KEY: {{ required "runtime.pendingActionEncryptionKey is required" .Values.runtime.pendingActionEncryptionKey | quote }}
  ARGUS_OBJECT_STORE_ACCESS_KEY: {{ required "runtime.objectStoreAccessKey is required" .Values.runtime.objectStoreAccessKey | quote }}
  ARGUS_OBJECT_STORE_SECRET_KEY: {{ required "runtime.objectStoreSecretKey is required" .Values.runtime.objectStoreSecretKey | quote }}
  {{- if eq .Values.runtime.keyWrappingMode "openbao_transit" }}
  ARGUS_OPENBAO_TOKEN: {{ required "runtime.openBaoToken is required" .Values.runtime.openBaoToken | quote }}
  {{- end }}
{{- if .Values.runtime.databaseRolesEnabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-database-roles
  namespace: {{ .Values.namespaces.system }}
type: Opaque
stringData:
  server-url: {{ printf "postgres://argus_server:%s@argus-postgresql:5432/argus?sslmode=disable" (required "runtime.serverDatabasePassword is required" .Values.runtime.serverDatabasePassword) | quote }}
  worker-url: {{ printf "postgres://argus_worker:%s@argus-postgresql:5432/argus?sslmode=disable" (required "runtime.workerDatabasePassword is required" .Values.runtime.workerDatabasePassword) | quote }}
  gateway-url: {{ printf "postgres://argus_gateway:%s@argus-postgresql:5432/argus?sslmode=disable" (required "runtime.gatewayDatabasePassword is required" .Values.runtime.gatewayDatabasePassword) | quote }}
  direct-executor-url: {{ printf "postgres://argus_direct_executor:%s@argus-postgresql:5432/argus?sslmode=disable" (required "runtime.directExecutorDatabasePassword is required" .Values.runtime.directExecutorDatabasePassword) | quote }}
  migration-url: {{ printf "postgres://argus_migration:%s@argus-postgresql:5432/argus?sslmode=disable" (required "runtime.migrationDatabasePassword is required" .Values.runtime.migrationDatabasePassword) | quote }}
  telemetry-ingest-url: {{ printf "postgres://argus_telemetry_ingest:%s@argus-postgresql.%s.svc:5432/argus?sslmode=disable" (required "runtime.telemetryIngestDatabasePassword is required" .Values.runtime.telemetryIngestDatabasePassword) .Values.namespaces.system | quote }}
  telemetry-writer-url: {{ printf "postgres://argus_telemetry_writer:%s@argus-postgresql.%s.svc:5432/argus?sslmode=disable" (required "runtime.telemetryWriterDatabasePassword is required" .Values.runtime.telemetryWriterDatabasePassword) .Values.namespaces.system | quote }}
{{- end }}
---
{{- if eq .Values.runtime.keyWrappingMode "local_test" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-secret-kek
  namespace: {{ .Values.namespaces.system }}
type: Opaque
stringData:
  keyring.json: {{ required "runtime.secretKEKKeyring is required" .Values.runtime.secretKEKKeyring | toJson | quote }}
{{- end }}
