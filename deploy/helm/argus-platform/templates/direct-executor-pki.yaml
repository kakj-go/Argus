spec:
  secretName: argus-connector-gateway-direct-executor-client-tls
  duration: 24h
  renewBefore: 8h
  dnsNames: [argus-connector-gateway]
  uris: [spiffe://argus.io/services/connector-gateway/direct-executor-client]
  usages: [client auth]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef:
    name: {{ .Values.pki.issuerName }}
    kind: ClusterIssuer
    group: {{ .Values.pki.issuerGroup }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argus-worker-direct-executor-client
  namespace: {{ .Values.namespaces.system }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  secretName: argus-worker-direct-executor-client-tls
