apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argus-direct-executor-server
  namespace: {{ .Values.namespaces.system }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  secretName: argus-direct-executor-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - argus-direct-executor
    - argus-direct-executor.{{ .Values.namespaces.system }}.svc
  uris: [spiffe://argus.io/services/direct-executor/server]
  usages: [server auth]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef:
    name: {{ .Values.pki.issuerName }}
    kind: ClusterIssuer
    group: {{ .Values.pki.issuerGroup }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argus-server-direct-executor-client
  namespace: {{ .Values.namespaces.system }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  secretName: argus-server-direct-executor-client-tls
  duration: 24h
  renewBefore: 8h
  dnsNames: [argus-server]
  uris: [spiffe://argus.io/services/server/client]
  usages: [client auth]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef:
    name: {{ .Values.pki.issuerName }}
    kind: ClusterIssuer
    group: {{ .Values.pki.issuerGroup }}
---
