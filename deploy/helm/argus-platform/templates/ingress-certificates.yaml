{{- $hosts := dict "enterprise" .Values.hosts.enterprise "platform" .Values.hosts.platform "cards" .Values.hosts.cards -}}
{{- with .Values.hosts.artifact }}{{- $_ := set $hosts "artifact" . -}}{{- end }}
{{- range $name, $host := $hosts }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argus-{{ $name }}
  namespace: {{ $.Values.namespaces.system }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ $.Values.releaseId | quote }}}
spec:
  secretName: argus-{{ $name }}-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames: [{{ $host | quote }}]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [server auth]
  issuerRef:
    name: {{ $.Values.pki.issuerName }}
    kind: ClusterIssuer
    group: {{ $.Values.pki.issuerGroup }}
{{- end }}
