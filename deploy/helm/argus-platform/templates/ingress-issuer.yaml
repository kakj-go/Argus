{{- if eq .Values.pki.mode "managed" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.pki.issuerName }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
spec:
  ca:
    secretName: {{ .Values.pki.rootSecretName }}
{{- end }}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ .Values.pki.bundleName }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
spec:
  sources:
    - configMap:
        name: {{ .Values.pki.trustSourceName }}
        key: {{ .Values.pki.trustSourceKey }}
  target:
    configMap:
      key: ca.crt
      metadata:
        labels:
          app.kubernetes.io/part-of: argus
          argus.io/release-id: {{ .Values.releaseId | quote }}
    namespaceSelector:
      matchLabels:
        argus.io/release-id: {{ .Values.releaseId | quote }}
