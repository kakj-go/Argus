apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-direct-executor
  namespace: {{ .Values.namespaces.system }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argus-direct-executor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-connector-gateway
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 22}
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5985}
        - {protocol: TCP, port: 5986}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-postgresql
      ports:
        - {protocol: TCP, port: 5432}
{{- if eq .Values.profile "evaluation" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-worker
  namespace: {{ .Values.namespaces.system }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argus-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-postgresql
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-redis
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-direct-executor
      ports: [{protocol: TCP, port: 9444}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-connector-gateway
      ports: [{protocol: TCP, port: 9443}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.observability }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-telemetry-query
      ports: [{protocol: TCP, port: 9447}]
    # Model endpoint addresses are revalidated by PublicEndpointPolicy before
    # every dial and redirect. NetworkPolicy supplies the HTTPS transport gate.
    - ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.sandbox }}
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8080}
    {{- range .Values.runtime.sandboxAllowedCidrs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- else }}
{{- range $pool := list "agent" "action" "compaction" "automation" "sandbox" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-worker-{{ $pool }}
  namespace: {{ $.Values.namespaces.system }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argus-worker-{{ $pool }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-postgresql
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-redis
      ports:
        - {protocol: TCP, port: 6379}
    {{- if or (eq $pool "agent") (eq $pool "action") (eq $pool "automation") }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-direct-executor
      ports:
        - {protocol: TCP, port: 9444}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-connector-gateway
      ports:
        - {protocol: TCP, port: 9443}
    {{- end }}
    {{- if or (eq $pool "agent") (eq $pool "automation") }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.namespaces.observability }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-telemetry-query
      ports:
        - {protocol: TCP, port: 9447}
    {{- end }}
    {{- if or (eq $pool "agent") (eq $pool "compaction") }}
    # Model endpoint addresses are revalidated by PublicEndpointPolicy before
    # every dial and redirect. NetworkPolicy supplies the HTTPS transport gate.
    - ports:
        - {protocol: TCP, port: 443}
    {{- end }}
    {{- if eq $pool "sandbox" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.namespaces.sandbox }}
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8080}
    {{- range $.Values.runtime.sandboxAllowedCidrs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-connector-gateway-remote-access
  namespace: {{ .Values.namespaces.system }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argus-connector-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9443}
        - {protocol: TCP, port: 9445}
        - {protocol: TCP, port: 9446}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-postgresql
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-redis
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-direct-executor
      ports: [{protocol: TCP, port: 9444}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argus-connector-gateway
      ports: [{protocol: TCP, port: 9446}]
    {{- $kubernetesService := lookup "v1" "Service" "default" "kubernetes" }}
    {{- if and $kubernetesService $kubernetesService.spec.clusterIP }}
    - to:
        - ipBlock:
            cidr: {{ printf "%s/%s" $kubernetesService.spec.clusterIP (ternary "128" "32" (contains ":" $kubernetesService.spec.clusterIP)) | quote }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    {{- end }}
    {{- $kubernetesEndpoints := lookup "v1" "Endpoints" "default" "kubernetes" }}
    {{- if $kubernetesEndpoints }}
    {{- range $subset := $kubernetesEndpoints.subsets }}
    {{- range $address := $subset.addresses }}
    - to:
        - ipBlock:
            cidr: {{ printf "%s/%s" $address.ip (ternary "128" "32" (contains ":" $address.ip)) | quote }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range .Values.runtime.kubernetesApiCidrs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 9000}
