apiVersion: batch/v1
kind: Job
metadata:
  name: argus-postgresql-migration
  namespace: {{ .Values.namespaces.system }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-postgresql-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.images.backend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/usr/local/bin/argus-migrate"]
          args: ["up"]
          envFrom:
            - secretRef:
                name: argus-runtime-secrets
          env:
            - {name: ARGUS_MIGRATIONS_DIR, value: /usr/local/share/argus/migrations/postgresql}
