apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-pki-controller
  namespace: {{ .Values.namespaces.system }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-pki-controller-trust-source
  namespace: cert-manager
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.pki.trustSourceName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-pki-controller-trust-source
  namespace: cert-manager
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
subjects:
  - {kind: ServiceAccount, name: argus-pki-controller, namespace: {{ .Values.namespaces.system }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argus-pki-controller-trust-source}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.releaseId }}-pki-target-issuer-reader
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    resourceNames: [{{ .Values.pki.issuerName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.releaseId }}-pki-target-issuer-reader
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
subjects:
  - {kind: ServiceAccount, name: argus-pki-controller, namespace: {{ .Values.namespaces.system }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Values.releaseId }}-pki-target-issuer-reader}
{{- range $namespace := list .Values.namespaces.system .Values.namespaces.observability .Values.namespaces.sandbox }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-pki-controller-material
  namespace: {{ $namespace }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ $.Values.releaseId | quote }}}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $.Values.pki.bundleName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-pki-controller-material
  namespace: {{ $namespace }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ $.Values.releaseId | quote }}}
subjects:
  - {kind: ServiceAccount, name: argus-pki-controller, namespace: {{ $.Values.namespaces.system }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argus-pki-controller-material}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-pki-controller
  namespace: {{ .Values.namespaces.system }}
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: argus-pki-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: argus-pki-controller, app.kubernetes.io/part-of: argus}
    spec:
      serviceAccountName: argus-pki-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: argus-pki-controller
          image: {{ .Values.images.backend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [/usr/local/bin/argus-pki-controller]
          env:
            - name: ARGUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ ternary "argus-database-roles" "argus-runtime-secrets" .Values.runtime.databaseRolesEnabled }}
                  key: {{ ternary "worker-url" "ARGUS_DATABASE_URL" .Values.runtime.databaseRolesEnabled }}
            - {name: ARGUS_RELEASE_ID, value: {{ .Values.releaseId | quote }}}
            - {name: ARGUS_PKI_MODE, value: {{ .Values.pki.mode | quote }}}
            - {name: ARGUS_PKI_TRUST_SOURCE_NAME, value: {{ .Values.pki.trustSourceName | quote }}}
            - {name: ARGUS_PKI_TRUST_BUNDLE_NAME, value: {{ .Values.pki.bundleName | quote }}}
            - {name: ARGUS_PKI_TARGET_NAMESPACES, value: {{ join "," (list .Values.namespaces.system .Values.namespaces.observability .Values.namespaces.sandbox) | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
