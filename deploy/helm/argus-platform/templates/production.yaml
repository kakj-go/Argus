{{- if eq .Values.profile "production" }}
{{- range $name := list "argus-web" "argus-server" "argus-worker" "argus-direct-executor" "argus-connector-gateway" "argus-telemetry-ingest" "argus-telemetry-query" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespaces.system }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- range $name := list "argus-server" "argus-worker" "argus-direct-executor" "argus-connector-gateway" "argus-telemetry-ingest" "argus-telemetry-query" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespaces.system }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $.Values.production.minReplicas }}
  maxReplicas: {{ $.Values.production.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus-web
  namespace: {{ .Values.namespaces.system }}
spec:
  ingressClassName: {{ .Values.production.ingressClassName }}
  rules:
    - host: {{ .Values.production.hosts.enterprise }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: enterprise}}
    - host: {{ .Values.production.hosts.platform }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: platform}}
    - host: {{ .Values.production.hosts.setup }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: setup}}
{{- end }}
