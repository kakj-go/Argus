{{- if eq .Values.profile "production" }}
{{- $workers := list "argus-worker-agent" "argus-worker-action" "argus-worker-compaction" "argus-worker-sandbox" -}}
{{- range $name := concat (list "argus-web" "argus-server" "argus-direct-executor" "argus-connector-gateway") $workers }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespaces.system }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- range $name := concat (list "argus-server" "argus-direct-executor" "argus-connector-gateway") $workers }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespaces.system }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  {{- $poolName := trimPrefix "argus-worker-" $name }}
  {{- if hasKey $.Values.workerPools $poolName }}
  minReplicas: {{ (index $.Values.workerPools $poolName).production.minReplicas }}
  maxReplicas: {{ (index $.Values.workerPools $poolName).production.maxReplicas }}
  {{- else }}
  minReplicas: {{ $.Values.production.minReplicas }}
  maxReplicas: {{ $.Values.production.maxReplicas }}
  {{- end }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus-web
  namespace: {{ .Values.namespaces.system }}
spec:
  ingressClassName: {{ .Values.production.ingressClassName }}
  rules:
    - host: {{ .Values.production.hosts.enterprise }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: enterprise}}
    - host: {{ .Values.production.hosts.platform }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: platform}}
    - host: {{ .Values.production.hosts.cards }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: cards}}
    - host: {{ .Values.production.hosts.remote }}
      http:
        paths:
          - path: /v1/sessions
            pathType: Prefix
            backend:
              service: {name: argus-connector-gateway, port: {name: remote-wss}}
{{- end }}
