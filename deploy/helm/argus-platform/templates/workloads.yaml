{{- $root := . -}}
{{- $workloads := list
  (dict "name" "argus-server" "command" "argus-server" "args" (list) "port" 8080 "healthPort" 8080)
  (dict "name" "argus-worker-agent" "command" "argus-worker" "args" (list "--pool=agent") "pool" "agent" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-worker-action" "command" "argus-worker" "args" (list "--pool=action") "pool" "action" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-worker-compaction" "command" "argus-worker" "args" (list "--pool=compaction") "pool" "compaction" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-worker-automation" "command" "argus-worker" "args" (list "--pool=automation") "pool" "automation" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-worker-sandbox" "command" "argus-worker" "args" (list "--pool=sandbox") "pool" "sandbox" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-direct-executor" "command" "argus-worker" "args" (list "--pool=direct-executor") "port" 8081 "healthPort" 8081)
  (dict "name" "argus-connector-gateway" "command" "argus-connector-gateway" "args" (list) "port" 8081 "healthPort" 8081)
  (dict "name" "argus-telemetry-ingest" "command" "argus-telemetry" "args" (list "--mode=ingest") "port" 8081 "healthPort" 8081)
  (dict "name" "argus-telemetry-query" "command" "argus-telemetry" "args" (list "--mode=query") "port" 8081 "healthPort" 8081)
-}}
{{- range $item := $workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $item.name }}
  namespace: {{ $root.Values.namespaces.system }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ $root.Values.releaseId | quote }}
spec:
  replicas: {{- if hasKey $item "pool" -}}
    {{- $pool := index $root.Values.workerPools $item.pool -}}
    {{- if eq $root.Values.profile "production" }} {{ $pool.production.minReplicas }}{{ else }} {{ $pool.replicas }}{{ end -}}
  {{- else if eq $root.Values.profile "production" }} {{ $root.Values.production.minReplicas }}{{ else }} {{ $root.Values.replicas }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $item.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $item.name }}
        app.kubernetes.io/part-of: argus
    spec:
      {{- if or (eq $item.name "argus-server") (hasKey $item "pool") (eq $item.name "argus-connector-gateway") }}
      serviceAccountName: {{ if hasKey $item "pool" }}argus-worker{{ else }}{{ $item.name }}{{ end }}
      {{- end }}
      {{- if eq $root.Values.profile "production" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $item.name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $item.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ if eq $item.name "argus-connector-gateway" }}45{{ else if hasKey $item "pool" }}30{{ else }}15{{ end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $item.name }}
          image: {{ $root.Values.images.backend }}
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          command: ["/usr/local/bin/{{ $item.command }}"]
          {{- if $item.args }}
          args: {{ $item.args | toJson }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: argus-runtime-config
            - secretRef:
                name: argus-runtime-secrets
          {{- if or (eq $item.name "argus-server") (hasKey $item "pool") (eq $item.name "argus-direct-executor") (eq $item.name "argus-connector-gateway") }}
          volumeMounts:
            - name: secret-kek
              mountPath: /var/run/secrets/argus/secret-kek
              readOnly: true
          {{- if or (eq $item.name "argus-server") (hasKey $item "pool") }}
          {{- if eq $item.name "argus-server" }}
            - name: setup-token
              mountPath: /var/run/secrets/argus/setup
              readOnly: true
          {{- end }}
            - name: direct-executor-client
              mountPath: /var/run/secrets/argus/direct-executor-client
              readOnly: true
            - name: direct-executor-ca
              mountPath: /var/run/secrets/argus/direct-executor-ca
              readOnly: true
          {{- end }}
          {{- if eq $item.name "argus-direct-executor" }}
            - name: direct-executor-tls
              mountPath: /var/run/secrets/argus/direct-executor
              readOnly: true
            - name: direct-executor-ca
              mountPath: /var/run/secrets/argus/direct-executor-ca
              readOnly: true
          {{- end }}
          {{- if eq $item.name "argus-connector-gateway" }}
            - name: connector-gateway-tls
              mountPath: /var/run/secrets/argus/connector-gateway
              readOnly: true
            - name: connector-ca
              mountPath: /var/run/secrets/argus/connector-ca
              readOnly: true
          {{- end }}
          {{- end }}
          {{- if ne $item.name "argus-server" }}
          env:
            - {name: ARGUS_HEALTH_ADDRESS, value: ":8081"}
          {{- end }}
          ports:
            - {name: health, containerPort: {{ $item.healthPort }}}
          {{- if eq $item.name "argus-connector-gateway" }}
            - {name: connector, containerPort: 9443}
          {{- end }}
          {{- if eq $item.name "argus-direct-executor" }}
            - {name: direct-rpc, containerPort: 9444}
          {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- if hasKey $item "pool" }}
            {{- toYaml (index $root.Values.workerPools $item.pool).resources | nindent 12 }}
            {{- else }}
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
            {{- end }}
      {{- if or (eq $item.name "argus-server") (hasKey $item "pool") (eq $item.name "argus-direct-executor") (eq $item.name "argus-connector-gateway") }}
      volumes:
        - name: secret-kek
          secret:
            secretName: argus-secret-kek
      {{- if or (eq $item.name "argus-server") (hasKey $item "pool") }}
      {{- if eq $item.name "argus-server" }}
        - name: setup-token
          secret:
            secretName: {{ required "setupTokenSecretName is required" $root.Values.setupTokenSecretName }}
            items:
              - {key: setup-token, path: token}
              - {key: setup-token-expires-at, path: expires-at}
      {{- end }}
        - name: direct-executor-client
          secret:
            secretName: argus-server-direct-executor-client-tls
        - name: direct-executor-ca
          secret:
            secretName: argus-direct-executor-root-ca
            items:
              - {key: ca.crt, path: ca.crt}
      {{- end }}
      {{- if eq $item.name "argus-direct-executor" }}
        - name: direct-executor-tls
          secret:
            secretName: argus-direct-executor-tls
        - name: direct-executor-ca
          secret:
            secretName: argus-direct-executor-root-ca
            items:
              - {key: ca.crt, path: ca.crt}
      {{- end }}
      {{- if eq $item.name "argus-connector-gateway" }}
        - name: connector-gateway-tls
          secret:
            secretName: argus-connector-gateway-tls
        - name: connector-ca
          secret:
            secretName: argus-connector-root-ca
            items:
              - {key: ca.crt, path: ca.crt}
      {{- end }}
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-server
  namespace: {{ .Values.namespaces.system }}
spec:
  selector: {app.kubernetes.io/name: argus-server}
  ports:
    - {name: http, port: 8080, targetPort: health}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-direct-executor
  namespace: {{ .Values.namespaces.system }}
spec:
  selector: {app.kubernetes.io/name: argus-direct-executor}
  ports:
    - {name: direct-rpc, port: 9444, targetPort: direct-rpc}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-connector-gateway
  namespace: {{ .Values.namespaces.system }}
  {{- if eq .Values.profile "production" }}
  annotations:
    {{- toYaml .Values.production.connectorService.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ if eq .Values.profile "production" }}{{ .Values.production.connectorService.type }}{{ else }}ClusterIP{{ end }}
  {{- if and (eq .Values.profile "production") (or (eq .Values.production.connectorService.type "LoadBalancer") (eq .Values.production.connectorService.type "NodePort")) }}
  externalTrafficPolicy: Local
  {{- end }}
  selector: {app.kubernetes.io/name: argus-connector-gateway}
  ports:
    - {name: health, port: 8081, targetPort: health}
    - {name: connector, port: 9443, targetPort: connector}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-telemetry-ingest
  namespace: {{ .Values.namespaces.system }}
spec:
  selector: {app.kubernetes.io/name: argus-telemetry-ingest}
  ports:
    - {name: health, port: 8081, targetPort: health}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-telemetry-query
  namespace: {{ .Values.namespaces.system }}
spec:
  selector: {app.kubernetes.io/name: argus-telemetry-query}
  ports:
    - {name: health, port: 8081, targetPort: health}
