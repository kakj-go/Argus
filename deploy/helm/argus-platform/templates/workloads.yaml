{{- $root := . -}}
{{- $workers := list
  (dict "name" "argus-worker-agent" "command" "argus-worker" "args" (list "--pool=agent") "worker" true "pool" "agent" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-worker-action" "command" "argus-worker" "args" (list "--pool=action") "worker" true "pool" "action" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-worker-compaction" "command" "argus-worker" "args" (list "--pool=compaction") "worker" true "pool" "compaction" "port" 8081 "healthPort" 8081)
  (dict "name" "argus-worker-sandbox" "command" "argus-worker" "args" (list "--pool=sandbox") "worker" true "pool" "sandbox" "port" 8081 "healthPort" 8081)
-}}
{{- if eq $root.Values.profile "evaluation" -}}
{{- $workers = list (dict "name" "argus-worker" "command" "argus-worker" "args" (list "--pool=default") "worker" true "port" 8081 "healthPort" 8081) -}}
{{- end -}}
{{- $workloads := concat
  (list (dict "name" "argus-server" "command" "argus-server" "args" (list) "port" 8080 "healthPort" 8080))
  $workers
  (list
  (dict "name" "argus-direct-executor" "command" "argus-worker" "args" (list "--pool=direct-executor") "port" 8081 "healthPort" 8081)
  (dict "name" "argus-connector-gateway" "command" "argus-connector-gateway" "args" (list) "port" 8081 "healthPort" 8081)
  )
-}}
{{- range $item := $workloads }}
{{- $isWorker := hasKey $item "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $item.name }}
  namespace: {{ $root.Values.namespaces.system }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ $root.Values.releaseId | quote }}
spec:
  replicas: {{- if hasKey $item "pool" -}}
    {{- $pool := index $root.Values.workerPools $item.pool -}}
    {{- if eq $root.Values.profile "production" }} {{ $pool.production.minReplicas }}{{ else }} {{ $pool.replicas }}{{ end -}}
  {{- else if $isWorker }} {{ $root.Values.worker.replicas }}
  {{- else if eq $root.Values.profile "production" }} {{ $root.Values.production.minReplicas }}{{ else }} {{ $root.Values.replicas }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $item.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $item.name }}
        app.kubernetes.io/part-of: argus
      annotations:
        checksum/runtime-config: {{ include (print $root.Template.BasePath "/config.yaml") $root | sha256sum }}
    spec:
      {{- if or (eq $item.name "argus-server") $isWorker (eq $item.name "argus-connector-gateway") }}
      serviceAccountName: {{ if $isWorker }}argus-worker{{ else }}{{ $item.name }}{{ end }}
      {{- end }}
      {{- if eq $root.Values.profile "production" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $item.name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $item.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ if or (eq $item.name "argus-connector-gateway") (eq $item.name "argus-direct-executor") }}100{{ else if $isWorker }}30{{ else }}15{{ end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $item.name }}
          image: {{ $root.Values.images.backend }}
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          command: ["/usr/local/bin/{{ $item.command }}"]
          {{- if $item.args }}
          args: {{ $item.args | toJson }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: argus-runtime-config
            - secretRef:
                name: argus-runtime-secrets
          {{- if or (eq $item.name "argus-server") $isWorker (eq $item.name "argus-direct-executor") (eq $item.name "argus-connector-gateway") }}
          volumeMounts:
            - name: argus-trust
              mountPath: /var/run/secrets/argus/trust
              readOnly: true
          {{- if eq $root.Values.runtime.keyWrappingMode "local_test" }}
            - name: secret-kek
              mountPath: /var/run/secrets/argus/secret-kek
              readOnly: true
          {{- end }}
          {{- if or (eq $item.name "argus-server") $isWorker }}
          {{- if eq $item.name "argus-server" }}
            - name: setup-token
              mountPath: /var/run/secrets/argus/setup
              readOnly: true
          {{- end }}
          {{- if $root.Values.runtime.telemetryToolCatalogEnabled }}
            - name: telemetry-client
              mountPath: /var/run/secrets/argus/telemetry-client
              readOnly: true
          {{- end }}
            - name: direct-executor-client
              mountPath: /var/run/secrets/argus/direct-executor-client
              readOnly: true
          {{- end }}
          {{- end }}
          {{- if eq $item.name "argus-direct-executor" }}
            - name: direct-executor-tls
              mountPath: /var/run/secrets/argus/direct-executor
              readOnly: true
          {{- end }}
          {{- if eq $item.name "argus-connector-gateway" }}
            - name: connector-gateway-tls
              mountPath: /var/run/secrets/argus/connector-gateway
              readOnly: true
            - name: connector-gateway-peer-client
              mountPath: /var/run/secrets/argus/connector-gateway-peer-client
              readOnly: true
            - name: direct-executor-client
              mountPath: /var/run/secrets/argus/direct-executor-client
              readOnly: true
          {{- end }}
          {{- if or $root.Values.runtime.databaseRolesEnabled (ne $item.name "argus-server") }}
          env:
          {{- if $root.Values.runtime.databaseRolesEnabled }}
            - name: ARGUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: argus-database-roles
                  key: {{ if eq $item.name "argus-server" }}server-url{{ else if $isWorker }}worker-url{{ else if eq $item.name "argus-connector-gateway" }}gateway-url{{ else }}direct-executor-url{{ end }}
          {{- end }}
          {{- if ne $item.name "argus-server" }}
            - {name: ARGUS_HEALTH_ADDRESS, value: ":8081"}
          {{- if eq $item.name "argus-direct-executor" }}
            - name: ARGUS_DIRECT_EXECUTOR_INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          {{- end }}
          {{- if eq $item.name "argus-connector-gateway" }}
            - name: ARGUS_GATEWAY_INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if eq $item.name "argus-direct-executor" }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          {{- end }}
          ports:
            - {name: health, containerPort: {{ $item.healthPort }}}
          {{- if eq $item.name "argus-connector-gateway" }}
            - {name: connector, containerPort: 9443}
            - {name: remote-wss, containerPort: 9445}
            - {name: remote-rpc, containerPort: 9446}
          {{- end }}
          {{- if eq $item.name "argus-direct-executor" }}
            - {name: direct-rpc, containerPort: 9444}
          {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- if hasKey $item "pool" }}
            {{- toYaml (index $root.Values.workerPools $item.pool).resources | nindent 12 }}
            {{- else if $isWorker }}
            {{- toYaml $root.Values.worker.resources | nindent 12 }}
            {{- else }}
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
            {{- end }}
      {{- if or (eq $item.name "argus-server") $isWorker (eq $item.name "argus-direct-executor") (eq $item.name "argus-connector-gateway") }}
      volumes:
        - name: argus-trust
          configMap:
            name: {{ $root.Values.runtime.trustBundleConfigMapName }}
            items:
              - {key: ca.crt, path: ca.crt}
      {{- if eq $root.Values.runtime.keyWrappingMode "local_test" }}
        - name: secret-kek
          secret:
            secretName: argus-secret-kek
      {{- end }}
      {{- if or (eq $item.name "argus-server") $isWorker }}
      {{- if eq $item.name "argus-server" }}
        - name: setup-token
          secret:
            secretName: {{ required "setupTokenSecretName is required" $root.Values.setupTokenSecretName }}
            items:
              - {key: setup-token, path: token}
              - {key: setup-token-expires-at, path: expires-at}
      {{- end }}
      {{- if $root.Values.runtime.telemetryToolCatalogEnabled }}
        - name: telemetry-client
          secret:
            secretName: {{ ternary "argus-worker-telemetry-client-tls" "argus-server-telemetry-client-tls" $isWorker }}
      {{- end }}
        - name: direct-executor-client
          secret:
            secretName: {{ ternary "argus-worker-direct-executor-client-tls" "argus-server-direct-executor-client-tls" $isWorker }}
      {{- end }}
      {{- end }}
      {{- if eq $item.name "argus-direct-executor" }}
        - name: direct-executor-tls
          secret:
            secretName: argus-direct-executor-tls
      {{- end }}
      {{- if eq $item.name "argus-connector-gateway" }}
        - name: connector-gateway-tls
          secret:
            secretName: argus-connector-gateway-tls
        - name: connector-gateway-peer-client
          secret:
            secretName: argus-connector-gateway-peer-client-tls
        - name: direct-executor-client
          secret:
            secretName: argus-connector-gateway-direct-executor-client-tls
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-server
  namespace: {{ .Values.namespaces.system }}
spec:
  selector: {app.kubernetes.io/name: argus-server}
  ports:
    - {name: http, port: 8080, targetPort: health}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-direct-executor
  namespace: {{ .Values.namespaces.system }}
spec:
  selector: {app.kubernetes.io/name: argus-direct-executor}
  ports:
    - {name: direct-rpc, port: 9444, targetPort: direct-rpc}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-connector-gateway
  namespace: {{ .Values.namespaces.system }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: argus-connector-gateway}
  ports:
    - {name: health, port: 8081, targetPort: health}
    - {name: connector, port: 9443, targetPort: connector}
    - {name: remote-wss, port: 9445, targetPort: remote-wss}
    - {name: remote-rpc, port: 9446, targetPort: remote-rpc}
---
# Public TCP entry for the connector mTLS channel (grpcs://<hosts.connector>:9443).
# LoadBalancer TCP passthrough only; TLS is terminated by the gateway's own PKI.
apiVersion: v1
kind: Service
metadata:
  name: argus-connector-gateway-public
  namespace: {{ .Values.namespaces.system }}
  annotations:
    {{- toYaml .Values.connectorPublicService.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: argus-connector-gateway}
  ports:
    - {name: connector, port: 9443, targetPort: connector}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-connector-gateway-headless
  namespace: {{ .Values.namespaces.system }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: argus-connector-gateway}
  ports:
    - {name: remote-rpc, port: 9446, targetPort: remote-rpc}
