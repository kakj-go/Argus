releaseId: argus
profile: evaluation
namespaces:
  system: argus-system
  sandbox: argus-sandbox
  observability: argus-observability
hosts:
  enterprise: argus.example.com
  platform: platform.argus.example.com
  cards: cards.argus.example.com
  connector: connector.argus.example.com
  # Collector 产物(经 MinIO)的对外 HTTPS 源;为空时不创建产物路由。
  artifact: artifacts.argus.example.com
images:
  backend: host.docker.internal:5001/argus/argus-backend:dev
  web: host.docker.internal:5001/argus/argus-web:dev
  pullPolicy: Never
  postgresql: postgres:18.6-alpine
setupTokenSecretName: argus-generated-secrets
network:
  policyApiSupported: true
  policyEnforcement: unverified
  egressMode: default-route
  egressStatus: absent
  egressProvider: ""
  protectedCidrs: []
  protectedAddresses: []
runtime:
  postgresqlPassword: ""
  redisPassword: ""
  idempotencyEncryptionKey: ""
  cursorSigningKey: ""
  pendingActionEncryptionKey: ""
  secretKEKKeyring: {}
  keyWrappingMode: local_test
  openBaoAddress: ""
  openBaoToken: ""
  openBaoTransitKey: argus-local-hardening
  breakGlassEnabled: false
  platformMfaRequired: false
  databaseRolesEnabled: false
  serverDatabasePassword: ""
  workerDatabasePassword: ""
  gatewayDatabasePassword: ""
  directExecutorDatabasePassword: ""
  migrationDatabasePassword: ""
  telemetryIngestDatabasePassword: ""
  telemetryWriterDatabasePassword: ""
  telemetryQueryDatabasePassword: ""
  connectorEnrollmentURL: https://argus.example.com
  connectorGatewayAddress: grpcs://connector.argus.example.com:9443
  connectorIssuerName: argus-connector-ca
  connectorIssuerGeneration: 1
  directAdvertisedEgress: []
  directVerificationUrl: ""
  directDeniedCidrs: []
  kubernetesApiCidrs: []
  sandboxAllowedCidrs: []
  directExecutorEndpoint: ""
  directExecutorServerName: ""
  allowedOrigins:
    - https://argus.example.com
    - https://platform.argus.example.com
    - https://cards.argus.example.com
  secureCookies: true
  cardPresentationTtl: 10m
  cardValidationTtl: 30m
  cardRuntimeVersion: argus-card-runtime/v1
  cardMaxPresentationBytes: 1048576
  # 终端 WSS 与企业门户同源（wss://<enterprise>/v1/sessions），无独立远程域名。
  remoteOrigin: https://argus.example.com
  remoteUserLimit: 3
  remoteHostLimit: 5
  remoteEnterpriseLimit: 50
  objectStoreUrl: ""
  objectStoreBucket: argus-remote-recordings
  objectStoreAccessKey: ""
  objectStoreSecretKey: ""
  telemetryKafkaUsername: argus-telemetry
  telemetryKafkaPassword: ""
  telemetryClickhouseMigrationPassword: ""
  telemetryClickhouseWriterPassword: ""
  telemetryClickhouseQueryPassword: ""
  telemetryIssuerName: argus-telemetry-ca
  telemetryIssuerGeneration: 1
  # 外部 Collector(主机/外部集群)可达的 ingest 主机名;为空时仅用集群内
  # Service 地址(E2E 同集群目标)。设置后:证书追加该 SAN,并创建公网 LB。
  telemetryExternalIngestHost: ""
  telemetryIngestGrpcEndpoint: grpcs://argus-telemetry-ingest.argus-observability.svc:4317
  telemetryIngestHttpEndpoint: https://argus-telemetry-ingest.argus-observability.svc:4318
  telemetryEnrollmentEndpoint: https://argus-telemetry-ingest.argus-observability.svc:4318/v1/identity/enroll
  telemetryToolCatalogEnabled: true
  otelcolVersion: 0.1.0-m7
  otelcolLinuxArm64Uri: ""
  otelcolLinuxArm64Sha256: ""
  otelcolLinuxArm64Signature: ""
  otelcolLinuxArm64ByteSize: 0
  otelcolLinuxAmd64Uri: ""
  otelcolLinuxAmd64Sha256: ""
  otelcolLinuxAmd64Signature: ""
  otelcolLinuxAmd64ByteSize: 0
  otelcolWindowsAmd64Uri: ""
  otelcolWindowsAmd64Sha256: ""
  otelcolWindowsAmd64Signature: ""
  otelcolWindowsAmd64ByteSize: 0
  otelcolSigningKeyId: ""
  otelcolSigningPublicKey: ""
  otelcolKubernetesImage: ""
  otelcolArtifactCABundleSecretName: ""
  # verify(默认)| insecure:insecure 跳过产物下载的传输层证书校验(本地自签),
  # 签名校验恒定执行。
  otelcolArtifactTLSMode: ""
  certManagerNamespace: cert-manager
ingressClassName: nginx
tls:
  enabled: true
  mode: cert-manager-selfsigned
  issuerName: ""
  issuerKind: ClusterIssuer
  secretName: ""
connectorPublicService:
  annotations: {}
replicas: 1
worker:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
workerPools:
  agent:
    replicas: 1
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
    production: {minReplicas: 3, maxReplicas: 10}
  action:
    replicas: 1
    resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: "1", memory: 384Mi}}
    production: {minReplicas: 3, maxReplicas: 10}
  compaction:
    replicas: 1
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
    production: {minReplicas: 2, maxReplicas: 8}
  sandbox:
    replicas: 1
    resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
    production: {minReplicas: 2, maxReplicas: 6}
production:
  minReplicas: 3
  maxReplicas: 10
