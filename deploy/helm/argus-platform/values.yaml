releaseId: argus
profile: evaluation
namespaces:
  system: argus-system
  sandbox: argus-sandbox
  observability: argus-observability
images:
  backend: host.docker.internal:5001/argus/argus-backend:dev
  web: host.docker.internal:5001/argus/argus-web:dev
  pullPolicy: Never
  postgresql: postgres:18.6-alpine
setupTokenSecretName: argus-generated-secrets
runtime:
  postgresqlPassword: ""
  redisPassword: ""
  idempotencyEncryptionKey: ""
  cursorSigningKey: ""
  pendingActionEncryptionKey: ""
  secretKEKKeyring: {}
  connectorEnrollmentURL: http://localhost:8080
  connectorGatewayAddress: grpcs://localhost:9443
  connectorIssuerName: argus-connector-ca
  connectorIssuerGeneration: 1
  directAdvertisedEgress: []
  directVerificationUrl: ""
  directDeniedCidrs: []
  sandboxAllowedCidrs: []
  directExecutorEndpoint: ""
  directExecutorServerName: ""
  allowedOrigins:
    - http://localhost:4173
    - http://localhost:4174
    - http://localhost:4175
  secureCookies: false
replicas: 1
workerPools:
  agent:
    replicas: 1
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
    production: {minReplicas: 3, maxReplicas: 10}
  action:
    replicas: 1
    resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: "1", memory: 384Mi}}
    production: {minReplicas: 3, maxReplicas: 10}
  compaction:
    replicas: 1
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
    production: {minReplicas: 2, maxReplicas: 8}
  automation:
    replicas: 1
    resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
    production: {minReplicas: 2, maxReplicas: 6}
  sandbox:
    replicas: 1
    resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
    production: {minReplicas: 2, maxReplicas: 6}
production:
  minReplicas: 3
  maxReplicas: 10
  ingressClassName: nginx
  hosts:
    enterprise: argus.example.com
    platform: platform.argus.example.com
    setup: setup.argus.example.com
    cards: cards.argus.example.com
    connector: connector.argus.example.com
  connectorService:
    type: LoadBalancer
    annotations: {}
