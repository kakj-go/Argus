apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-telemetry-clickhouse-migration
  namespace: {{ .Values.namespace }}
data:
  00001_m7_telemetry.sql: |
{{ .Files.Get "files/00001_m7_telemetry.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-clickhouse-telemetry-migration
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {labels: {app.kubernetes.io/name: argus-clickhouse-telemetry-migration}}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: argus-clickhouse-telemetry-migration
      containers:
        - name: migrate
          image: {{ .Values.images.clickhouse }}
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: argus-telemetry-clickhouse, key: migration-password}}
          command: [sh, -ec]
          args:
            - |
              until clickhouse-client --host argus-clickhouse-client --user argus_telemetry_migration --password "$CLICKHOUSE_PASSWORD" --query 'SELECT 1'; do sleep 3; done
              clickhouse-client --host argus-clickhouse-client --user argus_telemetry_migration --password "$CLICKHOUSE_PASSWORD" --multiquery < /migrations/00001_m7_telemetry.sql
          volumeMounts:
            - {name: migration, mountPath: /migrations, readOnly: true}
      volumes:
        - {name: migration, configMap: {name: argus-telemetry-clickhouse-migration}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-clickhouse-telemetry-migration
  namespace: {{ .Values.namespace }}
