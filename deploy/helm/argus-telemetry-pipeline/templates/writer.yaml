apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-clickhouse-writer
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      kafka/logs:
        brokers: [{{ .Values.kafka.brokers | quote }}]
        logs:
          topics: [otlp-logs]
          encoding: otlp_proto
      kafka/metrics:
        brokers: [{{ .Values.kafka.brokers | quote }}]
        metrics:
          topics: [otlp-metrics]
          encoding: otlp_proto
      kafka/traces:
        brokers: [{{ .Values.kafka.brokers | quote }}]
        traces:
          topics: [otlp-spans]
          encoding: otlp_proto
    processors:
      batch:
        timeout: 1s
    exporters:
      clickhouse:
        endpoint: {{ .Values.clickhouse.endpoint | quote }}
        database: argus
        username: argus
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: false
        timeout: 10s
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [kafka/logs]
          processors: [batch]
          exporters: [clickhouse]
        metrics:
          receivers: [kafka/metrics]
          processors: [batch]
          exporters: [clickhouse]
        traces:
          receivers: [kafka/traces]
          processors: [batch]
          exporters: [clickhouse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-clickhouse-writer
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ .Values.releaseId | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-clickhouse-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-clickhouse-writer
        app.kubernetes.io/part-of: argus
    spec:
      containers:
        - name: writer
          image: {{ .Values.images.otelCollector }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argus-clickhouse-credentials
                  key: password
          ports:
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
      volumes:
        - name: config
          configMap:
            name: otel-clickhouse-writer
